<!doctype html>
<meta charset="utf-8">
<title>Scaly programs compiled in the page, on its card</title>
<pre id="out">running</pre>
<script type="module">
// The compiler itself in the page (web/repl: scaly.wasm, worker.mjs), as the
// tour runs a step: `scaly run --gpu main.scaly`, the program compiled here
// and run as a side module of the compiler, its loops offered to the page's
// card. Per program of sources.json one run per mode it names; one line per
// run -- tests/gpu/web/run.sh decides what they must say.
import { loadCompiler } from './load.mjs';

const lines = [];
const first = new Map();     // a picture as the first run of its program wrote it
function run(compiler, name, text, mode) {
  return new Promise(resolve => {
    const worker = new Worker('worker.mjs', { type: 'module' });
    const stdin = new SharedArrayBuffer(16);
    const state = new Int32Array(stdin, 0, 2);
    const decoders = { out: new TextDecoder(), err: new TextDecoder() };
    const answer = { mode, card: null, stdout: '', stderr: '', status: null, cards: 0, began: false, pictures: [] };
    const done = () => { worker.terminate(); resolve(answer); };
    worker.onmessage = ({ data }) => {
      switch (data.type) {
        case 'card': answer.card = data.has; break;
        case 'out': answer.stdout += decoders.out.decode(data.bytes, { stream: true }); break;
        case 'err': answer.stderr += decoders.err.decode(data.bytes, { stream: true }); break;
        case 'wants': Atomics.store(state, 0, 2); Atomics.notify(state, 0); break;
        case 'began': answer.began = true; break;
        case 'exit':
          answer.status = String(data.status);
          answer.cards = (data.report || []).reduce((sum, site) => sum + site.card, 0);
          for (const p of data.pictures || []) {
            // against the first run's: how many points are other
            const words = new Uint32Array(p.bytes.buffer, p.bytes.byteOffset, p.width * p.height);
            const key = name + '/' + p.name;
            if (!first.has(key)) first.set(key, words);
            const was = first.get(key);
            let differ = 0;
            for (let i = 0; i < words.length; i++) if (words[i] !== was[i]) differ++;
            answer.pictures.push({ name: p.name, width: p.width, height: p.height, differ });
          }
          done();
          break;
        case 'crash': answer.status = 'ended: ' + data.text; done(); break;
      }
    };
    worker.onerror = e => { answer.status = 'the worker failed: ' + e.message; done(); };
    worker.postMessage({ module: compiler.module, files: { ...compiler.files, '/work/main.scaly': text },
                         stdin, args: ['scaly', 'run', '--gpu', 'main.scaly'], gpu: mode });
  });
}

try {
  const sources = await (await fetch('sources.json')).json();
  const compiler = await loadCompiler(() => { });
  let card = true;
  for (const { name, text, modes } of sources) {
    for (const mode of modes) {
      const answer = await run(compiler, name, text, mode);
      if (answer.card === false) card = false;
      lines.push('RUN ' + JSON.stringify({ name, ...answer }));
    }
    if (!card) break;
  }
  lines.push(card ? 'compiled: ' + sources.length : 'SKIP');
} catch (e) {
  lines.push('FAILED page ' + JSON.stringify(String(e && e.stack || e)));
}
document.getElementById('out').textContent = lines.join('\n');
await fetch('/result', { method: 'POST', body: lines.join('\n') });
</script>
