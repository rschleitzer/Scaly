<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The matrix product</title>
<meta name="description" content="Z = XW, one number after the other: row i of X runs along column j of W, two products and their sum make z with ij. An animation for Machine Learning with Scaly.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32">
<style>
  @font-face {
    font-family: 'Latin Modern Math';
    src: url('/ml/fonts/latinmodern-math.otf') format('opentype');
    font-display: swap;
  }
  :root {
    --bg: #fbfbfa; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #dcdcde;
    --accent: #2a5db0;
    --pale: #f3f3f1; --light: #efc3a3; --orange: #e8853d; --border: #9a9aa0; --done: #fbeee4;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161618; --panel: #1f1f22; --ink: #ececee; --muted: #9a9aa2; --line: #34343a;
      --accent: #7aa7f0;
      --pale: #26262a; --light: #6b4a33; --orange: #d9762f; --border: #5a5a62; --done: #33291f;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; padding: 12px 16px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 18px; margin: 0; }
  header .spacer { flex: 1; }
  header nav { display: flex; flex-wrap: wrap; gap: 16px; }
  a { color: var(--accent); }
  header a { text-decoration: none; font-size: 14px; }
  select { font: inherit; font-size: 14px; padding: 4px 6px; border-radius: 6px;
           border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  main { display: flex; flex-direction: column; align-items: center; gap: 18px;
         padding: 24px 16px 40px; max-width: 760px; margin: 0 auto; }
  svg { width: min(520px, 100%); height: auto; display: block; }
  svg rect.cell { stroke: var(--border); stroke-width: 1; transition: fill .25s; }
  svg text { fill: var(--ink); }
  svg text.number { font: 22px ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums;
                    text-anchor: middle; dominant-baseline: central; transition: opacity .25s; }
  svg text.name { font-family: 'Latin Modern Math', 'STIX Two Math', 'Cambria Math', serif; font-size: 40px; text-anchor: middle; }
  svg text.index { font-family: 'Latin Modern Math', 'STIX Two Math', 'Cambria Math', serif; font-size: 20px;
                   text-anchor: middle; dominant-baseline: central; fill: var(--muted); transition: fill .25s; }
  svg text.index.on { fill: var(--orange); font-weight: 700; }
  #formula { min-height: 3.2em; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center;
             column-gap: .7em; row-gap: .2em; text-align: center; }
  math { font-family: 'Latin Modern Math', 'STIX Two Math', 'Cambria Math', math; font-size: 1.45em; }
  @media (max-width: 520px) { math { font-size: 1.2em; } }
  math mn { font-variant-numeric: tabular-nums; }
  math .hot { color: var(--orange); }
  .buttons { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
  button { font: inherit; font-size: 14px; padding: 7px 12px; border-radius: 6px; cursor: pointer;
           border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; min-width: 7.5em; }
  label.tempo { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); margin-left: 8px; }
  label.tempo input { width: 110px; accent-color: var(--accent); }
  .say { color: var(--muted); margin: 0; max-width: 620px; }
</style>
</head>
<body>
<header>
  <h1 data-t="title">The matrix product</h1>
  <span class="spacer"></span>
  <nav>
    <a href="/ml/matrices.htm#matrices-rows" id="book" data-t="book">The chapter</a>
  </nav>
  <select id="lang" aria-label="Language">
    <option value="en">English</option><option value="de">Deutsch</option>
  </select>
</header>
<main>
  <svg id="sheet" viewBox="0 0 520 470" role="img" aria-labelledby="sheetLabel">
    <title id="sheetLabel" data-t="picture">X on the left, W on top, Z below W; one number of Z after the other.</title>
  </svg>
  <div id="formula" aria-live="polite"></div>
  <div class="buttons">
    <button id="play" class="primary" data-t="play">Play</button>
    <button id="step" data-t="step">One step</button>
    <button id="reset" data-t="reset">Start again</button>
    <label class="tempo"><span data-t="tempo">Speed</span> <input type="range" id="tempo" min="1" max="5" step="1" value="3"></label>
  </div>
  <p class="say" data-t="say">Each number of Z is row i of X times column j of W: the first number of the row times the first of the column, plus the second times the second. That is all a matrix product is, done for every i and every j.</p>
</main>

<script type="module">
const $ = id => document.getElementById(id);
const LANGS = ['en', 'de'];
const TEXT = {
  en: { title: 'The matrix product', book: 'The chapter', language: 'Language', play: 'Play', pause: 'Pause',
        step: 'One step', reset: 'Start again', tempo: 'Speed', again: 'Once more',
        picture: 'X on the left, W on top, Z below W; one number of Z after the other.',
        say: 'Each number of Z is row i of X times column j of W: the first number of the row times the first of the column, plus the second times the second. That is all a matrix product is, done for every i and every j.',
        start: 'Z = XW: nine numbers, each from a row of X and a column of W.',
        done: 'Every number of Z is there: that is the matrix product XW.' },
  de: { title: 'Das Matrixprodukt', book: 'Das Kapitel', language: 'Sprache', play: 'Abspielen', pause: 'Pause',
        step: 'Ein Schritt', reset: 'Von vorn', tempo: 'Tempo', again: 'Noch einmal',
        picture: 'Links X, oben W, unter W die Matrix Z; eine Zahl von Z nach der anderen.',
        say: 'Jede Zahl von Z ist Zeile i von X mal Spalte j von W: die erste Zahl der Zeile mal die erste der Spalte, plus die zweite mal die zweite. Mehr ist ein Matrixprodukt nicht, nur eben für jedes i und jedes j.',
        start: 'Z = XW: neun Zahlen, jede aus einer Zeile von X und einer Spalte von W.',
        done: 'Alle Zahlen von Z stehen da: Das ist das Matrixprodukt XW.' },
};
function storedLang() {
  try { return localStorage.getItem('scaly-playground:lang'); } catch { return null; }
}
function chooseLang() {
  const asked = new URLSearchParams(location.hash.slice(1)).get('lang') ?? storedLang();
  if (LANGS.includes(asked)) return asked;
  for (const tag of navigator.languages ?? [navigator.language ?? 'en']) {
    const primary = String(tag).toLowerCase().split('-')[0];
    if (LANGS.includes(primary)) return primary;
  }
  return 'en';
}
let lang = chooseLang();
const t = key => TEXT[lang][key];

// --- the example: X is 3 by 2, W is 2 by 3, Z = XW is 3 by 3 -----------------
const X = [[2, 1], [3, 2], [1, -1]];
const W = [[1, 0, 2], [-1, 3, 1]];
const ROWS = X.length, INNER = W.length, COLS = W[0].length;
const Z = X.map(row => W[0].map((_, j) => row.reduce((s, x, k) => s + x * W[k][j], 0)));

// --- the picture, laid out as the book's figure (docs/ml/fig/matmul.scaly) ----
const CELL = 60, MARGIN = 56;
const xLeft = MARGIN, xTop = MARGIN + (INNER + 1) * CELL;
const wLeft = MARGIN + (INNER + 1) * CELL, wTop = MARGIN;
const NS = 'http://www.w3.org/2000/svg';
const sheet = $('sheet');
const width = wLeft + COLS * CELL + MARGIN / 2, height = xTop + ROWS * CELL + MARGIN;
sheet.setAttribute('viewBox', `0 0 ${width} ${height}`);
function el(name, attrs, text) {
  const e = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  sheet.appendChild(e);
  return e;
}
// a number as the minus sign writes it
const show = v => v < 0 ? `−${-v}` : String(v);
function block(left, top, rows, cols, values) {
  const cells = [];
  for (let r = 0; r < rows; r++) {
    cells.push([]);
    for (let c = 0; c < cols; c++) {
      const rect = el('rect', { class: 'cell', x: left + c * CELL, y: top + r * CELL, width: CELL, height: CELL, fill: 'var(--pale)' });
      const text = el('text', { class: 'number', x: left + c * CELL + CELL / 2, y: top + r * CELL + CELL / 2 + 1 },
                      values ? show(values[r][c]) : '');
      cells[r].push({ rect, text });
    }
  }
  return cells;
}
const xCells = block(xLeft, xTop, ROWS, INNER, X);
const wCells = block(wLeft, wTop, INNER, COLS, W);
const zCells = block(wLeft, xTop, ROWS, COLS, null);
// the names, as in the figure: X above its block, W left of it, Z below it
el('text', { class: 'name', x: xLeft + INNER * CELL / 2, y: xTop - 32 }, '𝑋');
el('text', { class: 'name', x: wLeft - 70, y: wTop + INNER * CELL / 2 + 14 }, '𝑊');
el('text', { class: 'name', x: wLeft + COLS * CELL / 2, y: xTop + ROWS * CELL + 46 }, '𝑍');
// the running indices: i beside the rows of X, j above the columns of W, k
// above the columns of X and beside the rows of W
const iMarks = [], jMarks = [], kxMarks = [], kwMarks = [];
for (let r = 0; r < ROWS; r++)
  iMarks.push(el('text', { class: 'index', x: xLeft - 22, y: xTop + r * CELL + CELL / 2 }, `𝑖=${r + 1}`));
for (let c = 0; c < COLS; c++)
  jMarks.push(el('text', { class: 'index', x: wLeft + c * CELL + CELL / 2, y: wTop - 18 }, `𝑗=${c + 1}`));
for (let k = 0; k < INNER; k++) {
  kxMarks.push(el('text', { class: 'index', x: xLeft + k * CELL + CELL / 2, y: xTop - 12 }, `𝑘=${k + 1}`));
  kwMarks.push(el('text', { class: 'index', x: wLeft - 22, y: wTop + k * CELL + CELL / 2 }, `𝑘=${k + 1}`));
}

// --- the steps: for each i and j, the row and the column, then each k, then z -
// A state is (n, phase): n the number of Z being made (row by row), phase 0
// the row and column, 1..INNER the products so far, INNER + 1 the sum in z.
const PHASES = INNER + 2;
const LAST = ROWS * COLS * PHASES;      // the step after the last: all done
let at = -1;                            // -1: nothing yet

// MathML
const mi = v => `<mi>${v}</mi>`, mo = v => `<mo>${v}</mo>`;
// a negative number in a product is put in parentheses, set tight
const tight = v => `<mo lspace="0" rspace="0" stretchy="false">${v}</mo>`;
const mn = v => v < 0 ? `<mrow>${tight('(')}${tight('−')}<mn>${-v}</mn>${tight(')')}</mrow>` : `<mn>${v}</mn>`;
const mnPlain = v => v < 0 ? `<mrow>${tight('−')}<mn>${-v}</mn></mrow>` : `<mn>${v}</mn>`;
const sub = (b, s) => `<msub>${b}<mrow>${s}</mrow></msub>`;
const hot = (x, on) => on ? `<mrow class="hot">${x}</mrow>` : x;

function formula() {
  if (at < 0) return `<p class="say">${t('start')}</p>`;
  if (at >= LAST) return `<p class="say">${t('done')}</p>`;
  const n = Math.floor(at / PHASES), phase = at % PHASES;
  const i = Math.floor(n / COLS), j = n % COLS;
  const left = sub(mi('z'), mn(i + 1) + mn(j + 1));
  const symbols = [], numbers = [];
  for (let k = 0; k < INNER; k++) {
    const on = phase === k + 1;
    symbols.push(hot(sub(mi('x'), mn(i + 1) + mn(k + 1)) + sub(mi('w'), mn(k + 1) + mn(j + 1)), on));
    if (phase > k) numbers.push(hot(mnPlain(X[i][k]) + mo('·') + mn(W[k][j]), on));
  }
  // three parts that stand in a line where it is wide enough and one under
  // the other where not: which i and j, the formula, its numbers
  const parts = [mi('i') + mo('=') + mn(i + 1) + `<mo rspace="0">,</mo><mspace width="0.4em"/>` + mi('j') + mo('=') + mn(j + 1) + `<mo lspace="0">:</mo>`,
                 left + mo('=') + symbols.join(mo('+'))];
  let values = numbers.length ? mo('=') + numbers.join(mo('+')) : '';
  if (phase === INNER + 1) values += mo('=') + hot(mnPlain(Z[i][j]), true);
  if (values) parts.push(values);
  return parts.map(m => `<math>${m}</math>`).join('');
}

function draw() {
  const done = at >= LAST;
  const n = done || at < 0 ? -1 : Math.floor(at / PHASES);
  const phase = at < 0 ? -1 : at % PHASES;
  const i = n < 0 ? -1 : Math.floor(n / COLS), j = n < 0 ? -1 : n % COLS;
  for (let r = 0; r < ROWS; r++)
    for (let k = 0; k < INNER; k++)
      xCells[r][k].rect.setAttribute('fill', r === i ? (phase === k + 1 ? 'var(--orange)' : 'var(--light)') : 'var(--pale)');
  for (let k = 0; k < INNER; k++)
    for (let c = 0; c < COLS; c++)
      wCells[k][c].rect.setAttribute('fill', c === j ? (phase === k + 1 ? 'var(--orange)' : 'var(--light)') : 'var(--pale)');
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      const m = r * COLS + c;
      const made = done || m < n || (m === n && phase === INNER + 1);
      const cell = zCells[r][c];
      cell.rect.setAttribute('fill', m === n ? (phase === INNER + 1 ? 'var(--orange)' : 'var(--light)') : made ? 'var(--done)' : 'var(--pale)');
      cell.text.textContent = made ? show(Z[r][c]) : '';
    }
  iMarks.forEach((e, r) => e.classList.toggle('on', r === i));
  jMarks.forEach((e, c) => e.classList.toggle('on', c === j));
  const k = phase >= 1 && phase <= INNER ? phase - 1 : -1;
  kxMarks.forEach((e, q) => e.classList.toggle('on', q === k));
  kwMarks.forEach((e, q) => e.classList.toggle('on', q === k));
  $('formula').innerHTML = formula();
}

// --- playing ---------------------------------------------------------------
let timer = null;
const DELAYS = [2200, 1500, 1000, 650, 380];
function delay() { return DELAYS[Number($('tempo').value) - 1]; }
function forward() {
  if (at < LAST) at++;
  draw();
  if (at >= LAST) stop();
}
function tick() {
  forward();
  if (timer !== null) timer = setTimeout(tick, delay());
}
function playing() { return timer !== null; }
function stop() {
  if (timer !== null) clearTimeout(timer);
  timer = null;
  label();
}
function label() {
  $('play').textContent = playing() ? t('pause') : at >= LAST ? t('again') : t('play');
}
$('play').onclick = () => {
  if (playing()) { stop(); return; }
  if (at >= LAST) at = -1;
  timer = setTimeout(tick, 0);
  label();
};
$('step').onclick = () => { stop(); if (at >= LAST) at = -1; forward(); label(); };
$('reset').onclick = () => { stop(); at = -1; draw(); label(); };

function translatePage() {
  document.documentElement.lang = lang;
  document.title = t('title');
  $('lang').value = lang;
  $('lang').setAttribute('aria-label', t('language'));
  $('book').href = (lang === 'de' ? '/ml/matrices.de.htm' : '/ml/matrices.htm') + '#matrices-rows';
  for (const e of document.querySelectorAll('[data-t]')) e.textContent = t(e.dataset.t);
  label();
  draw();
}
$('lang').onchange = () => {
  lang = $('lang').value;
  try { localStorage.setItem('scaly-playground:lang', lang); } catch {}
  translatePage();
};
translatePage();
</script>
</body>
</html>
