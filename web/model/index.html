<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A model</title>
<meta name="description" content="A function made up by hand, f(x, y) = cos(π(x² + y²)/c), colours the plane; move c and watch. Computed by a Scaly program in the page.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32">
<style>
  @font-face {
    font-family: 'Latin Modern Math';
    src: url('/ml/fonts/latinmodern-math.otf') format('opentype');
    font-display: swap;
  }
  :root {
    --bg: #fbfbfa; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #dcdcde;
    --accent: #2a5db0; --bad: #b3261e;
    --plus: #e8853d; --minus: #3b7dd8; --zero: #f3f3f1;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161618; --panel: #1f1f22; --ink: #ececee; --muted: #9a9aa2; --line: #34343a;
      --accent: #7aa7f0; --bad: #f08a80;
      --plus: #f0964f; --minus: #4d8ef0; --zero: #26262a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; padding: 12px 16px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 18px; margin: 0; }
  header .spacer { flex: 1; }
  header nav { display: flex; flex-wrap: wrap; gap: 16px; }
  a { color: var(--accent); }
  header a { text-decoration: none; font-size: 14px; }
  select { font: inherit; font-size: 14px; padding: 4px 6px; border-radius: 6px;
           border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  main { display: flex; flex-wrap: wrap; gap: 32px; align-items: center; justify-content: center;
         padding: 32px 16px; max-width: 1100px; margin: 0 auto; }
  canvas { width: min(480px, 100%); aspect-ratio: 1; border-radius: 8px; display: block;
           background: var(--zero); border: 1px solid var(--line); }
  .side { display: flex; flex-direction: column; gap: 22px; min-width: 300px; max-width: 420px; }
  math mn#value { font-variant-numeric: tabular-nums; }
  math { font-family: 'Latin Modern Math', 'STIX Two Math', 'Cambria Math', math; font-size: 1.6em; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .say { color: var(--muted); margin: 0; }
  #status { font-size: 13px; color: var(--muted); }
  #status.bad { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1 data-t="title">A model</h1>
  <span class="spacer"></span>
  <nav>
    <a href="/ml/field.htm" id="book" data-t="book">The chapter</a>
    <a href="/play/field/" data-t="field">The field</a>
  </nav>
  <select id="lang" aria-label="Language">
    <option value="en">English</option><option value="de">Deutsch</option>
  </select>
</header>
<main>
  <canvas id="plane" width="400" height="400" aria-label="The plane coloured by the model"></canvas>
  <div class="side">
    <math display="block">
      <mi>f</mi><mo>&#x2061;</mo><mrow><mo stretchy="false">(</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo stretchy="false">)</mo></mrow>
      <mo>=</mo>
      <mi>cos</mi><mo>&#x2061;</mo><mrow><mo>(</mo><mfrac><mrow><mi>π</mi><mrow><mo stretchy="false">(</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo stretchy="false">)</mo></mrow></mrow><mn id="value">72</mn></mfrac><mo>)</mo></mrow>
    </math>
    <input type="range" id="c" min="1" max="150" step="0.5" value="72" aria-label="c">
    <p class="say" data-t="say">Orange where the model answers +1, blue where it answers −1, pale where it is unsure; the plane runs from −6 to +6 both ways.</p>
    <span id="status"></span>
  </div>
</main>

<script type="module">
import { Threads } from './threads.mjs';

const $ = id => document.getElementById(id);
const LANGS = ['en', 'de'];
const TEXT = {
  en: { title: 'A model', book: 'The chapter', field: 'The field', language: 'Language',
        say: 'Orange where the model answers +1, blue where it answers −1, pale where it is unsure; the plane runs from −6 to +6 both ways.',
        loading: 'The program loads …', isolation: 'This page needs a server with cross-origin isolation (COOP and COEP): it shares its memory with the program.',
        ended: s => `The program has ended (${s}). Load the page again to start it anew.`, cores: n => `Scaly in the page, ${n} cores` },
  de: { title: 'Ein Modell', book: 'Das Kapitel', field: 'Das Spielfeld', language: 'Sprache',
        say: 'Orange, wo das Modell +1 antwortet, blau, wo es −1 antwortet, blass, wo es unsicher ist; die Ebene reicht in beide Richtungen von −6 bis +6.',
        loading: 'Das Programm lädt …', isolation: 'Diese Seite braucht einen Server mit Cross-Origin-Isolation (COOP und COEP): Sie teilt ihren Speicher mit dem Programm.',
        ended: s => `Das Programm ist beendet (${s}). Lade die Seite neu, um es wieder zu starten.`, cores: n => `Scaly in der Seite, ${n} Kerne` },
};
function storedLang() {
  try { return localStorage.getItem('scaly-playground:lang'); } catch { return null; }
}
function chooseLang() {
  const asked = new URLSearchParams(location.hash.slice(1)).get('lang') ?? storedLang();
  if (LANGS.includes(asked)) return asked;
  for (const tag of navigator.languages ?? [navigator.language ?? 'en']) {
    const primary = String(tag).toLowerCase().split('-')[0];
    if (LANGS.includes(primary)) return primary;
  }
  return 'en';
}
let lang = chooseLang();
const t = key => TEXT[lang][key];
let said = null;
function status(say, bad = false) {
  said = typeof say === 'function' ? say : () => t(say);
  $('status').textContent = said();
  $('status').classList.toggle('bad', bad);
}
function translatePage() {
  document.documentElement.lang = lang;
  document.title = t('title');
  $('lang').value = lang;
  $('lang').setAttribute('aria-label', t('language'));
  $('book').href = lang === 'de' ? '/ml/field.de.htm' : '/ml/field.htm';
  for (const e of document.querySelectorAll('[data-t]')) e.textContent = t(e.dataset.t);
  if (said) $('status').textContent = said();
  showValue();
}
$('lang').onchange = () => {
  lang = $('lang').value;
  try { localStorage.setItem('scaly-playground:lang', lang); } catch {}
  translatePage();
};

// --- the board (model.scaly says what lies where) ----------------------------

const SIZE = 400, HEAD = 64, BOARD = HEAD + SIZE * SIZE;
let board = null;           // a Float64Array over the program's board, in its memory
let changes = 0, frame = -1;

function c() { return Number($('c').value); }
// c in the formula itself, written as the page's language writes numbers
function showValue() { $('value').textContent = c().toLocaleString(lang, { maximumFractionDigits: 1 }); }
function send() {
  if (!board) return;
  board[1] = c();
  board[0] = ++changes;     // last: the program takes c in once it sees this
}
$('c').addEventListener('input', () => { showValue(); send(); });

// a value between -1 and 1 as the field's colour (web/field)
function rgb(css) {
  const g = document.createElement('canvas').getContext('2d');
  g.fillStyle = css;
  const hex = g.fillStyle;
  if (hex.startsWith('#')) return [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  return hex.match(/\d+/g).slice(0, 3).map(Number);
}
let palette;
function readPalette() {
  const css = getComputedStyle(document.documentElement);
  palette = { plus: rgb(css.getPropertyValue('--plus').trim()), minus: rgb(css.getPropertyValue('--minus').trim()),
              zero: rgb(css.getPropertyValue('--zero').trim()) };
}
readPalette();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readPalette(); frame = -1; });

const image = new ImageData(SIZE, SIZE);
function picture() {
  const px = image.data, z = palette.zero;
  for (let p = 0; p < SIZE * SIZE; p++) {
    const v = board[HEAD + p], a = Math.min(1, Math.abs(v)) * 0.85, end = v > 0 ? palette.plus : palette.minus;
    px[4 * p] = z[0] + (end[0] - z[0]) * a;
    px[4 * p + 1] = z[1] + (end[1] - z[1]) * a;
    px[4 * p + 2] = z[2] + (end[2] - z[2]) * a;
    px[4 * p + 3] = 255;
  }
  $('plane').getContext('2d').putImageData(image, 0, 0);
}
function tick() {
  if (board && board[33] !== frame && board[32] === changes) {
    frame = board[33];
    picture();
  }
  requestAnimationFrame(tick);
}

// --- the program -------------------------------------------------------------

async function start() {
  const asked = Number(new URLSearchParams(location.hash.slice(1)).get('c'));
  if (asked >= 1 && asked <= 150) $('c').value = String(asked);
  translatePage();
  if (!crossOriginIsolated) { status('isolation', true); return; }
  status('loading');
  const cpus = navigator.hardwareConcurrency || 4;
  const env = { SCALY_CPUS: String(cpus) };
  const runner = new Worker('runner.mjs', { type: 'module' });
  const threads = await Threads.create({ out: () => {}, err: () => {}, exit: s => ended(s), env });
  const ended = s => { board = null; status(() => t('ended')(s), true); $('c').disabled = true; };
  runner.onerror = e => ended(e.message || 'the worker stopped');
  runner.onmessage = ({ data }) => {
    if (threads.handle(data)) return;
    if (data.type === 'watch') {
      board = new Float64Array(data.memory.buffer, data.address, BOARD);
      send();
      status(() => t('cores')(cpus));
    } else if (data.type === 'done') ended(data.status);
  };
  runner.postMessage({ type: 'run', env });
  requestAnimationFrame(tick);
}
start();
</script>
</body>
</html>
