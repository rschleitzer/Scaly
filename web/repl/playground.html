<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scaly Playground</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --bg: #fbfbfa; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #dcdcde;
    --accent: #2a5db0; --ok: #1f7a3a; --bad: #b3261e; --code: #f4f4f2;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161618; --panel: #1f1f22; --ink: #ececee; --muted: #9a9aa2; --line: #34343a;
      --accent: #7aa7f0; --ok: #6cc788; --bad: #f08a80; --code: #26262a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 12px 16px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
  header h1 img { width: 32px; height: 32px; }
  header .spacer { flex: 1; }
  .steps { display: flex; gap: 6px; align-items: center; }
  .steps button { padding: 4px 10px; }
  header a { color: var(--accent); text-decoration: none; font-size: 14px; }
  select { font: inherit; font-size: 14px; padding: 4px 6px; border-radius: 6px; max-width: 100%;
           border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  main { display: grid; grid-template-columns: 1fr; gap: 16px; padding: 16px; max-width: 1400px; margin: 0 auto; }
  .work { display: flex; flex-direction: column; gap: 10px; }
  main.prose-only { grid-template-columns: minmax(0, 760px); justify-content: center; }
  main.prose-only .work { display: none; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .lesson { display: flex; flex-direction: column; overflow: auto; }
  .lesson h2 { font-size: 20px; margin: 0 0 8px; }
  .lesson .chapter { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  #drawings img { display: block; max-width: 100%; height: auto; border-radius: 6px; border: 1px solid var(--line);
                  background: #fff; margin-bottom: 8px; }
  #drawings:empty { display: none; }
  .lesson .body { flex: 1; }
  .lesson .prose p { margin: 0 0 12px; }
  .lesson a { color: var(--accent); }
  code, pre, textarea { font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .lesson code { background: var(--code); padding: 1px 4px; border-radius: 4px; }
  .lesson pre { background: var(--code); padding: 10px; border-radius: 6px; overflow: auto; margin: 0 0 12px; }
  .nav { display: flex; align-items: center; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
  .nav .count { flex: 1; text-align: center; color: var(--muted); font-size: 14px; }
  button { font: inherit; font-size: 14px; padding: 5px 12px; border-radius: 6px; cursor: pointer;
           border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  header nav { display: flex; gap: 16px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #status { font-size: 14px; color: var(--muted); }
  #status.ok { color: var(--ok); }
  #status.bad { color: var(--bad); }
  #editor { width: 100%; min-height: 240px; height: 22em; resize: vertical; padding: 10px;
            border: 1px solid var(--line); border-radius: 6px; background: var(--code); color: var(--ink);
            tab-size: 4; white-space: pre; overflow: auto; }
  .hint { font-size: 12px; color: var(--muted); }
  /* results beside the code (notes.mjs): one row per line of the editor */
  .editwrap { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 0; }
  .editwrap.noted { grid-template-columns: minmax(0, 1fr) minmax(7em, 32%); }
  #notes { display: none; position: relative; overflow: hidden; border: 1px solid var(--line); border-left: 0;
           border-radius: 0 6px 6px 0; background: var(--panel); color: var(--muted);
           font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .editwrap.noted #notes { display: block; }
  .editwrap.noted #editor { border-radius: 6px 0 0 6px; }
  #notes .rows { position: absolute; left: 0; right: 0; top: 0; padding: 11px 8px; }
  #notes .row { display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
  #notes .row .v { color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
  #notes .row .k { font-size: 11px; }
  #notes svg { flex: none; width: 3.5em; height: 1em; }
  #notes svg polyline { fill: none; stroke: var(--accent); stroke-width: 1.5; }
  #notes.stale { opacity: .45; }
  #output { margin: 0; padding: 10px; background: var(--code); border-radius: 6px; overflow: auto;
            white-space: pre-wrap; overflow-wrap: anywhere; min-height: 80px; }
  #output .err { color: var(--bad); }
  #output .note { color: var(--muted); font-style: italic; }
  .results { display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow: auto; }
  #pictures canvas { display: block; max-width: 100%; height: auto; border-radius: 6px; border: 1px solid var(--line); }
  #pictures figcaption, .runs .what { font-size: 12px; color: var(--muted); }
  #pictures figure { margin: 0; }
  .runs { display: grid; grid-template-columns: max-content minmax(60px, 1fr) max-content; gap: 4px 10px;
          align-items: center; font-size: 13px; }
  .runs:empty, #pictures:empty { display: none; }
  .runs .bar { height: 10px; display: flex; min-width: 2px; }
  .runs .bar span { height: 100%; background: var(--muted); }
  .runs .bar span:first-child { border-radius: 5px 0 0 5px; }
  .runs .bar span:last-child { border-radius: 0 5px 5px 0; }
  .runs .bar span:only-child { border-radius: 5px; }
  .runs .bar.card span { background: var(--accent); }
  /* compiling the card's kernel, once: the lighter part of its bar */
  .runs .bar span.compile { background: repeating-linear-gradient(135deg, var(--accent) 0 3px, transparent 3px 6px); opacity: .55; }
  /* where a card's run went (runner.mjs, parts): the way there and back, the
     card computing, its results read and checked, the processor's own part */
  .runs .bar span.there { background: var(--accent); opacity: .35; }
  .runs .bar span.compute { background: var(--accent); }
  .runs .bar span.read { background: var(--ink); opacity: .55; }
  .runs .bar span.cpu { background: var(--muted); }
  .runs .key { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
  .runs .key i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .runs .key i.compile { background: repeating-linear-gradient(135deg, var(--accent) 0 3px, transparent 3px 6px); opacity: .55; }
  .runs .key i.there { background: var(--accent); opacity: .35; }
  .runs .key i.compute { background: var(--accent); }
  .runs .key i.read { background: var(--ink); opacity: .55; }
  .runs .key i.cpu { background: var(--muted); }
  /* a step's experiment: a race over the cores, or the sizes against the card */
  #experimentbox[hidden] { display: none; }
  #experimentchart { width: 100%; max-width: 560px; height: auto; display: block; }
  #experimentchart text { fill: var(--muted); font-size: 11px; font-family: system-ui, sans-serif; }
  #experimentchart .axis { stroke: var(--line); }
  #experimentchart .grid { stroke: var(--line); opacity: .5; }
  #experimentchart .ideal { stroke: var(--muted); stroke-dasharray: 4 4; fill: none; }
  #experimentchart .s0 { stroke: var(--muted); fill: none; stroke-width: 2; }
  #experimentchart .s1 { stroke: var(--accent); fill: none; stroke-width: 2; }
  #experimentchart .s2 { stroke: var(--ok); fill: none; stroke-width: 2; stroke-dasharray: 5 3; }
  #experimentchart .d0 { fill: var(--muted); } #experimentchart .d1 { fill: var(--accent); } #experimentchart .d2 { fill: var(--ok); }
  #experimentchart .mark { stroke: var(--accent); stroke-dasharray: 2 3; }
  #experimentchart text.strong { fill: var(--ink); }
  .runs .time { font-variant-numeric: tabular-nums; }
  .runs .what { grid-column: 1 / -1; margin: -2px 0 4px; }
  /* a task (P4): what to change, hints on request, the lizard's verdict */
  .lesson .prose p.task { border-left: 3px solid var(--accent); padding: 6px 10px; background: var(--code);
                          border-radius: 0 6px 6px 0; }
  .tasktools { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  .tasktools button { font-size: 13px; }
  .lesson .revealed p { border-left: 3px solid var(--line); padding-left: 10px; color: var(--muted); }
  .praise { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 6px;
            border: 1px solid var(--ok); color: var(--ok); font-weight: 600; }
  .praise img { width: 34px; height: 34px; flex: none; }
  .praise.notyet { border-color: var(--line); color: var(--muted); font-weight: normal; }
  .praise.notyet img { filter: grayscale(1); opacity: .6; }
  .praise[hidden] { display: none; }
  /* last: the wide layout overrides the base rules above */
  @media (min-width: 900px) {
    main { grid-template-columns: minmax(300px, 2fr) 3fr; height: calc(100vh - 58px); }
    .lesson, .work { min-height: 0; }
    .work { display: grid; grid-template-rows: auto minmax(0, 1fr) auto minmax(80px, 30%); }
    .work.card { grid-template-rows: auto minmax(0, 1fr) auto minmax(80px, 55%); }
    #editor { height: 100%; min-height: 0; resize: none; }
    .editwrap { height: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1><img src="lizard.svg" alt="">Scaly Playground</h1>
  <span class="steps">
    <button id="prev" aria-label="Previous step" data-t-label="previous">‹</button>
    <select id="toc" aria-label="Steps of the playground" data-t-label="toc"></select>
    <button id="fwd" aria-label="Next step" data-t-label="forward">›</button>
  </span>
  <span class="spacer"></span>
  <nav>
    <a href="https://scaly.io/scaly/">Scaly</a>
    <a href="mandelbrot/">Mandelbrot</a>
    <a href="index.html" data-t="repl">The REPL</a>
    <a href="https://scaly.io/lang/" data-t="spec">The specification</a>
  </nav>
  <select id="lang" aria-label="Language">
    <option value="en">English</option>
    <option value="de">Deutsch</option>
  </select>
</header>
<main id="main">
  <section class="lesson">
    <div class="chapter" id="chapter"></div>
    <h2 id="title">Scaly Playground</h2>
    <div class="body">
      <div class="prose" id="prose"><p data-t="loading">Loading the playground…</p></div>
      <div class="revealed" id="revealed"></div>
      <div class="tasktools" id="tasktools" hidden>
        <button id="hintbtn"></button>
        <button id="solutionbtn" hidden data-t="solution">Show a solution</button>
      </div>
    </div>
    <div class="nav">
      <button id="back" data-t="back">‹ Back</button>
      <span class="count" id="count"></span>
      <button id="next">Next ›</button>
    </div>
  </section>
  <section class="work">
    <div class="toolbar">
      <button class="primary" id="run" disabled>Run</button>
      <button id="reset" data-t="reset">Reset</button>
      <select id="where" aria-label="Where the loops run" data-t-label="where" hidden>
        <option value="one" data-t="one">On one core</option>
        <option value="all" data-t="all">On all cores</option>
        <option value="card" data-t="card">On the graphics card</option>
        <option value="auto" data-t="auto" selected>Where it pays</option>
      </select>
      <button id="experiment" hidden></button>
      <span id="status">Loading…</span>
    </div>
    <div class="editwrap" id="editwrap">
      <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off"
                aria-label="The program" data-t-label="program"></textarea>
      <div id="notes" aria-label="The values of the program, line by line" data-t-label="notes"><div class="rows" id="noterows"></div></div>
    </div>
    <div class="hint" data-t="hint">Change the program and run it again — Ctrl+Enter or ⌘+Enter runs it.
      The compiler and the program run in this browser tab.</div>
    <div class="results">
      <div class="praise" id="praise" hidden><img src="lizard.svg" alt=""><span id="praisetext"></span></div>
      <div id="experimentbox" hidden>
        <svg id="experimentchart" viewBox="0 0 560 260" role="img"></svg>
        <p class="hint" id="experimentnote"></p>
      </div>
      <div class="runs" id="runs" aria-label="The runs of this program" data-t-label="runs"></div>
      <div id="drawings"></div>
      <div id="pictures"></div>
      <pre id="output" aria-live="polite"></pre>
    </div>
  </section>
</main>

<script type="module">
import { loadCompiler } from './load.mjs';
import { instrument, relines, failedNotes, Notes } from './notes.mjs';

const $ = id => document.getElementById(id);

// --- the language -------------------------------------------------------
// English or German: what the reader chose (?lang=, or the switch, kept in
// this browser), else the first of the browser's languages the playground
// has -- navigator.languages, the order the reader's system and browser
// prefer. The steps in German are the tour of the book translated, then
// the playground's chapters (playground-steps.de.htm,
// docs/scaly-playground.de.xml); the book itself is in English.
const LANGS = ['en', 'de'];
const TEXT = {
  en: {
    repl: 'The REPL', spec: 'The specification', loading: 'Loading the playground…',
    back: '‹ Back', next: 'Next ›', toRepl: 'The REPL ›', run: 'Run', stop: 'Stop', reset: 'Reset',
    one: 'On one core', all: 'On all cores', card: 'On the graphics card', auto: 'Where it pays',
    hint: 'Change the program and run it again — Ctrl+Enter or ⌘+Enter runs it. Beside the code: the value each line bound, in a loop its last one and how it went. The compiler and the program run in this browser tab.',
    previous: 'Previous step', forward: 'Next step', toc: 'Steps of the playground', where: 'Where the loops run',
    program: 'The program', runs: 'The runs of this program', language: 'Language',
    tour: 'A Tour of Scaly', ready: 'Ready.', compilerFailed: m => `Could not load the compiler: ${m}`,
    preparing: 'Loading what a build for the cores needs…', building: 'Building…', running: 'Running…',
    compilingRunning: 'Compiling and running…', notBuilt: 'It did not build.', compilerEnded: s => `the compiler ended with ${s}\n`,
    ended: s => `The program ended with ${s}.`, endedNote: s => `\n[the program ended with status ${s}]\n`,
    done: ms => `Done in ${ms} ms.`, runFailed: 'The run failed.', stopped: '\n[stopped]\n',
    stoppedBy: t => `\n[stopped: ${t}]\n`, workerFailed: m => `\n[the worker failed: ${m}]\n`,
    oneCore: 'One core', cores: n => `${n} cores`, theCard: 'The card', noCard: 'No card',
    builtIn: ms => `built in ${ms} ms; `, noCardGiven: why => `this browser gives the page no graphics card, the cores ran it (${why})`,
    cardRan: n => `the card ran ${n} ${n === 1 ? 'loop' : 'loops'}`,
    upTo: n => `the loops ran on up to ${n} cores`, onOne: 'the loops ran on one core',
    compiledOnce: ms => `; of the time, ${ms} ms went into compiling its kernel for the card — once: the next run keeps it`,
    points: (w, h) => `${w} × ${h} points`,
    notes: 'The values of the program, line by line', times: n => `${n}×`,
    showHint: 'Show a hint', moreHint: 'Another hint', solution: 'Show a solution', oneWay: 'One way to do it:',
    praise: ['That’s it — well done!', 'Exactly right. The lizard is impressed.', 'Perfect — on to the next one?', 'You did it!'],
    notYet: 'Not quite yet: the task wants a different output. Compare it with the task — or take a hint.',
    solved: 'solved',
    race: 'Race: 1, 2, 4 … cores and the card', compare: 'Compare: cores, card, where it pays',
    racing: what => `Racing: ${what}…`, comparing: what => `Comparing: ${what}…`, raceDone: 'The race is run.', compareDone: 'Compared.',
    speedupAxis: 'cores', speedupCard: s => `the card: ${s}×`, timesFaster: s => `${s}×`,
    raceNote: 'Both axes are logarithmic. The dashed line is a perfect speedup: twice the cores, half the time. The card is a line of its own; the compilation of its kernel, once, is left out.',
    sizesAxis: 'points', sizesNote: 'Both axes are logarithmic: the time of the loop against how many points it has, for each way it can run.',
    fromN: n => `from about ${n} points on, the card is faster`, never: 'at none of these sizes was the card faster',
    seriesCores: n => `${n} cores`, seriesCard: 'the card', seriesAuto: 'where it pays',
    noCardHere: why => `This browser gives the page no graphics card (${why}): only the cores take part.`,
    key: { compile: 'compiling the kernel (once)', there: 'to the card and back', compute: 'the card computing', read: 'reading and checking the results', cpu: 'the processor' },
  },
  de: {
    repl: 'Die REPL', spec: 'Die Spezifikation', loading: 'Der Playground lädt…',
    back: '‹ Zurück', next: 'Weiter ›', toRepl: 'Zur REPL ›', run: 'Ausführen', stop: 'Anhalten', reset: 'Zurücksetzen',
    one: 'Auf einem Kern', all: 'Auf allen Kernen', card: 'Auf der Grafikkarte', auto: 'Wo es sich lohnt',
    hint: 'Ändere das Programm und lass es noch einmal laufen — Strg+Enter oder ⌘+Enter führt es aus. Neben dem Code: der Wert, den jede Zeile gebunden hat, in einer Schleife ihr letzter und wie er sich entwickelt hat. Der Compiler und das Programm laufen in diesem Browser-Tab.',
    previous: 'Voriger Schritt', forward: 'Nächster Schritt', toc: 'Die Schritte des Playgrounds', where: 'Wo die Schleifen laufen',
    program: 'Das Programm', runs: 'Die Läufe dieses Programms', language: 'Sprache',
    tour: 'Eine Rundreise durch Scaly', ready: 'Bereit.', compilerFailed: m => `Der Compiler ließ sich nicht laden: ${m}`,
    preparing: 'Lade, was ein Bau für die Kerne braucht…', building: 'Baue…', running: 'Läuft…',
    compilingRunning: 'Übersetze und führe aus…', notBuilt: 'Es ließ sich nicht bauen.', compilerEnded: s => `der Compiler endete mit ${s}\n`,
    ended: s => `Das Programm endete mit ${s}.`, endedNote: s => `\n[das Programm endete mit Status ${s}]\n`,
    done: ms => `Fertig in ${ms} ms.`, runFailed: 'Der Lauf ist fehlgeschlagen.', stopped: '\n[angehalten]\n',
    stoppedBy: t => `\n[angehalten: ${t}]\n`, workerFailed: m => `\n[der Worker ist fehlgeschlagen: ${m}]\n`,
    oneCore: 'Ein Kern', cores: n => `${n} Kerne`, theCard: 'Die Karte', noCard: 'Keine Karte',
    builtIn: ms => `gebaut in ${ms} ms; `, noCardGiven: why => `dieser Browser gibt der Seite keine Grafikkarte, die Kerne haben gerechnet (${why})`,
    cardRan: n => `die Karte hat ${n} ${n === 1 ? 'Schleife' : 'Schleifen'} gerechnet`,
    upTo: n => `die Schleifen liefen auf bis zu ${n} Kernen`, onOne: 'die Schleifen liefen auf einem Kern',
    compiledOnce: ms => `; davon ${ms} ms, um ihren Kernel für die Karte zu übersetzen — nur einmal: der nächste Lauf hat ihn schon`,
    points: (w, h) => `${w} × ${h} Punkte`,
    notes: 'Die Werte des Programms, Zeile für Zeile', times: n => `${n}×`,
    showHint: 'Zeig mir einen Hinweis', moreHint: 'Noch ein Hinweis', solution: 'Zeig mir eine Lösung', oneWay: 'Eine Möglichkeit:',
    praise: ['Genau so — gut gemacht!', 'Ganz richtig. Die Eidechse staunt.', 'Perfekt — weiter zum nächsten?', 'Geschafft!'],
    notYet: 'Noch nicht ganz: Die Aufgabe will eine andere Ausgabe. Vergleiche sie mit der Aufgabe — oder hol dir einen Hinweis.',
    solved: 'gelöst',
    race: 'Wettlauf: 1, 2, 4 … Kerne und die Karte', compare: 'Vergleichen: Kerne, Karte, wo es sich lohnt',
    racing: what => `Wettlauf: ${what}…`, comparing: what => `Vergleiche: ${what}…`, raceDone: 'Der Wettlauf ist gelaufen.', compareDone: 'Verglichen.',
    speedupAxis: 'Kerne', speedupCard: s => `die Karte: ${s}×`, timesFaster: s => `${s}×`,
    raceNote: 'Beide Achsen sind logarithmisch. Die gestrichelte Linie ist der ideale Gewinn: doppelt so viele Kerne, halb so viel Zeit. Die Karte ist eine eigene Linie; das einmalige Übersetzen ihres Kernels ist herausgerechnet.',
    sizesAxis: 'Punkte', sizesNote: 'Beide Achsen sind logarithmisch: die Zeit der Schleife gegen die Zahl ihrer Punkte, für jeden Weg, den sie nehmen kann.',
    fromN: n => `ab etwa ${n} Punkten ist die Karte schneller`, never: 'bei keiner dieser Größen war die Karte schneller',
    seriesCores: n => `${n} Kerne`, seriesCard: 'die Karte', seriesAuto: 'wo es sich lohnt',
    noCardHere: why => `Dieser Browser gibt der Seite keine Grafikkarte (${why}): Es laufen nur die Kerne.`,
    key: { compile: 'Kernel übersetzen (einmal)', there: 'zur Karte und zurück', compute: 'die Karte rechnet', read: 'Ergebnisse lesen und prüfen', cpu: 'der Prozessor' },
  },
};
function storedLang() {
  try { return localStorage.getItem('scaly-playground:lang'); } catch { return null; }
}
function chooseLang() {
  const asked = new URLSearchParams(location.search).get('lang') ?? storedLang();
  if (LANGS.includes(asked)) return asked;
  for (const tag of navigator.languages ?? [navigator.language ?? 'en']) {
    const primary = String(tag).toLowerCase().split('-')[0];
    if (LANGS.includes(primary)) return primary;
  }
  return 'en';
}
let lang = chooseLang();
const t = key => TEXT[lang][key];
function translatePage() {
  document.documentElement.lang = lang;
  $('lang').value = lang;
  $('lang').setAttribute('aria-label', t('language'));
  for (const e of document.querySelectorAll('[data-t]')) e.textContent = t(e.dataset.t);
  for (const e of document.querySelectorAll('[data-t-label]')) e.setAttribute('aria-label', t(e.dataset.tLabel));
  runButton.textContent = worker ? t('stop') : t('run');
}
const editor = $('editor'), output = $('output'), runButton = $('run');
let steps = [], at = 0, compiler = null, worker = null;
// a step whose program may run on the graphics card (its listing is marked
// role="gpu"): per step the runs so far, each with where its loops went
const runs = new Map();

function status(text, kind = '') {
  $('status').textContent = text;
  $('status').className = kind;
}

function append(text, cls = '') {
  if (text === '') return;
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = text;
  output.appendChild(span);
  output.scrollTop = output.scrollHeight;
}

// a step's program as the reader left it, kept in this browser where it allows
// (in German under a key of its own: its programs say other things)
const key = i => `scaly-tour${lang === 'en' ? '' : '-' + lang}:${steps[i].section}:${steps[i].ordinal}`;
function edited(i) {
  try { return localStorage.getItem(key(i)); } catch { return null; }
}
function keep(i, text) {
  try {
    if (text === steps[i].program) localStorage.removeItem(key(i));
    else localStorage.setItem(key(i), text);
  } catch {}
}

function show(i, push = true) {
  stop();
  at = Math.max(0, Math.min(i, steps.length - 1));
  const step = steps[at];
  $('title').textContent = step.title;
  $('chapter').textContent = step.chapter;
  $('prose').innerHTML = step.prose;
  $('count').textContent = `${at + 1} / ${steps.length}`;
  $('back').disabled = $('prev').disabled = at === 0;
  $('fwd').disabled = at === steps.length - 1;
  $('next').textContent = at === steps.length - 1 ? t('toRepl') : t('next');
  $('toc').value = String(at);
  $('main').classList.toggle('prose-only', step.program === null);
  editor.value = step.program === null ? '' : (edited(at) ?? step.program);
  output.textContent = '';
  showNotes(null);
  showTask();
  $('pictures').textContent = '';
  showDrawings([]);
  $('where').hidden = !step.gpu;
  $('experiment').hidden = !(step.race || step.sizes);
  $('experiment').textContent = step.race ? t('race') : step.sizes ? t('compare') : '';
  document.querySelector('.work').classList.toggle('card', step.gpu);
  showRuns();
  showExperiment();
  if (location.hash !== `#${at + 1}`) {
    if (push) history.pushState(null, '', `#${at + 1}`);
    else history.replaceState(null, '', `#${at + 1}`);
  }
  document.querySelector('.lesson').scrollTop = 0;
}

function stop() {
  worker?.terminate();
  worker = null;
  runButton.textContent = t('run');
  if (compiler) status(t('ready'), 'ok');
}

// --- tasks (P4) -------------------------------------------------------
// A step may set a task: after a run the page holds what the program printed
// against what the task expects, and the lizard says how it went. Hints come
// one by one; after the last, a solution. A solved task keeps its mark in
// this browser (✓ in the list of steps), in every language.
let hintsShown = 0;
const solvedKey = step => `scaly-playground:solved:${step.section}:${step.ordinal}`;
function solved(step) {
  try { return localStorage.getItem(solvedKey(step)) === '1'; } catch { return false; }
}
function showTask() {
  const step = steps[at];
  hintsShown = 0;
  $('revealed').textContent = '';
  $('praise').hidden = true;
  $('tasktools').hidden = !step.expect;
  $('solutionbtn').hidden = true;
  $('hintbtn').hidden = step.hints.length === 0;
  $('hintbtn').textContent = t('showHint');
}
$('hintbtn').onclick = () => {
  const step = steps[at];
  if (hintsShown >= step.hints.length) return;
  const p = document.createElement('p');
  p.innerHTML = step.hints[hintsShown++];
  $('revealed').appendChild(p);
  $('hintbtn').textContent = t('moreHint');
  if (hintsShown >= step.hints.length) {
    $('hintbtn').hidden = true;
    $('solutionbtn').hidden = !step.solution;
  }
};
$('solutionbtn').onclick = () => {
  const step = steps[at];
  const p = document.createElement('p');
  p.textContent = t('oneWay');
  const pre = document.createElement('pre');
  pre.textContent = step.solution;
  $('revealed').append(p, pre);
  $('solutionbtn').hidden = true;
};
// after a run that ended well: does it print what the task expects?
function judge() {
  const step = steps[at];
  if (!step.expect) return;
  const plain = text => text.replace(/[ \t]+$/gm, '').trim();
  const ok = plain(output.textContent) === plain(step.expect);
  $('praise').hidden = false;
  $('praise').classList.toggle('notyet', !ok);
  const words = t('praise');
  $('praisetext').textContent = ok ? words[Math.floor(Math.random() * words.length)] : t('notYet');
  if (ok && !solved(step)) {
    try { localStorage.setItem(solvedKey(step), '1'); } catch {}
    const option = $('toc').querySelector(`option[value="${at}"]`);
    if (option) option.textContent = `✓ ${option.textContent}`;
  }
}

// The values beside the code: a row per line of the editor, at its height,
// moved with its scrolling. A line that took several values (in a loop)
// shows the last, how many there were, and a curve where they are numbers.
let lastNotes = null;
function showNotes(notes) {
  lastNotes = notes;
  const box = $('notes'), rows = $('noterows');
  rows.textContent = '';
  box.classList.remove('stale');
  $('editwrap').classList.toggle('noted', !!notes && notes.byLine.size > 0);
  if (!notes || notes.byLine.size === 0) return;
  const height = parseFloat(getComputedStyle(editor).lineHeight) || 18.85;
  const count = editor.value.split('\n').length;
  for (let line = 1; line <= count; line++) {
    const row = document.createElement('div');
    row.className = 'row';
    row.style.height = `${height}px`;
    const entry = notes.byLine.get(line);
    if (entry) {
      const values = entry.values;
      const v = document.createElement('span');
      v.className = 'v';
      v.textContent = `${entry.name} = ${values[values.length - 1]}`;
      row.appendChild(v);
      const n = values.length + (entry.more ?? 0);
      if (n > 1) {
        const k = document.createElement('span');
        k.className = 'k';
        k.textContent = t('times')(n);
        row.appendChild(k);
        const numbers = values.map(Number);
        if (numbers.every(Number.isFinite)) row.appendChild(curve(numbers));
      }
      row.title = values.slice(0, 50).join(', ') + (n > 50 ? ', …' : '');
    }
    rows.appendChild(row);
  }
  rows.style.transform = `translateY(${-editor.scrollTop}px)`;
}
function curve(numbers) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 100 30');
  svg.setAttribute('preserveAspectRatio', 'none');
  const lo = Math.min(...numbers), hi = Math.max(...numbers);
  const points = numbers.map((n, i) =>
    `${(i / Math.max(1, numbers.length - 1) * 100).toFixed(1)},${(28 - (hi > lo ? (n - lo) / (hi - lo) : 0.5) * 26).toFixed(1)}`);
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
  line.setAttribute('points', points.join(' '));
  svg.appendChild(line);
  return svg;
}
editor.addEventListener('scroll', () => { $('noterows').style.transform = `translateY(${-editor.scrollTop}px)`; });

// A picture the program wrote (a file `<name>.<width>x<height>.rgba`, which
// the worker hands back): onto a canvas, as it is.
let lastPictures = [];
function showPictures(pictures) {
  lastPictures = pictures ?? [];
  const box = $('pictures');
  box.textContent = '';
  for (const p of pictures ?? []) {
    const figure = document.createElement('figure');
    const canvas = document.createElement('canvas');
    canvas.width = p.width;
    canvas.height = p.height;
    canvas.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(p.bytes.buffer), p.width, p.height), 0, 0);
    const caption = document.createElement('figcaption');
    caption.textContent = `${p.name} — ${t('points')(p.width, p.height)}`;
    figure.append(canvas, caption);
    box.appendChild(figure);
  }
}

// The drawings the program showed (scaly/draw.scaly: drawing-<n>.svg), each
// as an image -- an SVG in an image runs no script.
const drawingUrls = [];
function showDrawings(drawings) {
  for (const url of drawingUrls.splice(0)) URL.revokeObjectURL(url);
  const box = $('drawings');
  box.textContent = '';
  for (const d of drawings ?? []) {
    const url = URL.createObjectURL(new Blob([d.text], { type: 'image/svg+xml' }));
    drawingUrls.push(url);
    const img = document.createElement('img');
    img.src = url;
    img.alt = d.name;
    box.appendChild(img);
  }
  // a drawing takes room: the results get the share a card's step has
  document.querySelector('.work').classList.toggle('card', (drawings ?? []).length > 0 || (steps[at]?.gpu ?? false));
}

// The runs of this step, one bar each, as long as the program ran: the same
// program on the processor and on the card, side by side. A run the card
// took part in shows where its time went (runner.mjs, parts): compiling the
// kernel (once), the way to the card and back, the card computing, its
// results read and checked -- and the processor's own part of the program.
function showRuns() {
  const box = $('runs');
  box.textContent = '';
  const list = runs.get(at) ?? [];
  const longest = Math.max(1, ...list.map(r => r.ran));
  let keyed = false;
  for (const r of list) {
    const label = document.createElement('span');
    label.textContent = r.where;
    const bar = document.createElement('span');
    bar.className = r.cards > 0 ? 'bar card' : 'bar';
    bar.style.width = `${Math.max(1, 100 * r.ran / longest)}%`;
    const segment = (cls, ms) => {
      if (!(ms > 0)) return;
      const part = document.createElement('span');
      part.className = cls;
      part.style.width = `${Math.min(100, 100 * ms / r.ran)}%`;
      bar.appendChild(part);
    };
    const p = r.parts;
    if (r.cards > 0 && p && p.card > 0) {
      keyed = true;
      const compile = Math.min(p.compile, p.card);
      const there = p.there + p.back, read = p.read + p.errors;
      segment('compile', compile);
      segment('there', there);
      segment('compute', Math.max(0, p.card - compile - there - read));
      segment('read', read);
      segment('cpu', Math.max(0, r.ran - p.card));
    } else {
      const compiled = Math.min(r.compiled ?? 0, r.ran);
      segment('compile', compiled);
      const rest = document.createElement('span');
      rest.style.flex = '1';
      bar.appendChild(rest);
    }
    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = `${r.ran < 10 ? r.ran.toFixed(1) : Math.round(r.ran)} ms`;
    const what = document.createElement('span');
    what.className = 'what';
    what.textContent = r.what;
    box.append(label, bar, time, what);
  }
  if (keyed) {
    const key = document.createElement('span');
    key.className = 'key';
    for (const [cls, words] of Object.entries(t('key'))) {
      const item = document.createElement('span');
      const chip = document.createElement('i');
      chip.className = cls;
      item.append(chip, words);
      key.appendChild(item);
    }
    box.appendChild(key);
  }
}

// the program in a worker of its own: `scaly run main.scaly`, the compiler
// and the program in one memory (worker.mjs, side.mjs); no standard input.
// A step for the card runs with --gpu, over the page's card as the reader
// chose: on the processor, on the card, or where it pays.
// --- a step for the cores and the card -------------------------------------
// Such a step's program is BUILT here for wasm32-wasip1-threads with --gpu
// (worker.mjs running `scaly build`, over playground.json: the standard
// library compiled for it), then run by runner.mjs on as many cores as the
// reader chose, the page the coordinator of its threads (threads.mjs), the
// card beside them. `scaly run` in the page has one core: its program lives
// in the compiler's own memory.
const cpus = navigator.hardwareConcurrency || 1;
let runner = null, runnerCard = false, noCardWhy = '', building = null, threadsLib = null;

async function prepareCores() {
  if (!building) building = (async () => {
    status(t('preparing'));
    const listing = await (await fetch('playground.json')).json();
    for (const [path, b64] of Object.entries(listing))
      compiler.files[path] = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    threadsLib = await import('./threads.mjs');
    runner = new Worker('runner.mjs', { type: 'module' });
    runnerCard = await new Promise(resolve => {
      runner.onmessage = ({ data }) => {
        if (data.type !== 'ready') return;
        // why not: the page itself without WebGPU, or what the card's worker said
        noCardWhy = navigator.gpu ? data.why || 'unknown' : 'no WebGPU in this browser (navigator.gpu)';
        resolve(data.card);
      };
      runner.postMessage({ type: 'hello' });
    });
  })();
  return building;
}

function buildForCores(text) {
  return new Promise(resolve => {
    const w = new Worker('worker.mjs', { type: 'module' });
    worker = w;
    const said = [], decoder = new TextDecoder();
    w.onmessage = ({ data }) => {
      if (data.type === 'out' || data.type === 'err') said.push(decoder.decode(data.bytes));
      else if (data.type === 'exit' || data.type === 'crash') {
        w.terminate();
        resolve({ status: data.type === 'exit' ? data.status : 'crash', bytes: data.collected?.['/work/main.wasm'] ?? null,
                  said: said.join('') + (data.text ?? '') });
      }
    };
    w.onerror = e => { w.terminate(); resolve({ status: 'crash', bytes: null, said: e.message }); };
    w.postMessage({ module: compiler.module, files: { ...compiler.files, '/work/main.scaly': text },
                    args: ['scaly', 'build', '--target', 'wasm32-wasip1-threads', '--gpu', 'main.scaly', '-o', 'main.wasm'],
                    env: { SCALY_CACHE: '/cache' }, collect: ['/work/main.wasm'] });
  });
}

// The program in the editor, built and handed to the runner -- once for
// each text: a race runs it many times. Answers how long the build took (0
// where it was there already), or null where it did not build.
let loadedText = null;
async function ensureBuilt() {
  await prepareCores();
  if (loadedText === editor.value) return 0;
  loadedText = null;
  status(t('building'));
  const t0 = performance.now();
  const text = editor.value;
  const built = await buildForCores(text);
  worker = null;
  if (built.status !== 0 || !built.bytes) {
    append(built.said || t('compilerEnded')(built.status), 'err');
    status(t('notBuilt'), 'bad');
    return null;
  }
  const compiled = performance.now() - t0;
  await new Promise(resolve => {
    runner.onmessage = ({ data }) => { if (data.type === 'loaded') resolve(); };
    runner.postMessage({ type: 'load', bytes: built.bytes }, [built.bytes.buffer]);
  });
  loadedText = text;
  return compiled;
}

// One run of the built program on `workers` cores, the card 'off', 'on' or
// 'auto'; its output goes to the page where `echo` says so.
//
// The workers of the program's threads are kept from run to run: a program
// ends its pool's threads at its end (eio_wasm.c, scaly_wasm_pipes_end),
// and their workers wait, idle, for the next run's. A new worker loads
// thread.mjs and its modules -- on scaly.io a way to the CDN each, which a
// page sent with no-cache revalidates: spectral-norm on all cores took 57
// to 287 ms there, 22 locally (2026-11-17). After a run that did not end
// well, its workers are ended: a thread may still be at work in it.
let threads = null, threadsSay = null;
async function runWay(workers, gpu, echo = true) {
  const env = { SCALY_CPUS: String(cpus), SCALY_WORKERS: String(workers) };
  let resolve;
  const done = new Promise(r => { resolve = r; });
  threadsSay = {
    out: b => { if (echo) append(new TextDecoder().decode(b)); },
    err: b => { if (echo) append(new TextDecoder().decode(b), 'err'); },
    exit: s => resolve({ status: String(s), stdout: '', stderr: '', ms: 0, pictures: [], drawings: [], cards: 0 }),
  };
  threads ??= await threadsLib.Threads.create({
    out: b => threadsSay.out(b), err: b => threadsSay.err(b), exit: s => threadsSay.exit(s), env,
  });
  threads.env = env;
  runner.onmessage = ({ data }) => { if (threads.handle(data)) return; if (data.type === 'done') resolve(data); };
  runner.postMessage({ type: 'run', args: [], env, gpu });
  const r = await done;
  if (r.status !== '0') {
    threads.end();
    threads = null;
  }
  return r;
}

async function runOnCores() {
  const choice = $('where').value, step = at;
  const workers = choice === 'one' ? 1 : cpus;
  const gpu = choice === 'card' ? 'on' : choice === 'auto' ? 'auto' : 'off';
  output.textContent = '';
  $('pictures').textContent = '';
  showDrawings([]);
  runButton.textContent = t('stop');
  try {
    const compiled = await ensureBuilt();
    if (compiled === null) return;
    status(t('running'));
    const r = await runWay(workers, gpu);
    append(r.stdout);
    if (r.stderr) append(r.stderr, 'err');
    showPictures(r.pictures);
    showDrawings(r.drawings);
    if (r.status !== '0') { status(t('ended')(r.status), 'bad'); return; }
    const where = choice === 'one' ? t('oneCore') : choice === 'all' ? t('cores')(cpus)
      : choice === 'card' ? (runnerCard ? t('theCard') : t('noCard')) : t('auto');
    let what = compiled > 0 ? t('builtIn')(Math.round(compiled)) : '';
    if ((choice === 'card' || choice === 'auto') && !runnerCard) what += t('noCardGiven')(noCardWhy);
    else if (r.cards > 0) what += t('cardRan')(r.cards) + (r.compiled >= 1 ? t('compiledOnce')(Math.round(r.compiled)) : '');
    else what += workers > 1 ? t('upTo')(workers) : t('onOne');
    const list = runs.get(step) ?? [];
    list.push({ where, cards: r.cards, ran: r.ms, compiled: r.compiled ?? 0, parts: r.parts, what });
    runs.set(step, list.slice(-6));
    showRuns();
    status(t('done')(Math.round(r.ms)), 'ok');
  } finally {
    worker = null;
    runButton.textContent = t('run');
  }
}

// --- a step's experiment ----------------------------------------------------
// role="gpu-race": the program on 1, 2, 4 ... cores and on the card, its
// speedup against one core drawn against the cores. role="gpu-sizes": the
// program prints `size <n> <ms>` for growing n; it runs on all cores, on the
// card and where it pays, and the times are drawn against n.
const experiments = new Map();     // per step: { kind, ... } of its last experiment
let experimenting = false;

async function experiment() {
  const step = at, kind = steps[at].race ? 'race' : 'sizes';
  if (experimenting || worker) return;
  experimenting = true;
  $('experiment').disabled = runButton.disabled = true;
  output.textContent = '';
  try {
    if (await ensureBuilt() === null) return;
    if (kind === 'race') {
      const ways = [];
      for (let w = 1; w < cpus; w *= 2) ways.push(w);
      ways.push(cpus);
      const result = { kind, cores: [], card: null };
      experiments.set(step, result);
      for (const w of ways) {
        status(t('racing')(t('cores')(w)));
        const r = await runWay(w, 'off', false);
        if (r.status !== '0') { status(t('ended')(r.status), 'bad'); return; }
        result.cores.push({ workers: w, ms: r.ms });
        if (w === 1) { showPictures(r.pictures); showDrawings(r.drawings); }
        showExperiment();
      }
      if (runnerCard) {
        status(t('racing')(t('theCard')));
        const r = await runWay(cpus, 'on', false);
        if (r.status === '0' && r.cards > 0) result.card = { ms: Math.max(0.1, r.ms - (r.compiled ?? 0)) };
      } else result.noCard = noCardWhy;
      showExperiment();
      status(t('raceDone'), 'ok');
    } else {
      const result = { kind, series: [] };
      experiments.set(step, result);
      const ways = [['cores', cpus, 'off']];
      if (runnerCard) ways.push(['card', cpus, 'on'], ['auto', cpus, 'auto']);
      else result.noCard = noCardWhy;
      for (const [name, w, gpu] of ways) {
        const label = name === 'cores' ? t('seriesCores')(w) : name === 'card' ? t('seriesCard') : t('seriesAuto');
        status(t('comparing')(label));
        const r = await runWay(w, gpu, false);
        if (r.status !== '0') { status(t('ended')(r.status), 'bad'); return; }
        const points = [...r.stdout.matchAll(/^size (\d+) ([0-9.eE+-]+)$/gm)].map(m => ({ n: Number(m[1]), ms: Math.max(0.001, Number(m[2])) }));
        result.series.push({ name, label, points });
        showExperiment();
      }
      status(t('compareDone'), 'ok');
    }
  } finally {
    experimenting = false;
    $('experiment').disabled = runButton.disabled = false;
    worker = null;
  }
}
$('experiment').onclick = experiment;

// The experiment's chart: an SVG of its own, both axes logarithmic.
function showExperiment() {
  const result = experiments.get(at);
  const box = $('experimentbox'), svg = $('experimentchart');
  box.hidden = !result;
  if (!result) return;
  const L = 52, R = 20, T = 18, B = 222, W = 560 - L - R, H = B - T;
  const parts = [];
  const esc = x => String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const text = (x, y, words, anchor = 'middle', cls = '') =>
    parts.push(`<text x="${x}" y="${y}" text-anchor="${anchor}"${cls ? ` class="${cls}"` : ''}>${esc(words)}</text>`);
  const logScale = (lo, hi, from, to) => v => from + (Math.log(v / lo) / Math.log(hi / lo)) * (to - from);
  parts.push(`<line class="axis" x1="${L}" y1="${B}" x2="${L + W}" y2="${B}"/><line class="axis" x1="${L}" y1="${B}" x2="${L}" y2="${T}"/>`);
  const round = v => v >= 100 ? Math.round(v) : v >= 10 ? Math.round(v) : v >= 1 ? +v.toFixed(1) : +v.toPrecision(1);
  // round values on a logarithmic axis: 1, 2, 5, 10, ...
  const decades = (lo, hi) => {
    const out = [];
    for (let p = Math.floor(Math.log10(lo)); p <= Math.ceil(Math.log10(hi)); p++)
      for (const m of [1, 2, 5]) { const v = m * 10 ** p; if (v >= lo && v <= hi) out.push(v); }
    return out;
  };
  if (result.kind === 'race') {
    const one = result.cores.find(c => c.workers === 1);
    if (!one) { svg.innerHTML = ''; return; }
    const speed = ms => one.ms / ms;
    const maxX = Math.max(2, ...result.cores.map(c => c.workers));
    const speeds = result.cores.map(c => speed(c.ms)).concat(result.card ? [speed(result.card.ms)] : []);
    const hiY = Math.max(maxX, ...speeds) * 1.3, loY = Math.min(1, ...speeds) / 1.3;
    const x = logScale(1, maxX, L, L + W), y = logScale(loY, hiY, B, T);
    for (const v of decades(loY, hiY)) {
      parts.push(`<line class="grid" x1="${L}" y1="${y(v)}" x2="${L + W}" y2="${y(v)}"/>`);
      text(L - 6, y(v) + 4, t('timesFaster')(v), 'end');
    }
    for (const c of result.cores) text(x(c.workers), B + 15, String(c.workers));
    text(L + W / 2, B + 32, t('speedupAxis'));
    parts.push(`<polyline class="ideal" points="${x(1)},${y(1)} ${x(maxX)},${y(Math.min(maxX, hiY))}"/>`);
    parts.push(`<polyline class="s0" points="${result.cores.map(c => `${x(c.workers)},${y(speed(c.ms))}`).join(' ')}"/>`);
    for (const c of result.cores) parts.push(`<circle class="d0" cx="${x(c.workers)}" cy="${y(speed(c.ms))}" r="3.5"/>`);
    for (const c of result.cores) text(x(c.workers), y(speed(c.ms)) - 8, `${round(speed(c.ms))}×`);
    if (result.card) {
      const s = speed(result.card.ms);
      parts.push(`<line class="s1" x1="${L}" y1="${y(s)}" x2="${L + W}" y2="${y(s)}"/>`);
      text(L + W, y(s) - 6, t('speedupCard')(round(s)), 'end', 'strong');
    }
    $('experimentnote').textContent = t('raceNote') + (result.noCard ? ' ' + t('noCardHere')(result.noCard) : '');
  } else {
    const all = result.series.flatMap(s => s.points);
    if (all.length === 0) { svg.innerHTML = ''; return; }
    const loX = Math.min(...all.map(p => p.n)), hiX = Math.max(...all.map(p => p.n));
    const loY = Math.min(...all.map(p => p.ms)) / 1.5, hiY = Math.max(...all.map(p => p.ms)) * 1.5;
    const x = logScale(loX, Math.max(hiX, loX * 2), L, L + W), y = logScale(loY, hiY, B, T);
    for (const v of decades(loY, hiY)) {
      parts.push(`<line class="grid" x1="${L}" y1="${y(v)}" x2="${L + W}" y2="${y(v)}"/>`);
      text(L - 6, y(v) + 4, `${round(v)} ms`, 'end');
    }
    const ns = [...new Set(all.map(p => p.n))].sort((a, b) => a - b);
    for (const n of ns) text(x(n), B + 15, n >= 1048576 ? `${n / 1048576}M` : n >= 1024 ? `${n / 1024}k` : String(n));
    text(L + W / 2, B + 32, t('sizesAxis'));
    result.series.forEach((s, i) => {
      if (s.points.length === 0) return;
      parts.push(`<polyline class="s${i}" points="${s.points.map(p => `${x(p.n)},${y(p.ms)}`).join(' ')}"/>`);
      for (const p of s.points) parts.push(`<circle class="d${i}" cx="${x(p.n)}" cy="${y(p.ms)}" r="3"/>`);
      const last = s.points[s.points.length - 1];
      text(L + W - 2, T + 12 + i * 15, s.label, 'end', '');
      parts.push(`<line class="s${i}" x1="${L + W - 2 - 7 * s.label.length - 26}" y1="${T + 8 + i * 15}" x2="${L + W - 2 - 7 * s.label.length - 8}" y2="${T + 8 + i * 15}"/>`);
    });
    // where the card is faster from then on
    const cores = result.series.find(s => s.name === 'cores'), card = result.series.find(s => s.name === 'card');
    let note = t('sizesNote');
    if (cores && card && card.points.length) {
      const coresAt = n => cores.points.find(p => p.n === n)?.ms;
      let from = null;
      for (const p of card.points) {
        const c = coresAt(p.n);
        if (c === undefined) continue;
        if (p.ms < c) { if (from === null) from = p.n; } else from = null;
      }
      if (from !== null) {
        parts.push(`<line class="mark" x1="${x(from)}" y1="${T}" x2="${x(from)}" y2="${B}"/>`);
        text(x(from) + 4, B - 6, t('fromN')(from.toLocaleString(lang)), 'start', 'strong');
        note += ' ' + t('fromN')(from.toLocaleString(lang)) + '.';
      } else note += ' ' + t('never') + '.';
    }
    $('experimentnote').textContent = note + (result.noCard ? ' ' + t('noCardHere')(result.noCard) : '');
  }
  svg.innerHTML = parts.join('');
}

// Run the step's program -- with its notes (notes.mjs): a call after each
// binding and assignment of the program. A value whose type has no text
// makes the compiler refuse its note; the page leaves exactly those out and
// runs again (`without`, original lines). What the compiler says is held
// until the program writes something of its own, so a refusal of a note is
// never seen; its line numbers are the program's own.
function run(without = new Set(), attempt = 0) {
  if (!compiler) return;
  if (worker) { stop(); append(t('stopped'), 'note'); return; }
  if (steps[at].gpu) { runOnCores(); return; }
  output.textContent = '';
  const stdin = new SharedArrayBuffer(16);
  const state = new Int32Array(stdin, 0, 2);
  const decoders = { out: new TextDecoder(), err: new TextDecoder() };
  const t0 = performance.now();
  $('pictures').textContent = '';
  showDrawings([]);
  const instr = instrument(editor.value, without);
  const noted = instr.count > 0;
  const notes = new Notes();
  let held = [], raw = '', speaking = false;
  const diagnostic = line => line === '' || /^main\.scaly:\d+:\d+:/.test(line) || /^\s/.test(line);
  const say = (text, cls) => {
    if (speaking) { append(text, cls); return; }
    held.push([text, cls]);
    if (held.map(h => h[0]).join('').split('\n').slice(0, -1).some(l => !diagnostic(l))) flush();
  };
  const flush = () => { speaking = true; for (const [text, cls] of held) append(text, cls); held = []; };
  const files = { ...compiler.files, '/work/main.scaly': noted ? instr.text : editor.value };
  worker = new Worker('worker.mjs', { type: 'module' });
  runButton.textContent = t('stop');
  status(t('compilingRunning'));
  worker.onmessage = ({ data }) => {
    switch (data.type) {
      case 'out':
      case 'err': {
        let text = decoders[data.type].decode(data.bytes, { stream: true });
        if (!speaking) raw += text;
        if (noted) {
          if (data.type === 'out') text = notes.take(text);
          text = relines(text, instr.lines);
        }
        if (text !== '') say(text, data.type === 'err' ? 'err' : '');
        break;
      }
      case 'wants':
        Atomics.store(state, 0, 2);
        Atomics.notify(state, 0);
        break;
      case 'exit': {
        if (noted && data.status !== 0 && !speaking && attempt < 8) {
          const failed = failedNotes(raw, instr.text, instr.lines);
          if (failed.size > 0) {
            stop();
            run(new Set([...without, ...failed]), attempt + 1);
            return;
          }
        }
        const ms = Math.round(performance.now() - t0);
        if (noted) { const rest = notes.take('', true); if (rest) say(rest, ''); }
        flush();
        showNotes(noted ? notes : null);
        showPictures(data.pictures);
        showDrawings(data.drawings);
        stop();
        if (data.status !== 0) append(t('endedNote')(data.status), 'note');
        status(t('done')(ms), data.status === 0 ? 'ok' : 'bad');
        if (data.status === 0) judge();
        break;
      }
      case 'crash':
        flush();
        stop();
        append(t('stoppedBy')(data.text), 'err');
        status(t('runFailed'), 'bad');
        break;
    }
  };
  worker.onerror = e => {
    flush();
    stop();
    append(t('workerFailed')(e.message), 'err');
  };
  worker.postMessage({ module: compiler.module, files, stdin, args: ['scaly', 'run', 'main.scaly'] });
}

runButton.onclick = () => run();
$('reset').onclick = () => {
  const step = steps[at];
  if (step.program === null) return;
  editor.value = step.program;
  keep(at, step.program);
  output.textContent = '';
};
$('back').onclick = $('prev').onclick = () => show(at - 1);
$('fwd').onclick = () => show(at + 1);
$('next').onclick = () => { if (at === steps.length - 1) location.href = 'index.html'; else show(at + 1); };
$('toc').onchange = () => show(Number($('toc').value));
editor.oninput = () => { keep(at, editor.value); $('notes').classList.add('stale'); $('praise').hidden = true; };
editor.onkeydown = e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    run();
  } else if (e.key === 'Tab' && !e.shiftKey) {
    e.preventDefault();
    editor.setRangeText('    ', editor.selectionStart, editor.selectionEnd, 'end');
    keep(at, editor.value);
  }
};
addEventListener('hashchange', () => {
  const n = Number(location.hash.slice(1));
  if (n >= 1 && n - 1 !== at) show(n - 1, false);
});

// the steps, set by the DSSSL engine: the book's tour first, as the
// tutorial has it (tour-steps.htm, docs/dsssl/scaly-tour.dsl), then the
// playground's own chapters (playground-steps.htm, docs/scaly-playground.xml);
// in German all of them from one file, the tour translated
// (playground-steps.de.htm, docs/scaly-playground.de.xml)
async function loadSteps() {
  const seen = {};
  steps = [];
  $('toc').textContent = '';
  const files = lang === 'en' ? [['tour-steps.htm', 'A Tour of Scaly'], ['playground-steps.htm', null]]
                              : [[`playground-steps.${lang}.htm`, null]];
  for (const [file, chapter] of files) {
    const response = await fetch(file);
    if (!response.ok) continue;
    const doc = new DOMParser().parseFromString(await response.text(), 'text/html');
    for (const s of doc.querySelectorAll('section.step')) {
      const section = s.dataset.section;
      seen[section] = (seen[section] ?? 0) + 1;
      const program = s.querySelector('pre.program');
      // a task: what the program must print, one way to do it, the hints --
      // out of the prose, the page shows them when the time comes
      const prose = s.querySelector('.prose');
      const expect = prose.querySelector('pre.expect');
      const solution = prose.querySelector('pre.solution');
      const hints = [...prose.querySelectorAll('p.hint')];
      for (const e of [expect, solution, ...hints]) e?.remove();
      steps.push({
        expect: expect ? expect.textContent : null,
        solution: solution ? solution.textContent : null,
        hints: hints.map(h => h.innerHTML),
        section, ordinal: seen[section],
        chapter: chapter ?? s.dataset.chapter ?? '',
        // the book's tour, in English or translated: not the playground's own
        tour: chapter !== null || s.dataset.chapterId === 'pg-tour',
        chapterId: chapter !== null ? 'pg-tour' : s.dataset.chapterId ?? '',
        title: s.querySelector('h2').textContent,
        prose: prose.innerHTML,
        program: program ? program.textContent : null,
        gpu: program ? program.classList.contains('gpu') : false,
        race: program ? program.classList.contains('race') : false,
        sizes: program ? program.classList.contains('sizes') : false,
      });
    }
  }
  let group = null;
  steps.forEach((s, i) => {
    if (!group || group.label !== s.chapter) {
      group = document.createElement('optgroup');
      group.label = s.chapter;
      $('toc').appendChild(group);
    }
    const option = document.createElement('option');
    option.value = String(i);
    option.textContent = `${solved(s) ? '✓ ' : ''}${i + 1}. ${s.title}`;
    group.appendChild(option);
  });
  const n = Number(location.hash.slice(1));
  show(n >= 1 ? n - 1 : 0, false);
}

translatePage();
$('lang').onchange = async () => {
  lang = $('lang').value;
  try { localStorage.setItem('scaly-playground:lang', lang); } catch {}
  const url = new URL(location.href);
  if (url.searchParams.has('lang')) { url.searchParams.set('lang', lang); history.replaceState(null, '', url); }
  translatePage();
  runs.clear();
  await loadSteps();
};
await loadSteps();
try {
  compiler = await loadCompiler(text => status(text), { lang });
  runButton.disabled = false;
  status(t('ready'), 'ok');
} catch (e) {
  status(t('compilerFailed')(e.message), 'bad');
}

// ?selftest (tests/gpu/web/run.sh): every step of the playground's own
// chapters run once -- a step for the cores on one core and on all of them,
// whose pictures must agree --, and what each showed posted to /result
if (new URLSearchParams(location.search).has('selftest') && compiler) {
  const report = [];
  const idle = async () => { while (worker !== null || /…$/.test($('status').textContent)) await new Promise(r => setTimeout(r, 50)); };
  for (let i = 0; i < steps.length; i++) {
    if (steps[i].tour || steps[i].program === null) continue;
    show(i, false);
    const modes = steps[i].gpu ? ['one', 'all'] : [null];
    const seen = [];
    for (const mode of modes) {
      if (mode) $('where').value = mode;
      if (steps[i].gpu) await runOnCores(); else { run(); await idle(); }
      seen.push({ mode, status: $('status').textContent, ok: $('status').className === 'ok',
                  output: output.textContent.trim().slice(0, 200), drawings: $('drawings').children.length,
                  pictures: lastPictures.map(p => ({ name: p.name, width: p.width, height: p.height, bytes: Array.from(p.bytes.slice(0, 0)).length, hash: Array.from(p.bytes).reduce((h, b) => Math.imul(h ^ b, 16777619) >>> 0, 2166136261) })) });
    }
    // and its experiment: the race or the comparison, drawn
    let tried = null;
    if (steps[i].race || steps[i].sizes) {
      await experiment();
      const e = experiments.get(i);
      tried = { kind: e?.kind, status: $('status').textContent, ok: $('status').className === 'ok',
                points: e ? (e.kind === 'race' ? e.cores.length : e.series.reduce((n, s) => n + s.points.length, 0)) : 0,
                card: e ? (e.kind === 'race' ? !!e.card : e.series.some(s => s.name === 'card' && s.points.length > 0)) : false,
                drawn: $('experimentchart').children.length };
    }
    report.push({ title: steps[i].title, section: steps[i].section, chapter: steps[i].chapterId, gpu: steps[i].gpu, runs: seen, experiment: tried });
  }
  // and the values beside the code: the tour's step on values and bindings
  let notes = null;
  const values = steps.findIndex(s => s.section === 'tut-values');
  if (values >= 0) {
    show(values, false);
    run();
    await idle();
    notes = lastNotes ? Object.fromEntries([...lastNotes.byLine].map(([l, n]) => [l, [n.name, ...n.values]])) : {};
  }
  // and a task: its program as given is not yet what it asks, its solution is
  let task = null;
  const sum = steps.findIndex(s => s.section === 'pg-sum');
  if (sum >= 0) {
    show(sum, false);
    editor.value = steps[sum].program;
    run(); await idle();
    const before = { shown: !$('praise').hidden, ok: !$('praise').classList.contains('notyet') };
    editor.value = steps[sum].solution;
    run(); await idle();
    task = { before, after: { shown: !$('praise').hidden, ok: !$('praise').classList.contains('notyet'), text: $('praisetext').textContent },
             hints: steps[sum].hints.length };
    editor.value = steps[sum].program;
  }
  await fetch('/result', { method: 'POST', body: JSON.stringify({ lang, steps: steps.length, report, notes, task }) });
}
