<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scaly Playground</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --bg: #fbfbfa; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #dcdcde;
    --accent: #2a5db0; --ok: #1f7a3a; --bad: #b3261e; --code: #f4f4f2;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161618; --panel: #1f1f22; --ink: #ececee; --muted: #9a9aa2; --line: #34343a;
      --accent: #7aa7f0; --ok: #6cc788; --bad: #f08a80; --code: #26262a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 12px 16px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
  header h1 img { width: 32px; height: 32px; }
  header .spacer { flex: 1; }
  .steps { display: flex; gap: 6px; align-items: center; }
  .steps button { padding: 4px 10px; }
  header a { color: var(--accent); text-decoration: none; font-size: 14px; }
  select { font: inherit; font-size: 14px; padding: 4px 6px; border-radius: 6px; max-width: 100%;
           border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  main { display: grid; grid-template-columns: 1fr; gap: 16px; padding: 16px; max-width: 1400px; margin: 0 auto; }
  .work { display: flex; flex-direction: column; gap: 10px; }
  main.prose-only { grid-template-columns: minmax(0, 760px); justify-content: center; }
  main.prose-only .work { display: none; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .lesson { display: flex; flex-direction: column; overflow: auto; }
  .lesson h2 { font-size: 20px; margin: 0 0 8px; }
  .lesson .chapter { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  #drawings img { display: block; max-width: 100%; height: auto; border-radius: 6px; border: 1px solid var(--line);
                  background: #fff; margin-bottom: 8px; }
  #drawings:empty { display: none; }
  .lesson .prose { flex: 1; }
  .lesson .prose p { margin: 0 0 12px; }
  .lesson a { color: var(--accent); }
  code, pre, textarea { font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .lesson code { background: var(--code); padding: 1px 4px; border-radius: 4px; }
  .lesson pre { background: var(--code); padding: 10px; border-radius: 6px; overflow: auto; margin: 0 0 12px; }
  .nav { display: flex; align-items: center; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
  .nav .count { flex: 1; text-align: center; color: var(--muted); font-size: 14px; }
  button { font: inherit; font-size: 14px; padding: 5px 12px; border-radius: 6px; cursor: pointer;
           border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  header nav { display: flex; gap: 16px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #status { font-size: 14px; color: var(--muted); }
  #status.ok { color: var(--ok); }
  #status.bad { color: var(--bad); }
  #editor { width: 100%; min-height: 240px; height: 22em; resize: vertical; padding: 10px;
            border: 1px solid var(--line); border-radius: 6px; background: var(--code); color: var(--ink);
            tab-size: 4; white-space: pre; overflow: auto; }
  .hint { font-size: 12px; color: var(--muted); }
  #output { margin: 0; padding: 10px; background: var(--code); border-radius: 6px; overflow: auto;
            white-space: pre-wrap; overflow-wrap: anywhere; min-height: 80px; }
  #output .err { color: var(--bad); }
  #output .note { color: var(--muted); font-style: italic; }
  .results { display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow: auto; }
  #pictures canvas { display: block; max-width: 100%; height: auto; border-radius: 6px; border: 1px solid var(--line); }
  #pictures figcaption, .runs .what { font-size: 12px; color: var(--muted); }
  #pictures figure { margin: 0; }
  .runs { display: grid; grid-template-columns: max-content minmax(60px, 1fr) max-content; gap: 4px 10px;
          align-items: center; font-size: 13px; }
  .runs:empty, #pictures:empty { display: none; }
  .runs .bar { height: 10px; border-radius: 5px; background: var(--muted); min-width: 2px; }
  .runs .bar.card { background: var(--accent); }
  .runs .time { font-variant-numeric: tabular-nums; }
  .runs .what { grid-column: 1 / -1; margin: -2px 0 4px; }
  /* last: the wide layout overrides the base rules above */
  @media (min-width: 900px) {
    main { grid-template-columns: minmax(300px, 2fr) 3fr; height: calc(100vh - 58px); }
    .lesson, .work { min-height: 0; }
    .work { display: grid; grid-template-rows: auto minmax(0, 1fr) auto minmax(80px, 30%); }
    .work.card { grid-template-rows: auto minmax(0, 1fr) auto minmax(80px, 55%); }
    #editor { height: 100%; min-height: 0; resize: none; }
  }
</style>
</head>
<body>
<header>
  <h1><img src="lizard.svg" alt="">Scaly Playground</h1>
  <span class="steps">
    <button id="prev" aria-label="Previous step" data-t-label="previous">‹</button>
    <select id="toc" aria-label="Steps of the playground" data-t-label="toc"></select>
    <button id="fwd" aria-label="Next step" data-t-label="forward">›</button>
  </span>
  <span class="spacer"></span>
  <nav>
    <a href="https://scaly.io/scaly/">Scaly</a>
    <a href="index.html" data-t="repl">The REPL</a>
    <a href="https://scaly.io/lang/" data-t="spec">The specification</a>
  </nav>
  <select id="lang" aria-label="Language">
    <option value="en">English</option>
    <option value="de">Deutsch</option>
  </select>
</header>
<main id="main">
  <section class="lesson">
    <div class="chapter" id="chapter"></div>
    <h2 id="title">Scaly Playground</h2>
    <div class="prose" id="prose"><p data-t="loading">Loading the playground…</p></div>
    <div class="nav">
      <button id="back" data-t="back">‹ Back</button>
      <span class="count" id="count"></span>
      <button id="next">Next ›</button>
    </div>
  </section>
  <section class="work">
    <div class="toolbar">
      <button class="primary" id="run" disabled>Run</button>
      <button id="reset" data-t="reset">Reset</button>
      <select id="where" aria-label="Where the loops run" data-t-label="where" hidden>
        <option value="one" data-t="one">On one core</option>
        <option value="all" data-t="all">On all cores</option>
        <option value="card" data-t="card">On the graphics card</option>
        <option value="auto" data-t="auto" selected>Where it pays</option>
      </select>
      <span id="status">Loading…</span>
    </div>
    <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off"
              aria-label="The program" data-t-label="program"></textarea>
    <div class="hint" data-t="hint">Change the program and run it again — Ctrl+Enter or ⌘+Enter runs it.
      The compiler and the program run in this browser tab.</div>
    <div class="results">
      <div class="runs" id="runs" aria-label="The runs of this program" data-t-label="runs"></div>
      <div id="drawings"></div>
      <div id="pictures"></div>
      <pre id="output" aria-live="polite"></pre>
    </div>
  </section>
</main>

<script type="module">
import { loadCompiler } from './load.mjs';

const $ = id => document.getElementById(id);

// --- the language -------------------------------------------------------
// English or German: what the reader chose (?lang=, or the switch, kept in
// this browser), else the first of the browser's languages the playground
// has -- navigator.languages, the order the reader's system and browser
// prefer. The steps in German are the tour of the book translated, then
// the playground's chapters (playground-steps.de.htm,
// docs/scaly-playground.de.xml); the book itself is in English.
const LANGS = ['en', 'de'];
const TEXT = {
  en: {
    repl: 'The REPL', spec: 'The specification', loading: 'Loading the playground…',
    back: '‹ Back', next: 'Next ›', toRepl: 'The REPL ›', run: 'Run', stop: 'Stop', reset: 'Reset',
    one: 'On one core', all: 'On all cores', card: 'On the graphics card', auto: 'Where it pays',
    hint: 'Change the program and run it again — Ctrl+Enter or ⌘+Enter runs it. The compiler and the program run in this browser tab.',
    previous: 'Previous step', forward: 'Next step', toc: 'Steps of the playground', where: 'Where the loops run',
    program: 'The program', runs: 'The runs of this program', language: 'Language',
    tour: 'A Tour of Scaly', ready: 'Ready.', compilerFailed: m => `Could not load the compiler: ${m}`,
    preparing: 'Loading what a build for the cores needs…', building: 'Building…', running: 'Running…',
    compilingRunning: 'Compiling and running…', notBuilt: 'It did not build.', compilerEnded: s => `the compiler ended with ${s}\n`,
    ended: s => `The program ended with ${s}.`, endedNote: s => `\n[the program ended with status ${s}]\n`,
    done: ms => `Done in ${ms} ms.`, runFailed: 'The run failed.', stopped: '\n[stopped]\n',
    stoppedBy: t => `\n[stopped: ${t}]\n`, workerFailed: m => `\n[the worker failed: ${m}]\n`,
    oneCore: 'One core', cores: n => `${n} cores`, theCard: 'The card', noCard: 'No card',
    builtIn: ms => `built in ${ms} ms; `, noCardGiven: 'this browser gives the page no graphics card, the cores ran it',
    cardRan: n => `the card ran ${n} ${n === 1 ? 'loop' : 'loops'}`,
    upTo: n => `the loops ran on up to ${n} cores`, onOne: 'the loops ran on one core',
    points: (w, h) => `${w} × ${h} points`,
  },
  de: {
    repl: 'Die REPL', spec: 'Die Spezifikation', loading: 'Der Playground lädt…',
    back: '‹ Zurück', next: 'Weiter ›', toRepl: 'Zur REPL ›', run: 'Ausführen', stop: 'Anhalten', reset: 'Zurücksetzen',
    one: 'Auf einem Kern', all: 'Auf allen Kernen', card: 'Auf der Grafikkarte', auto: 'Wo es sich lohnt',
    hint: 'Ändere das Programm und lass es noch einmal laufen — Strg+Enter oder ⌘+Enter führt es aus. Der Compiler und das Programm laufen in diesem Browser-Tab.',
    previous: 'Voriger Schritt', forward: 'Nächster Schritt', toc: 'Die Schritte des Playgrounds', where: 'Wo die Schleifen laufen',
    program: 'Das Programm', runs: 'Die Läufe dieses Programms', language: 'Sprache',
    tour: 'Eine Rundreise durch Scaly', ready: 'Bereit.', compilerFailed: m => `Der Compiler ließ sich nicht laden: ${m}`,
    preparing: 'Lade, was ein Bau für die Kerne braucht…', building: 'Baue…', running: 'Läuft…',
    compilingRunning: 'Übersetze und führe aus…', notBuilt: 'Es ließ sich nicht bauen.', compilerEnded: s => `der Compiler endete mit ${s}\n`,
    ended: s => `Das Programm endete mit ${s}.`, endedNote: s => `\n[das Programm endete mit Status ${s}]\n`,
    done: ms => `Fertig in ${ms} ms.`, runFailed: 'Der Lauf ist fehlgeschlagen.', stopped: '\n[angehalten]\n',
    stoppedBy: t => `\n[angehalten: ${t}]\n`, workerFailed: m => `\n[der Worker ist fehlgeschlagen: ${m}]\n`,
    oneCore: 'Ein Kern', cores: n => `${n} Kerne`, theCard: 'Die Karte', noCard: 'Keine Karte',
    builtIn: ms => `gebaut in ${ms} ms; `, noCardGiven: 'dieser Browser gibt der Seite keine Grafikkarte, die Kerne haben gerechnet',
    cardRan: n => `die Karte hat ${n} ${n === 1 ? 'Schleife' : 'Schleifen'} gerechnet`,
    upTo: n => `die Schleifen liefen auf bis zu ${n} Kernen`, onOne: 'die Schleifen liefen auf einem Kern',
    points: (w, h) => `${w} × ${h} Punkte`,
  },
};
function storedLang() {
  try { return localStorage.getItem('scaly-playground:lang'); } catch { return null; }
}
function chooseLang() {
  const asked = new URLSearchParams(location.search).get('lang') ?? storedLang();
  if (LANGS.includes(asked)) return asked;
  for (const tag of navigator.languages ?? [navigator.language ?? 'en']) {
    const primary = String(tag).toLowerCase().split('-')[0];
    if (LANGS.includes(primary)) return primary;
  }
  return 'en';
}
let lang = chooseLang();
const t = key => TEXT[lang][key];
function translatePage() {
  document.documentElement.lang = lang;
  $('lang').value = lang;
  $('lang').setAttribute('aria-label', t('language'));
  for (const e of document.querySelectorAll('[data-t]')) e.textContent = t(e.dataset.t);
  for (const e of document.querySelectorAll('[data-t-label]')) e.setAttribute('aria-label', t(e.dataset.tLabel));
  runButton.textContent = worker ? t('stop') : t('run');
}
const editor = $('editor'), output = $('output'), runButton = $('run');
let steps = [], at = 0, compiler = null, worker = null;
// a step whose program may run on the graphics card (its listing is marked
// role="gpu"): per step the runs so far, each with where its loops went
const runs = new Map();

function status(text, kind = '') {
  $('status').textContent = text;
  $('status').className = kind;
}

function append(text, cls = '') {
  if (text === '') return;
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = text;
  output.appendChild(span);
  output.scrollTop = output.scrollHeight;
}

// a step's program as the reader left it, kept in this browser where it allows
// (in German under a key of its own: its programs say other things)
const key = i => `scaly-tour${lang === 'en' ? '' : '-' + lang}:${steps[i].section}:${steps[i].ordinal}`;
function edited(i) {
  try { return localStorage.getItem(key(i)); } catch { return null; }
}
function keep(i, text) {
  try {
    if (text === steps[i].program) localStorage.removeItem(key(i));
    else localStorage.setItem(key(i), text);
  } catch {}
}

function show(i, push = true) {
  stop();
  at = Math.max(0, Math.min(i, steps.length - 1));
  const step = steps[at];
  $('title').textContent = step.title;
  $('chapter').textContent = step.chapter;
  $('prose').innerHTML = step.prose;
  $('count').textContent = `${at + 1} / ${steps.length}`;
  $('back').disabled = $('prev').disabled = at === 0;
  $('fwd').disabled = at === steps.length - 1;
  $('next').textContent = at === steps.length - 1 ? t('toRepl') : t('next');
  $('toc').value = String(at);
  $('main').classList.toggle('prose-only', step.program === null);
  editor.value = step.program === null ? '' : (edited(at) ?? step.program);
  output.textContent = '';
  $('pictures').textContent = '';
  showDrawings([]);
  $('where').hidden = !step.gpu;
  document.querySelector('.work').classList.toggle('card', step.gpu);
  showRuns();
  if (location.hash !== `#${at + 1}`) {
    if (push) history.pushState(null, '', `#${at + 1}`);
    else history.replaceState(null, '', `#${at + 1}`);
  }
  document.querySelector('.lesson').scrollTop = 0;
}

function stop() {
  worker?.terminate();
  worker = null;
  runButton.textContent = t('run');
  if (compiler) status(t('ready'), 'ok');
}

// A picture the program wrote (a file `<name>.<width>x<height>.rgba`, which
// the worker hands back): onto a canvas, as it is.
let lastPictures = [];
function showPictures(pictures) {
  lastPictures = pictures ?? [];
  const box = $('pictures');
  box.textContent = '';
  for (const p of pictures ?? []) {
    const figure = document.createElement('figure');
    const canvas = document.createElement('canvas');
    canvas.width = p.width;
    canvas.height = p.height;
    canvas.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(p.bytes.buffer), p.width, p.height), 0, 0);
    const caption = document.createElement('figcaption');
    caption.textContent = `${p.name} — ${t('points')(p.width, p.height)}`;
    figure.append(canvas, caption);
    box.appendChild(figure);
  }
}

// The drawings the program showed (scaly/draw.scaly: drawing-<n>.svg), each
// as an image -- an SVG in an image runs no script.
const drawingUrls = [];
function showDrawings(drawings) {
  for (const url of drawingUrls.splice(0)) URL.revokeObjectURL(url);
  const box = $('drawings');
  box.textContent = '';
  for (const d of drawings ?? []) {
    const url = URL.createObjectURL(new Blob([d.text], { type: 'image/svg+xml' }));
    drawingUrls.push(url);
    const img = document.createElement('img');
    img.src = url;
    img.alt = d.name;
    box.appendChild(img);
  }
  // a drawing takes room: the results get the share a card's step has
  document.querySelector('.work').classList.toggle('card', (drawings ?? []).length > 0 || (steps[at]?.gpu ?? false));
}

// The runs of this step, one bar each, as long as the program ran: the same
// program on the processor and on the card, side by side.
function showRuns() {
  const box = $('runs');
  box.textContent = '';
  const list = runs.get(at) ?? [];
  const longest = Math.max(1, ...list.map(r => r.ran));
  for (const r of list) {
    const label = document.createElement('span');
    label.textContent = r.where;
    const bar = document.createElement('span');
    bar.className = r.cards > 0 ? 'bar card' : 'bar';
    bar.style.width = `${Math.max(1, 100 * r.ran / longest)}%`;
    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = `${r.ran < 10 ? r.ran.toFixed(1) : Math.round(r.ran)} ms`;
    const what = document.createElement('span');
    what.className = 'what';
    what.textContent = r.what;
    box.append(label, bar, time, what);
  }
}

// the program in a worker of its own: `scaly run main.scaly`, the compiler
// and the program in one memory (worker.mjs, side.mjs); no standard input.
// A step for the card runs with --gpu, over the page's card as the reader
// chose: on the processor, on the card, or where it pays.
// --- a step for the cores and the card -------------------------------------
// Such a step's program is BUILT here for wasm32-wasip1-threads with --gpu
// (worker.mjs running `scaly build`, over playground.json: the standard
// library compiled for it), then run by runner.mjs on as many cores as the
// reader chose, the page the coordinator of its threads (threads.mjs), the
// card beside them. `scaly run` in the page has one core: its program lives
// in the compiler's own memory.
const cpus = navigator.hardwareConcurrency || 1;
let runner = null, runnerCard = false, building = null, threadsLib = null;

async function prepareCores() {
  if (!building) building = (async () => {
    status(t('preparing'));
    const listing = await (await fetch('playground.json')).json();
    for (const [path, b64] of Object.entries(listing))
      compiler.files[path] = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    threadsLib = await import('./threads.mjs');
    runner = new Worker('runner.mjs', { type: 'module' });
    runnerCard = await new Promise(resolve => {
      runner.onmessage = ({ data }) => { if (data.type === 'ready') resolve(data.card); };
      runner.postMessage({ type: 'hello' });
    });
  })();
  return building;
}

function buildForCores(text) {
  return new Promise(resolve => {
    const w = new Worker('worker.mjs', { type: 'module' });
    worker = w;
    const said = [], decoder = new TextDecoder();
    w.onmessage = ({ data }) => {
      if (data.type === 'out' || data.type === 'err') said.push(decoder.decode(data.bytes));
      else if (data.type === 'exit' || data.type === 'crash') {
        w.terminate();
        resolve({ status: data.type === 'exit' ? data.status : 'crash', bytes: data.collected?.['/work/main.wasm'] ?? null,
                  said: said.join('') + (data.text ?? '') });
      }
    };
    w.onerror = e => { w.terminate(); resolve({ status: 'crash', bytes: null, said: e.message }); };
    w.postMessage({ module: compiler.module, files: { ...compiler.files, '/work/main.scaly': text },
                    args: ['scaly', 'build', '--target', 'wasm32-wasip1-threads', '--gpu', 'main.scaly', '-o', 'main.wasm'],
                    env: { SCALY_CACHE: '/cache' }, collect: ['/work/main.wasm'] });
  });
}

async function runOnCores() {
  const choice = $('where').value, step = at;
  const workers = choice === 'one' ? 1 : cpus;
  const gpu = choice === 'card' ? 'on' : choice === 'auto' ? 'auto' : 'off';
  output.textContent = '';
  $('pictures').textContent = '';
  showDrawings([]);
  runButton.textContent = t('stop');
  try {
    await prepareCores();
    status(t('building'));
    const t0 = performance.now();
    const built = await buildForCores(editor.value);
    worker = null;
    if (built.status !== 0 || !built.bytes) {
      append(built.said || t('compilerEnded')(built.status), 'err');
      status(t('notBuilt'), 'bad');
      return;
    }
    const compiled = performance.now() - t0;
    await new Promise(resolve => {
      runner.onmessage = ({ data }) => { if (data.type === 'loaded') resolve(); };
      runner.postMessage({ type: 'load', bytes: built.bytes }, [built.bytes.buffer]);
    });
    status(t('running'));
    const env = { SCALY_CPUS: String(cpus), SCALY_WORKERS: String(workers) };
    let resolve;
    const done = new Promise(r => { resolve = r; });
    const threads = await threadsLib.Threads.create({
      out: b => append(new TextDecoder().decode(b)), err: b => append(new TextDecoder().decode(b), 'err'),
      exit: s => resolve({ status: String(s), stdout: '', stderr: '', ms: 0, pictures: [], drawings: [], cards: 0 }),
      env,
    });
    runner.onmessage = ({ data }) => { if (threads.handle(data)) return; if (data.type === 'done') resolve(data); };
    runner.postMessage({ type: 'run', args: [], env, gpu });
    const r = await done;
    threads.end();
    append(r.stdout);
    if (r.stderr) append(r.stderr, 'err');
    showPictures(r.pictures);
    showDrawings(r.drawings);
    if (r.status !== '0') { status(t('ended')(r.status), 'bad'); return; }
    const where = choice === 'one' ? t('oneCore') : choice === 'all' ? t('cores')(cpus)
      : choice === 'card' ? (runnerCard ? t('theCard') : t('noCard')) : t('auto');
    let what = t('builtIn')(Math.round(compiled));
    if ((choice === 'card' || choice === 'auto') && !runnerCard) what += t('noCardGiven');
    else if (r.cards > 0) what += t('cardRan')(r.cards);
    else what += workers > 1 ? t('upTo')(workers) : t('onOne');
    const list = runs.get(step) ?? [];
    list.push({ where, cards: r.cards, ran: r.ms, what });
    runs.set(step, list.slice(-6));
    showRuns();
    status(t('done')(Math.round(r.ms)), 'ok');
  } finally {
    worker = null;
    runButton.textContent = t('run');
  }
}

function run() {
  if (!compiler) return;
  if (worker) { stop(); append(t('stopped'), 'note'); return; }
  if (steps[at].gpu) { runOnCores(); return; }
  output.textContent = '';
  const stdin = new SharedArrayBuffer(16);
  const state = new Int32Array(stdin, 0, 2);
  const decoders = { out: new TextDecoder(), err: new TextDecoder() };
  const t0 = performance.now();
  $('pictures').textContent = '';
  showDrawings([]);
  const files = { ...compiler.files, '/work/main.scaly': editor.value };
  worker = new Worker('worker.mjs', { type: 'module' });
  runButton.textContent = t('stop');
  status(t('compilingRunning'));
  worker.onmessage = ({ data }) => {
    switch (data.type) {
      case 'out':
      case 'err':
        append(decoders[data.type].decode(data.bytes, { stream: true }), data.type === 'err' ? 'err' : '');
        break;
      case 'wants':
        Atomics.store(state, 0, 2);
        Atomics.notify(state, 0);
        break;
      case 'exit': {
        const ms = Math.round(performance.now() - t0);
        showPictures(data.pictures);
        showDrawings(data.drawings);
        stop();
        if (data.status !== 0) append(t('endedNote')(data.status), 'note');
        status(t('done')(ms), data.status === 0 ? 'ok' : 'bad');
        break;
      }
      case 'crash':
        stop();
        append(t('stoppedBy')(data.text), 'err');
        status(t('runFailed'), 'bad');
        break;
    }
  };
  worker.onerror = e => {
    stop();
    append(t('workerFailed')(e.message), 'err');
  };
  worker.postMessage({ module: compiler.module, files, stdin, args: ['scaly', 'run', 'main.scaly'] });
}

runButton.onclick = run;
$('reset').onclick = () => {
  const step = steps[at];
  if (step.program === null) return;
  editor.value = step.program;
  keep(at, step.program);
  output.textContent = '';
};
$('back').onclick = $('prev').onclick = () => show(at - 1);
$('fwd').onclick = () => show(at + 1);
$('next').onclick = () => { if (at === steps.length - 1) location.href = 'index.html'; else show(at + 1); };
$('toc').onchange = () => show(Number($('toc').value));
editor.oninput = () => keep(at, editor.value);
editor.onkeydown = e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    run();
  } else if (e.key === 'Tab' && !e.shiftKey) {
    e.preventDefault();
    editor.setRangeText('    ', editor.selectionStart, editor.selectionEnd, 'end');
    keep(at, editor.value);
  }
};
addEventListener('hashchange', () => {
  const n = Number(location.hash.slice(1));
  if (n >= 1 && n - 1 !== at) show(n - 1, false);
});

// the steps, set by the DSSSL engine: the book's tour first, as the
// tutorial has it (tour-steps.htm, docs/dsssl/scaly-tour.dsl), then the
// playground's own chapters (playground-steps.htm, docs/scaly-playground.xml);
// in German all of them from one file, the tour translated
// (playground-steps.de.htm, docs/scaly-playground.de.xml)
async function loadSteps() {
  const seen = {};
  steps = [];
  $('toc').textContent = '';
  const files = lang === 'en' ? [['tour-steps.htm', 'A Tour of Scaly'], ['playground-steps.htm', null]]
                              : [[`playground-steps.${lang}.htm`, null]];
  for (const [file, chapter] of files) {
    const response = await fetch(file);
    if (!response.ok) continue;
    const doc = new DOMParser().parseFromString(await response.text(), 'text/html');
    for (const s of doc.querySelectorAll('section.step')) {
      const section = s.dataset.section;
      seen[section] = (seen[section] ?? 0) + 1;
      const program = s.querySelector('pre.program');
      steps.push({
        section, ordinal: seen[section],
        chapter: chapter ?? s.dataset.chapter ?? '',
        // the book's tour, in English or translated: not the playground's own
        tour: chapter !== null || s.dataset.chapterId === 'pg-tour',
        chapterId: chapter !== null ? 'pg-tour' : s.dataset.chapterId ?? '',
        title: s.querySelector('h2').textContent,
        prose: s.querySelector('.prose').innerHTML,
        program: program ? program.textContent : null,
        gpu: program ? program.classList.contains('gpu') : false,
      });
    }
  }
  let group = null;
  steps.forEach((s, i) => {
    if (!group || group.label !== s.chapter) {
      group = document.createElement('optgroup');
      group.label = s.chapter;
      $('toc').appendChild(group);
    }
    const option = document.createElement('option');
    option.value = String(i);
    option.textContent = `${i + 1}. ${s.title}`;
    group.appendChild(option);
  });
  const n = Number(location.hash.slice(1));
  show(n >= 1 ? n - 1 : 0, false);
}

translatePage();
$('lang').onchange = async () => {
  lang = $('lang').value;
  try { localStorage.setItem('scaly-playground:lang', lang); } catch {}
  const url = new URL(location.href);
  if (url.searchParams.has('lang')) { url.searchParams.set('lang', lang); history.replaceState(null, '', url); }
  translatePage();
  runs.clear();
  await loadSteps();
};
await loadSteps();
try {
  compiler = await loadCompiler(text => status(text));
  runButton.disabled = false;
  status(t('ready'), 'ok');
} catch (e) {
  status(t('compilerFailed')(e.message), 'bad');
}

// ?selftest (tests/gpu/web/run.sh): every step of the playground's own
// chapters run once -- a step for the cores on one core and on all of them,
// whose pictures must agree --, and what each showed posted to /result
if (new URLSearchParams(location.search).has('selftest') && compiler) {
  const report = [];
  const idle = async () => { while (worker !== null || /…$/.test($('status').textContent)) await new Promise(r => setTimeout(r, 50)); };
  for (let i = 0; i < steps.length; i++) {
    if (steps[i].tour || steps[i].program === null) continue;
    show(i, false);
    const modes = steps[i].gpu ? ['one', 'all'] : [null];
    const seen = [];
    for (const mode of modes) {
      if (mode) $('where').value = mode;
      if (steps[i].gpu) await runOnCores(); else { run(); await idle(); }
      seen.push({ mode, status: $('status').textContent, ok: $('status').className === 'ok',
                  output: output.textContent.trim().slice(0, 200), drawings: $('drawings').children.length,
                  pictures: lastPictures.map(p => ({ name: p.name, width: p.width, height: p.height, bytes: Array.from(p.bytes.slice(0, 0)).length, hash: Array.from(p.bytes).reduce((h, b) => Math.imul(h ^ b, 16777619) >>> 0, 2166136261) })) });
    }
    report.push({ title: steps[i].title, chapter: steps[i].chapterId, gpu: steps[i].gpu, runs: seen });
  }
  await fetch('/result', { method: 'POST', body: JSON.stringify({ lang, steps: steps.length, report }) });
}
</script>
</body>
