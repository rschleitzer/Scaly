# gateway-64: nginx (TLS, HTTP/2, /static from disk) in front of the Scaly
# server, which answers /baseline2, /json and /async-db over HTTP/1.1.

services:
  proxy:
    build: ./proxy
    network_mode: host
    cpuset: "${PROXY_CPUSET:-0-19,64-83}"
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    security_opt:
      - seccomp:unconfined
    volumes:
      - ${CERTS_DIR}:/certs:ro
      - ${DATA_DIR}/static:/data/static:ro
    depends_on:
      - server

  # The Scaly entry's server, built from its directory (without build.sh's
  # profile: a plain build is --release alone, its code generated for the
  # CPU of the machine that builds it), started with the first port only --
  # the edge holds 8443.
  server:
    build: ../scaly
    command: ["/arena", "8080", "0", "0", "0"]
    network_mode: host
    cpuset: "${SERVER_CPUSET:-20-31,84-95}"
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    security_opt:
      - seccomp:unconfined
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_MAX_CONN=256
    volumes:
      - ${DATA_DIR}/dataset.json:/data/dataset.json:ro
