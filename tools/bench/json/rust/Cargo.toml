# The Rust side of tools/bench/json/run.sh: the same files, the same method as
# bench.scaly, for serde_json (the realistic bar), simd-json and sonic-rs
# (the SIMD ceiling).
[package]
name = "jsonbench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde_json = "1.0.151"
simd-json = "0.18.1"
sonic-rs = "0.5.10"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
