name: bench-json

# The json package against serde_json, simd-json, sonic-rs, simdjson and
# yyjson on an x86_64 runner (tools/bench/json/run.sh; ROADMAP-http.md stage
# B). The dev box is an arm64 Mac, where x86 can only be checked for
# CORRECTNESS (tests/target/rosetta.sh); what the SIMD target forms of phase 6
# are WORTH on x86 -- pshufb, AVX2's vpshufb and vpmovmskb -- only a real x86
# CPU can say. GitHub's x86 runners are AMD EPYC or Intel Xeon with AVX2; the
# job prints which one it got, since the numbers are only comparable within
# one run.
#
# Manual only, like seed.yml: `gh workflow run bench-json`.
on:
  workflow_dispatch:

jobs:
  bench:
    name: x86_64-linux-gnu
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/llvm20

      - name: The CPU
        run: |
          lscpu | grep 'Model name'
          echo "SIMD: $(grep -o -w -E 'ssse3|avx2|avx512bw' /proc/cpuinfo | sort -u | tr '\n' ' ')"

      - name: The compiler, from the seed
        run: tools/build-from-seed.sh

      - name: simdjson and yyjson
        run: |
          sudo apt-get install -y libsimdjson-dev libyyjson-dev || echo "not packaged -- run.sh skips them by name"

      - name: Benchmark
        env:
          CXX: clang++-20
        run: tools/bench/json/run.sh
