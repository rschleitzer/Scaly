name: bench-json

# The json package against serde_json, simd-json, sonic-rs, simdjson and
# yyjson on an x86_64 runner (tools/bench/json/run.sh; ROADMAP-http.md stage
# B). The dev box is an arm64 Mac, where x86 can only be checked for
# CORRECTNESS (tests/target/rosetta.sh); what the SIMD target forms of phase 6
# are WORTH on x86 -- pshufb, AVX2's vpshufb and vpmovmskb -- only a real x86
# CPU can say. GitHub's x86 runners are AMD EPYC or Intel Xeon with AVX2; the
# job prints which one it got, since the numbers are only comparable within
# one run.
#
# Manual only, like release.yml: `gh workflow run bench-json`.
on:
  workflow_dispatch:

jobs:
  bench:
    name: x86_64-linux-gnu
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/llvm21

      - name: The CPU
        run: |
          lscpu | grep 'Model name'
          echo "SIMD: $(grep -o -w -E 'ssse3|avx2|avx512bw' /proc/cpuinfo | sort -u | tr '\n' ' ')"

      - name: The compiler, from the seed
        run: tools/build-from-seed.sh

      # simdjson from the distribution; yyjson is not packaged for this
      # Ubuntu, so its one source file is built for the host CPU
      - name: simdjson and yyjson
        run: |
          sudo apt-get install -y libsimdjson-dev
          curl -sSfL https://github.com/ibireme/yyjson/archive/refs/tags/0.10.0.tar.gz | tar xz -C "$RUNNER_TEMP"
          clang-21 -O3 -march=native -c "$RUNNER_TEMP/yyjson-0.10.0/src/yyjson.c" -o "$RUNNER_TEMP/yyjson.o"
          ar rcs "$RUNNER_TEMP/libyyjson.a" "$RUNNER_TEMP/yyjson.o"
          echo "CPATH=$RUNNER_TEMP/yyjson-0.10.0/src" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$RUNNER_TEMP" >> "$GITHUB_ENV"

      # g++: Ubuntu's simdjson.h does not compile with clang++-20 (its
      # formatter names members only GCC's lookup finds)
      - name: Benchmark
        env:
          CXX: g++
          STAGES: 1
          JSONBENCH_KEEP: ${{ runner.temp }}/keep
        run: tools/bench/json/run.sh

      # Where the json package's time goes on this CPU: page faults and
      # peak memory per stage (GNU time), then cycles, instructions and a
      # sampled profile (perf, where the runner allows it).
      - name: Profile
        continue-on-error: true
        run: |
          K="$RUNNER_TEMP/keep"; D=/tmp/scaly-jsonbench
          sudo apt-get install -y time linux-tools-common "linux-tools-$(uname -r)" > /dev/null 2>&1 || true
          for f in citm_catalog twitter; do
            for m in copy classify tokens parse; do
              echo "== $f $m"
              /usr/bin/time -v "$K/stages" "$D/$f.json" 20 $m 2>&1 | grep -E "MB/s|Minor|Maximum resident"
            done
          done
          sudo sysctl -w kernel.perf_event_paranoid=1 > /dev/null 2>&1 || true
          if command -v perf > /dev/null 2>&1; then
            perf stat -e task-clock,page-faults,cycles,instructions "$K/stages" "$D/twitter.json" 20 classify 2>&1 | tail -12
            perf stat -e task-clock,page-faults,cycles,instructions "$K/stages" "$D/twitter.json" 20 parse 2>&1 | tail -12
            perf record -F 4000 -o "$RUNNER_TEMP/p.data" "$K/stages" "$D/twitter.json" 60 parse > /dev/null 2>&1
            perf report -i "$RUNNER_TEMP/p.data" --stdio --no-children --sort symbol 2>/dev/null | grep -v '^#' | grep -v '^$' | head -30
          else
            echo "no perf on this runner"
          fi
