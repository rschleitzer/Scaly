name: bench-http

# The Scaly entry for HttpArena against the board's leaders on an x86_64
# runner (ROADMAP-http.md): HttpArena's own benchmark-lite.sh, every
# framework in Docker, the load generators too. The dev box is an arm64 Mac,
# where the harness runs under Docker Desktop and zrk -- the load generator
# of 8gbit -- does not run at all (x86-only). GitHub's runners are 4 shared
# vCPUs: the numbers compare the frameworks WITHIN one run, they are not the
# board's. HttpArena is pinned to the commit the entry was validated
# against; the entries are built from it as the board builds them, the
# Scaly image by tools/bench/httparena/build.sh (profile-guided, for the
# runner's CPU).
#
# Manual only, like seed.yml: `gh workflow run bench-http`
# (`-f frameworks="scaly tokio"` to run others). By default Scaly's own
# pool, the frameworks (flagship, emerging and experimental, scored
# together), by where they stand on the board at the pinned commit: swerver
# (first of them in baseline, static-h2, static-h3 and unary-grpc),
# genhttp-ioxide (first in baseline-h2), bun (first in baseline-h3), actix
# (one framework covering json-comp, async-db and h2 at once). The upper
# bound, from the other pools, on request -- ten entries with the extra
# profiles outrun the job's three hours (2026-09-30): the engines zix
# (first in baseline, pipelined, json-comp, async-db), tokio (pipelined,
# limited-conn), cardigan (unary-grpc, baseline-h2) and tokio-ws (echo-ws),
# and the infrastructure entry nginx (baseline-h3, static-h3).
on:
  workflow_dispatch:
    inputs:
      frameworks:
        description: frameworks to run, space-separated
        default: scaly swerver genhttp-ioxide bun actix

env:
  HTTPARENA_COMMIT: 484dea6

jobs:
  bench:
    name: x86_64-linux-gnu
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: The CPU
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)'
          free -g | head -2

      - name: HttpArena
        run: |
          git clone --filter=blob:none https://github.com/MDA2AV/HttpArena.git "$RUNNER_TEMP/ha"
          git -C "$RUNNER_TEMP/ha" checkout -q "$HTTPARENA_COMMIT"
          echo "HA=$RUNNER_TEMP/ha" >> "$GITHUB_ENV"

      # The scored profiles benchmark-lite.sh leaves out (ROADMAP-http.md,
      # "The rest of the scored profiles"), in lite's style: no pinning, one
      # connection count, async at 4096 connections instead of 32 000. The
      # latency profiles stay out: their pinned 1M req/s is beyond a runner.
      - name: Lite extras
        run: |
          python3 - "$HA/scripts/benchmark-lite.sh" <<'EOF'
          import sys
          path = sys.argv[1]
          s = open(path).read()
          extra = [
              ("json-tls", "1|0||512|json-tls"),
              ("static-tls", "1|200||512|static-tls"),
              ("async", "1|0||4096|async"),
              ("baseline-h2c", "1|0||512|h2c"),
              ("json-h2c", "1|0||512|json-h2c"),
              ("echo-ws-pipeline", "16|0||512|ws-echo"),
              ("echo-ws-limited", "1|10||512|ws-echo"),
          ]
          profiles = '    [echo-ws]="1|0||512|ws-echo"\n'
          order = "    echo-ws\n)"
          assert s.count(profiles) == 1 and s.count(order) == 1, "benchmark-lite.sh changed shape"
          s = s.replace(profiles, profiles + "".join('    [%s]="%s"\n' % e for e in extra))
          s = s.replace(order, "    echo-ws\n    " + " ".join(n for n, _ in extra) + "\n)")
          open(path, "w").write(s)
          EOF
          sed -n '/^PROFILE_ORDER=(/,/^)/p' "$HA/scripts/benchmark-lite.sh"

      # The entry's directory: meta.json and a build.sh that builds the
      # image from this checkout. benchmark-lite.sh refuses a meta.json that
      # subscribes to a profile outside its subset, so every framework's
      # list is cut to that subset here.
      - name: Framework entries
        run: |
          mkdir -p "$HA/frameworks/scaly"
          cp tools/bench/httparena/meta.json "$HA/frameworks/scaly/meta.json"
          printf '#!/bin/bash\nHTTPARENA_DATA=%s/data exec %s/tools/bench/httparena/build.sh\n' "$HA" "$GITHUB_WORKSPACE" > "$HA/frameworks/scaly/build.sh"
          chmod +x "$HA/frameworks/scaly/build.sh"
          lite=$(sed -n '/^PROFILE_ORDER=(/,/^)/p' "$HA/scripts/benchmark-lite.sh" | tr -d '()' | sed 's/PROFILE_ORDER=//' | tr -s ' \n' ' ')
          echo "lite profiles: $lite"
          for fw in ${{ inputs.frameworks }}; do
            python3 - "$HA/frameworks/$fw/meta.json" $lite <<'EOF'
          import json, sys
          path, known = sys.argv[1], set(sys.argv[2:])
          m = json.load(open(path))
          m["tests"] = [t for t in m["tests"] if t in known]
          json.dump(m, open(path, "w"), indent=2)
          print(path, m["tests"])
          EOF
          done

      # benchmark-lite builds gcannon, h2load, h2load-h3 and wrk itself;
      # zrk (8gbit) it only names
      - name: zrk
        run: docker build -q -t zrk:local -f "$HA/docker/zrk.Dockerfile" "$HA/docker"

      - name: Benchmark
        run: |
          cd "$HA"
          for fw in ${{ inputs.frameworks }}; do
            echo "::group::$fw"
            bash scripts/benchmark-lite.sh "$fw" 2>&1 | tee "$RUNNER_TEMP/lite_$fw.log" | grep -E '^=== |\[FAIL\]|\[warn\]'
            echo "::endgroup::"
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "| framework | profile | best |"
            echo "|---|---|---|"
            for f in "$RUNNER_TEMP"/lite_*.log; do
              [ -f "$f" ] || continue
              awk '/^=== [^ ]+ \/ [^ ]+ \/ / { fw = $2; p = $4 }
                   /^=== Best:/ { sub(/^=== Best: /, ""); sub(/ ===$/, ""); print "| " fw " | " p " | " $0 " |" }' "$f"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-http-logs
          path: ${{ runner.temp }}/lite_*.log
