name: verify-seed

# Rebuild the committed seed (seed/) into a working scalyc with no C++ toolchain,
# then verify it natively on each of the four LP64 little-endian targets:
# hello + AOT corpus (self-checked vs each test's ; Expected:). This functional
# gate proves the single seed builds a CORRECT compiler per target. The heavier
# byte-identical fixed-point re-emit (scalyc.ll peaks at ~15 GB, over free-runner
# limits) is a release-time check on a high-RAM machine — VERIFY_FIXEDPOINT=1
# tools/verify-seed.sh. See RELEASING.md / seed/README.md.

on:
  push:
    branches: [ master ]
    paths:
      - 'seed/**'
      - 'packages/**'
      - 'tests/aot/**'
      - 'tools/build-from-seed.sh'
      - 'tools/verify-seed.sh'
      - 'tools/llvm-env.sh'
      - '.github/workflows/verify-seed.yml'
  pull_request:
    paths:
      - 'seed/**'
      - 'packages/**'
      - 'tests/aot/**'
      - 'tools/build-from-seed.sh'
      - 'tools/verify-seed.sh'
      - 'tools/llvm-env.sh'
      - '.github/workflows/verify-seed.yml'
  workflow_dispatch:

concurrency:
  group: verify-seed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.triple }}
    runs-on: ${{ matrix.os }}
    # x86_64-apple-darwin is allowed to fail: GitHub is retiring Intel macOS
    # runners (macos-13), so that leg often never schedules. It is the same
    # Mach-O/LP64 family as the arm64-apple-darwin leg, which is a hard gate.
    continue-on-error: ${{ matrix.allow_failure || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,         triple: arm64-apple-darwin }   # Apple Silicon
          - { os: macos-13,         triple: x86_64-apple-darwin, allow_failure: true }  # Intel (often unavailable)
          - { os: ubuntu-24.04,     triple: x86_64-linux-gnu }
          - { os: ubuntu-24.04-arm, triple: aarch64-linux-gnu }    # GitHub-hosted arm64 Linux
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18 (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm@18

      - name: Install LLVM 18 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev clang-18 lld-18

      - name: Build scalyc from the seed (no C++)
        env:
          # Ubuntu ships clang as clang-18; macOS uses the system clang for linking.
          CLANG: ${{ runner.os == 'Linux' && 'clang-18' || 'clang' }}
        run: tools/build-from-seed.sh

      - name: Verify (hello + AOT corpus)
        run: tools/verify-seed.sh

# NOTE: macos-13 is GitHub's last Intel macOS image and is being retired, so the
# x86_64-apple-darwin leg often never schedules. It is marked allow_failure (see
# continue-on-error above) so it never blocks the workflow. To make it a hard
# gate again, attach a self-hosted Intel-mac runner and drop its allow_failure.
