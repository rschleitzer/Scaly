name: seed

# Mint + fixed-point-verify the seed on x86_64-linux-gnu.
#
# ONE runner on purpose (2026-08-04). The committed seed .ll is target-neutral
# (no triple/datalayout, LP64 sizes baked in), so one seed serves all four
# "fabulous four" LP64 targets — but the toolchain is host-only for LINKING +
# RUNNING, so a target is only natively verified by a runner of that target.
# This repo is private, where GitHub bills macOS minutes at 10x the Linux rate
# and every push ran three legs; that bill, not a technical limit, is why the
# matrix is gone. x86_64-linux is the cheapest leg and the one whose codegen
# most needs a native check (the dev box is arm64-apple-darwin, so Linux/x86_64
# is what nobody exercises locally).
#
# What the other three targets still get: OBJECT emission for all four is
# checked by tests/target/run.sh (--target cross-emit) in this leg, and
# arm64-apple-darwin is covered by the full local bar on the dev box before
# every push. To verify another target natively, run `tools/seed.sh` on a host
# of that target, or add a leg back here.
#
# tools/seed.sh auto-bootstraps stage-2 from the committed seed (no C++, no
# cmake, no openjade — LLVM 18 + clang only), emits the seed, links it clean,
# runs hello + the AOT corpus, checks byte-identical self-reproduction, and
# builds + smoke-tests the scalyls language server.

# editors/** is the VS Code extension (TypeScript + npm deps): nothing the seed
# pipeline compiles, links or runs. Skipping it keeps Dependabot's npm bumps —
# the bulk of this repo's PR traffic — from spending minutes on a full bootstrap.
on:
  push:
    branches: [master]
    paths-ignore: ['editors/**']
  pull_request:
    branches: [master]
    paths-ignore: ['editors/**']
  workflow_dispatch:

jobs:
  seed:
    name: x86_64-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev clang-18 lld-18 python3
          # seed.sh links with $CLANG; Ubuntu ships clang-18, not a bare `clang`.
          echo "CLANG=clang-18" >> "$GITHUB_ENV"
          # libLLVM-18.so lives under the versioned prefix; put it on the loader
          # path so the freshly-linked scalyc_seed can start.
          echo "LD_LIBRARY_PATH=$(llvm-config-18 --libdir)" >> "$GITHUB_ENV"
          # Make lld the default linker: stock GNU BFD ld fails to link
          # libLLVM-18 ("failed to set dynamic section sizes"), and the
          # compiler's own -o bootstrap link (cli.run) invokes plain `clang`
          # (default ld) — so `ld` itself must be lld, not just seed.sh's links.
          sudo update-alternatives --install /usr/bin/ld ld \
            "$(command -v ld.lld-18 || command -v ld.lld)" 100

      - name: Build + verify seed (bootstrap, link, hello, AOT, fixed point)
        run: tools/seed.sh

      - name: Cross-emit sanity (--target all four object formats)
        run: tests/target/run.sh dist/seed/scalyc_seed

      # OpenSP port REALPASS gate (dazzle epic, Part I). AOT-compiles the opensp
      # package into an archive and links + runs its unit harness so
      # opensp.test() genuinely executes (the old --jit route false-passed).
      # Builds /tmp/libscaly.a itself if absent.
      - name: OpenSP unit suite (dazzle port REALPASS)
        run: tests/opensp/run.sh dist/seed/scalyc_seed

      - name: Fiber suite (context-switch ping-pong, milestone 1.1)
        run: tests/fiber/run.sh dist/seed/scalyc_seed

      - name: The 10k demo (fiber-per-connection HTTP, milestone 1.6)
        run: tests/fiber/bench/run.sh dist/seed/scalyc_seed

      # tools/seed.sh above links scalyls from FRESHLY emitted IR; this is the
      # only place the COMMITTED seed/scalyls*.ll get linked and served — and
      # it keeps verify-seed.sh itself from silently going stale (its scalyls
      # link recipe once drifted for months because nothing executed it).
      - name: Verify committed seed (hello, AOT, regress, scalyls link+smoke)
        run: tools/verify-seed.sh dist/seed/scalyc_seed

      - name: Upload native compiler
        uses: actions/upload-artifact@v4
        with:
          name: scalyc-x86_64-linux-gnu
          path: dist/seed/scalyc_seed
          if-no-files-found: error
