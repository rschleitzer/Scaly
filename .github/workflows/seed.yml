name: seed

# Mint + fixed-point-verify the seed on x86_64-linux-gnu, then link + run a
# cross-emitted object on Windows.
#
# ONE BUILDING runner on purpose (2026-08-04). The committed seed .ll is
# target-neutral (no triple; the datalayout is stamped per invocation, LP64
# sizes baked in), so one seed serves all four "fabulous four" LP64 targets —
# but the toolchain is host-only for LINKING + RUNNING, so a target is only
# natively verified by a runner of that target. This repo is private, where
# GitHub bills macOS minutes at 10x the Linux rate and every push ran three
# legs; that bill, not a technical limit, is why the matrix is gone.
# x86_64-linux is the cheapest leg and the one whose codegen most needs a
# native check (the dev box is arm64-apple-darwin, so Linux/x86_64 is what
# nobody exercises locally).
#
# ★ "ONE runner" is no longer literally true (2026-08-09): a second, tiny
# `windows` job was added for stage 7. It does not BUILD anything — it links
# one object this leg emitted and runs it — and Windows bills at 2x, not
# macOS's 10x, so the cost argument above is intact rather than overridden.
# The details are in the job's own comment.
#
# What the other three LP64 targets still get: OBJECT emission for all of them
# is checked by tests/target/run.sh (--target cross-emit) in this leg — which
# since 2026-08-09 also covers the two Windows targets — and arm64-apple-darwin
# is covered by the full local bar on the dev box before every push. To verify
# another target natively, run `tools/seed.sh` on a host of that target, or add
# a leg back here.
#
# tools/seed.sh auto-bootstraps stage-2 from the committed seed (no C++, no
# cmake, no openjade — LLVM 18 + clang only), emits the seed, links it clean,
# runs hello + the AOT corpus, checks byte-identical self-reproduction, and
# builds + smoke-tests the scalyls language server.

# ★ OFF THE PUSH TRIGGER since 2026-08-11 — MANUAL ONLY. Nothing here is
# retired: every job below still runs, and `gh workflow run seed` (or the Run
# workflow button) starts the full bar on demand.
#
# Why: the account's 2000 included Actions minutes ran to 90 % on 11.08. with
# 21 days left, and 85 % of that (1495 of 1759 billed minutes) was burned on
# two days — the Windows-port endgame, where the runner WAS the compiler
# because none of the three Win64 C files can be built on the dev box. That
# phase closed with rung 12 (the seed reproduces itself on Windows), so the
# argument for paying it on every push closed with it. A full push cost ~46
# billed minutes: 6 (seed) + 4 (suites) + 18x2 (windows, billed at 2x).
#
# TO BRING IT BACK, restore exactly this — it is the state that was measured
# above, and the paths-ignore is load-bearing (editors/** is the VS Code
# extension: TypeScript + npm deps, nothing the seed pipeline compiles, links
# or runs, so skipping it keeps Dependabot's npm bumps — the bulk of this
# repo's PR traffic — from spending minutes on a full bootstrap):
#
#   push:
#     branches: [master]
#     paths-ignore: ['editors/**']
#   pull_request:
#     branches: [master]
#     paths-ignore: ['editors/**']
#
# ★ Before restoring it as-is, read the cheaper shapes that were costed on the
# same day and NOT taken, because manual-only made them moot rather than wrong:
# the windows job is 47 % of the bill from a job that builds nothing, and 75 %
# of ITS time is two steps (rung 8 dazzle suites 483 s, rung 7 SGML corpus
# 291 s) against 170 s for link + run + re-emit. Moving those two to a nightly
# cron and keeping rungs 9/11/12 on the push takes a round from 46 to ~16
# billed minutes at unchanged daily coverage. Worth adding whichever way:
# `concurrency` with cancel-in-progress, and a `timeout-minutes` per job — the
# windows leg spiked to 17.9 min once, i.e. 36 billed minutes from one run.
#
# ★ What manual-only costs, stated plainly: x86_64-linux is the leg nobody
# exercises locally (the dev box is arm64-apple-darwin), so a Linux-only
# breakage is now invisible until someone dispatches a run. Reproduce it in a
# container as the header of CLAUDE.md describes, or dispatch before pushing
# anything that touches emission.
on:
  workflow_dispatch:

jobs:
  seed:
    name: x86_64-linux-gnu
    # 26.04: its archive has LLVM 21 (tools/llvm-env.sh); 24.04's stops at 20
    runs-on: ubuntu-26.04
    steps:
      # v5 runs on Node 24; v4 was being force-migrated off the deprecated
      # Node 20 and warned on every run. v6/v7 exist — step up when something
      # needs them, not on principle.
      - uses: actions/checkout@v5

      - uses: ./.github/actions/llvm21

      - name: Build + verify seed (bootstrap, link, hello, AOT, fixed point)
        run: tools/seed.sh

      - name: Cross-emit sanity (--target all six object formats)
        run: tests/target/run.sh dist/seed/scalyc_seed

      # Stage 7 (Windows port), first rung. The suite above proves we EMIT a
      # COFF object for Win64; this hands one to a real Windows runner to prove
      # it LINKS and RUNS. hello.scaly is the one AOT test that pulls nothing
      # from libscaly.a — its only undefined symbol is `puts` (MSVC CRT) — so
      # this rung needs NONE of the four substrate brocken (fcontext-Win64,
      # IOCP, Win32 externs, COFF toolchain). Emitting here rather than on the
      # Windows runner is deliberate: cross-emission needs a compiler linked
      # against libLLVM 21, and that is already installed in this leg, so the
      # Windows job needs no LLVM toolchain of its own.
      - name: Cross-emit the Windows objects
        run: |
          S=dist/seed/scalyc_seed
          # rung 1: pulls nothing from the runtime (only `puts`).
          $S -c --target x86_64-pc-windows-msvc -o hello.o tests/aot/hello.scaly
          # rung 3: the runtime itself, and a program that leans on it. Plain
          # -c, never -c -O2: with no main to anchor them, GlobalDCE deletes
          # every linkonce_odr body and the object comes out empty (CLAUDE.md).
          $S -c --target x86_64-pc-windows-msvc --no-prelude --no-tests \
             -o libscaly_win.o packages/scaly/0.1.0/scaly.scaly
          $S -c --target x86_64-pc-windows-msvc \
             -o page_chain_depth.o tests/aot/page_chain_depth.scaly
          # rung 4: the fiber context switch, which no earlier rung RUNS.
          $S -c --target x86_64-pc-windows-msvc \
             -o pingpong.o tests/fiber/pingpong.scaly
          # rung 6: the 10k demo. It lives in tests/fiber/bench/, OUTSIDE the
          # corpus glob, so rung 5 never emitted it — one long program under
          # load rather than a corpus entry, and it is the only thing in the
          # tree that drives IOCP from the SCHEDULER at scale.
          $S -c --target x86_64-pc-windows-msvc \
             -o http10k.o tests/fiber/bench/http10k.scaly
          # rung 7: the PRODUCT. Everything above is substrate; this is the
          # onsgmls drop-in itself — the opensp package as a library object
          # (--no-prelude, plain -c for the same GlobalDCE reason as the
          # runtime) plus the CLI that links against it.
          $S -c --target x86_64-pc-windows-msvc --no-prelude \
             -o opensp_win.o packages/opensp/0.1.0/opensp.scaly
          $S -c --target x86_64-pc-windows-msvc \
             -o onsgmls_win.o packages/opensp/0.1.0/onsgmls.scaly
          # rung 8: the DSSSL engine on top of it. Same shape — package as a
          # library object, CLI as the program — and the package is the biggest
          # object in the tree.
          $S -c --target x86_64-pc-windows-msvc --no-prelude \
             -o dazzle_win.o packages/dazzle/0.1.0/dazzle.scaly
          $S -c --target x86_64-pc-windows-msvc \
             -o dazzle_cli_win.o packages/dazzle/0.1.0/dazzle_cli.scaly
          # rung 9: the COMPILER. Same two-object shape (package as a library,
          # main as the program) and the same flags tools/seed.sh emits with —
          # --no-tests, and NOT --no-prelude, because main.scaly's print/println
          # come from it. Everything above is something scalyc BUILT; this is
          # scalyc itself, which is what stage 7's exit criterion is about.
          $S -c --target x86_64-pc-windows-msvc --no-tests \
             -o scalyc_win.o packages/scalyc/0.1.0/scalyc.scaly
          $S -c --target x86_64-pc-windows-msvc --no-tests \
             -o scalyc_main_win.o packages/scalyc/0.1.0/main.scaly
          # rung 11: the compiler SEED for this target, as TEXT. Exactly the
          # three roots and exactly the flags tools/seed.sh emits with, only
          # cross-targeted — so the Windows leg can re-emit them with its own
          # binary and compare byte for byte.
          mkdir -p winseed
          for f in main scalyc; do
            $S -S --target x86_64-pc-windows-msvc --no-tests \
               -o winseed/$f.ll packages/scalyc/0.1.0/$f.scaly
          done
          $S -S --target x86_64-pc-windows-msvc --no-tests \
             -o winseed/scaly.ll packages/scaly/0.1.0/scaly.scaly
          ls -l hello.o libscaly_win.o page_chain_depth.o pingpong.o http10k.o \
                opensp_win.o onsgmls_win.o dazzle_win.o dazzle_cli_win.o \
                scalyc_win.o scalyc_main_win.o winseed/*.ll
          # rung 5: breadth. One object per test that carries its own ground
          # truth; the two that need a reference binary are skipped and counted.
          tests/win32/corpus.sh emit "$S" winobj

      - name: Upload the Windows objects
        uses: actions/upload-artifact@v7
        with:
          name: win-objects
          path: |
            hello.o
            libscaly_win.o
            page_chain_depth.o
            pingpong.o
            http10k.o
            opensp_win.o
            onsgmls_win.o
            dazzle_win.o
            dazzle_cli_win.o
            scalyc_win.o
            scalyc_main_win.o
            winseed/*.ll
            winobj/*.o
          if-no-files-found: error

      - name: Upload native compiler
        # v7, not v5: upload-artifact@v5 still declares `using: node20` and kept
        # warning about the Node-20 deprecation (checkout@v5 is already node24).
        # node24 arrives here only with v6; v7 is the current major.
        uses: actions/upload-artifact@v7
        with:
          name: scalyc-x86_64-linux-gnu
          # the compiler and the tool beside it (tools/scaly-of.sh)
          path: |
            dist/seed/scalyc_seed
            dist/seed/scaly_seed
          if-no-files-found: error

  # ★THE SUITES ARE A SEPARATE JOB, and the reason is latency, not tidiness
  # (split 2026-08-10). `needs:` waits for a whole JOB, not for the artifact it
  # consumes — so while the Windows objects were ready and uploaded at ~7:10 of
  # the seed job, the Windows leg went on waiting through `Verify committed
  # seed`, whose output it does not use: 241 s of dead time on every single
  # Windows round. Measured per step before the split (408 s seed, 19 s
  # cross-emit + upload, 22 s suites, 241 s verify).
  #
  # Nothing is skipped or weakened by this: the same four steps run, on the same
  # compiler binary, downloaded as the artifact the seed job already published.
  # They are self-sufficient on a fresh runner — verify-seed.sh works from the
  # COMMITTED seed/ directory in the checkout, and each suite rebuilds
  # /tmp/libscaly.a when it is absent, which it now always is.
  suites:
    name: x86_64-linux-gnu (suites)
    runs-on: ubuntu-26.04
    needs: seed
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/llvm21

      - name: Download the native compiler
        uses: actions/download-artifact@v7
        with:
          name: scalyc-x86_64-linux-gnu
          path: dist/seed
      - name: Make it executable
        # An artifact round-trip does not preserve the mode bit.
        run: chmod +x dist/seed/scalyc_seed dist/seed/scaly_seed

      # OpenSP port REALPASS gate (dazzle epic, Part I). AOT-compiles the opensp
      # package into an archive and links + runs its unit harness so
      # opensp.test() genuinely executes (the old --jit route false-passed).
      # Builds /tmp/libscaly.a itself if absent.
      - name: OpenSP unit suite (dazzle port REALPASS)
        run: tests/opensp/run.sh dist/seed/scalyc_seed

      # Stage 8's safety net, wired up BEFORE ./mkp was switched over to it.
      # This gate regenerates every file the five `mkp` codegen lines produce
      # — the compiler's own parser.scaly and Syntax.scaly, scalyls' grammar,
      # the literate tests, the docs XML, the highlighting table — with OUR
      # engine and asserts each comes back byte-identical to the committed
      # openjade output. Once mkp uses dazzle, this is the only thing standing
      # between a dazzle regression and a silently rewritten compiler front
      # end, so it belongs in CI rather than in a developer's habits: it had
      # been runnable-by-hand only, and nothing ran it.
      # ★It needs no openjade — the goldens ARE openjade's output, committed.
      - name: DSSSL codegen drop-in (the five mkp generators, byte-exact)
        run: tests/dazzle/codegen/run.sh dist/seed/scalyc_seed

      - name: Fiber suite (context-switch ping-pong, milestone 1.1)
        run: tests/fiber/run.sh dist/seed/scalyc_seed

      # The linux poller is an io_uring where the runner's kernel offers one
      # and seccomp allows it, epoll otherwise (ROADMAP-http.md) — this step
      # names the one the suites above ran on, and insists on io_uring.
      - name: Which I/O backend (io_uring expected)
        run: |
          dist/seed/scaly_seed build tests/fiber/io_backend.scaly -o /tmp/io_backend
          SCALY_EXPECT_BACKEND=io_uring /tmp/io_backend

      - name: The 10k demo (fiber-per-connection HTTP, milestone 1.6)
        run: tests/fiber/bench/run.sh dist/seed/scalyc_seed

      # The one tool (ROADMAP-public.md): `scaly build` over the build cache,
      # `--release` (the whole program as one module), `--pgo-train` / `--pgo`
      # (libclang-rt-21-dev in the llvm21 action is for this), `run`, `test`,
      # and the REPL through a pipe and through a pty. Until 2026-10-01 this
      # suite ran on the developer's machine only, while the dazzle CLI,
      # onsgmls, the bench builds and the HttpArena image are built by it.
      - name: The one tool (build, --release, --pgo, run, test, REPL)
        run: tests/tool/run.sh dist/seed/scalyc_seed

      # tools/seed.sh links scalyls from FRESHLY emitted IR; this is the only
      # place the COMMITTED seed/scalyls*.ll get linked and served — and it
      # keeps verify-seed.sh itself from silently going stale (its scalyls link
      # recipe once drifted for months because nothing executed it).
      - name: Verify committed seed (hello, AOT, regress, scalyls link+smoke)
        run: tools/verify-seed.sh dist/seed/scalyc_seed

  # Stage 7, rung 1: link + run the cross-emitted object on real Windows.
  #
  # A SECOND leg is back, and the cost note above is why it is this one and not
  # a macOS leg: for private repos GitHub bills Windows at 2x the Linux rate and
  # macOS at 10x. This job downloads one object, links it and runs it — a couple
  # of minutes, so ~4 billed minutes, against the ~30 a macOS bootstrap would
  # cost. It installs NOTHING: the object is already emitted, and CLAUDE.md's
  # rule is that any clang links an already-emitted object.
  #
  # What rung 1 deliberately does NOT prove: nothing of the runtime substrate
  # (no fibers, no evented I/O, no Win32 externs, no libscaly.a) and nothing
  # about the seed reproducing on Windows. Those are the later rungs; keeping
  # them separate is the same sequencing rule the roadmap applies to the port
  # itself — never debug two unknowns at once.
  #
  # Rung 2a (below, same job): COMPILE the Win64 POSIX-compat shim. It is the
  # cheapest possible feedback on brocken 3 — the whole shim is written on a
  # host that cannot compile a line of it, so "does it build against the real
  # Windows SDK" is the first thing worth knowing and costs seconds. It does
  # not link or run it yet; that needs the rest of the substrate.
  windows:
    name: x86_64-pc-windows-msvc (link + run)
    needs: seed
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download the Windows objects
        uses: actions/download-artifact@v7
        with:
          name: win-objects

      - name: Toolchain
        shell: bash
        run: clang --version

      - name: Link against the MSVC CRT and run
        shell: bash
        run: |
          set -e
          # clang's MSVC toolchain detection locates Visual Studio and the
          # Windows SDK itself, which is why this is a clang driver call rather
          # than a bare lld-link: the CRT search paths come for free.
          clang --target=x86_64-pc-windows-msvc hello.o -o hello.exe
          # `puts` writes CRLF on Windows; strip the CR or the compare fails on
          # an invisible byte. The expected line is read from the test source so
          # the two cannot drift apart.
          ./hello.exe | tr -d '\r' > got.txt
          sed -n 's/^; Expected: //p' tests/aot/hello.scaly > want.txt
          echo "--- want ---"; cat want.txt
          echo "--- got  ---"; cat got.txt
          diff -u want.txt got.txt

      # Rung 2a — brocken 3. -Wall -Wextra -Werror on purpose: this shim is
      # written blind on a POSIX host, so a warning here is the only signal
      # that a Win32 contract was misread (a wrong VirtualFree argument, a
      # WSAPOLLFD width, an implicit declaration from a missing header). It
      # must never be downgraded to a plain build "because it is only a shim" —
      # a shim nobody can run locally is exactly the code that needs the
      # strictest compile it can get.
      #
      # ★It compiles ALL THREE Windows C files, not just brocken 3's, and
      # keeps going past the first failure (2026-08-10). "Does it compile" is
      # not a per-rung fact: the later rungs compile eio_windows.c and ctime.c, so
      # with `set -e` and one file per step a job reports ONE compile error per
      # CI round — and a round is 12-16 minutes. Since none of these files can
      # be compiled on the host that writes them, the round IS the compiler,
      # and it should answer every question it can in one pass.
      - name: Compile the Win64 C shims (brocken 3, and every other shim)
        shell: bash
        run: |
          set -u
          rc=0
          for f in packages/scaly/0.1.0/scaly/win32/posixcompat_windows.c \
                   packages/scaly/0.1.0/scaly/fiber/eio_windows.c \
                   packages/scaly/0.1.0/scaly/time/ctime.c \
                   packages/scaly/0.1.0/scaly/memory/panic.c; do
            o=$(basename "$f" .c).o
            echo "--- $f ---"
            clang --target=x86_64-pc-windows-msvc -O2 -Wall -Wextra -Werror \
                  -c "$f" -o "$o" || rc=1
          done
          [ "$rc" = 0 ] || { echo "one or more shims failed to compile"; exit 1; }
          echo "--- symbols provided by posixcompat ---"
          # Informative only: a missing llvm-nm must not fail the rung, whose
          # claim is "it compiles", not "we can list it".
          llvm-nm --defined-only posixcompat.o | sed 's/^/  /' \
            || echo "  (llvm-nm unavailable — compile still succeeded)"

      # Rung 2b — brocken 1. Assembling proves the ABI-mechanical half: the
      # register names exist, the SEH pseudo-ops are well-formed, the segment
      # overrides assemble, and every offset is in range. It proves NOTHING
      # about whether the switch is correct — a wrong TIB offset or a
      # misaligned XMM save assembles perfectly and crashes at run time. That
      # is the item CI cannot debug (see the roadmap), so it is worth being
      # explicit about what this rung does and does not buy.
      - name: Assemble the Win64 fiber context switch (brocken 1)
        shell: bash
        run: |
          set -e
          clang --target=x86_64-pc-windows-msvc \
                -c packages/scaly/0.1.0/scaly/fiber/fcontext_x86_64_windows.S \
                -o fcontext_win.o
          echo "--- symbols provided ---"
          llvm-nm --defined-only fcontext_win.o | sed 's/^/  /' \
            || echo "  (llvm-nm unavailable — assemble still succeeded)"

      # Rung 2c — brocken 2, and this one RUNS. The IOCP backend is the only
      # part of the port that had to manufacture semantics instead of
      # translating them (kqueue/epoll report readiness, IOCP reports
      # completion), so "it compiles" would be worth very little. The harness
      # links two objects and no Scaly runtime, which is what lets it run now
      # rather than after the whole substrate is done — the riskiest piece
      # tested first instead of last.
      - name: Build and RUN the IOCP smoke test (brocken 2)
        shell: bash
        run: |
          set -e
          clang --target=x86_64-pc-windows-msvc -O2 -Wall -Wextra -Werror \
                -c packages/scaly/0.1.0/scaly/fiber/eio_windows.c -o eio_win.o
          clang --target=x86_64-pc-windows-msvc -O2 -Wall -Wextra -Werror \
                -c packages/scaly/0.1.0/scaly/win32/posixcompat_windows.c -o pc.o
          clang --target=x86_64-pc-windows-msvc -O2 \
                tests/win32/eio_smoke.c eio_win.o pc.o \
                -o eio_smoke.exe -lws2_32
          ./eio_smoke.exe

      # Rung 4a — brocken 1, the half rung 4 cannot see. pingpong proves the
      # switch WORKS; it holds no live float or vector state across a jump, so a
      # switch that had forgotten XMM6-15 entirely would still print the right
      # thing. Those ten registers plus RSI and RDI are exactly what Win64 adds
      # to the SysV callee-saved set: the likeliest place for a mistake, and the
      # one whose failure is a wrong NUMBER rather than a crash.
      #
      # Both halves of the harness are assembly on purpose — a C driver cannot
      # guarantee the compiler keeps anything in a callee-saved register, and
      # the fiber has to DESTROY them or a missing save and a missing restore
      # cancel into a green test. The reasoning is written out in xmm_check.S.
      - name: Check callee-saved preservation across the switch (rung 4a)
        shell: bash
        run: |
          set -e
          clang --target=x86_64-pc-windows-msvc \
                -c tests/win32/xmm_check.S -o xmm_check.o
          clang --target=x86_64-pc-windows-msvc -O2 \
                tests/win32/fcontext_smoke.c xmm_check.o fcontext_win.o \
                eio_win.o pc.o -o fcontext_smoke.exe -lws2_32
          ./fcontext_smoke.exe

      # Rung 4b — the catch point, measured rather than guessed (2026-09-19,
      # TRAPS.md 3.22). Six corpus programs fail on this target and all six
      # CATCH; the corpus holds no catcher that stays on the original stack, so
      # "longjmp is broken here" and "longjmp is broken across a switched
      # stack" fit the same evidence. tests/win32/setjmp_smoke.c separates them
      # in C, and asks the candidate fix (the non-unwinding `_setjmp(buf,
      # NULL)`) in the same run.
      #
      # ★It NEVER fails the job. Its product is the log: a probe that is
      # expected to kill its own process cannot also be a gate, and turning it
      # into one would only hide the next question behind a red step. The
      # verdict on Windows catching stays with the corpus in rung 5.
      #
      # ★Compiled WITH probe C first and again WITHOUT it if that fails,
      # because the spelling of `_setjmp` on this target is part of what is
      # being asked. A compile error there is a finding; taking probes A and B
      # down with it would waste the round.
      - name: Probe the catch point across a switched stack (rung 4b, measuring only)
        shell: bash
        run: |
          # ★`set +e` EXPLICITLY, and it is the whole reason this step exists
          # twice (2026-09-20): GitHub runs a bash step as `bash -e -o pipefail`,
          # so a probe that is EXPECTED to kill its own process ends the step at
          # that moment — probe B died, the step went red, and probe C, the
          # candidate fix, never ran. `set -u` does not undo `-e`. A measuring
          # step has to say so itself.
          set +e
          set -u
          if clang --target=x86_64-pc-windows-msvc -O2 -Wall -Wextra \
                   -DSJ_PROBE_C=1 -c tests/win32/setjmp_smoke.c -o sj.o \
                   2> sj.compile; then
            echo "probe C compiles (_setjmp takes the frame argument here)"
          else
            echo "--- probe C does not compile; the message is the finding ---"
            head -20 sj.compile
            clang --target=x86_64-pc-windows-msvc -O2 -Wall -Wextra \
                  -c tests/win32/setjmp_smoke.c -o sj.o || {
              echo "setjmp_smoke does not compile at all"; exit 0; }
          fi
          clang --target=x86_64-pc-windows-msvc \
                sj.o fcontext_win.o eio_win.o pc.o -o sj.exe -lws2_32 \
                2> sj.link || { echo "--- it does not LINK ---"; head -20 sj.link; exit 0; }
          # ★Under a TIMEOUT, both runs: a probe whose whole point is that the
          # process may die must not be able to hang the job instead (Windows
          # Error Reporting can hold a dying process open, and this step's
          # sibling rungs have no guard because nothing in them is expected to
          # crash).
          TO=""
          command -v timeout > /dev/null 2>&1 && TO="timeout 60"
          $TO ./sj.exe; rc=$?
          echo "setjmp_smoke exit: $rc (bash's view)"
          if command -v powershell > /dev/null 2>&1 && command -v cygpath > /dev/null 2>&1; then
            raw=$($TO powershell -NoProfile -NonInteractive -Command \
                    "\$p = Start-Process -FilePath '$(cygpath -w "$PWD")\\sj.exe' -NoNewWindow -PassThru -Wait; '{0:X8}' -f \$p.ExitCode" \
                  2>/dev/null | tr -d '\r' | tail -1)
            echo "setjmp_smoke raw exit code: 0x$raw"
          fi
          exit 0

      # Rung 3 — brocken 4, and the one that finally links the RUNTIME. Every
      # rung so far tested a piece in isolation; this one puts all five brocken
      # in one binary, because the archive is a single object with a single
      # .text section and a COFF linker can discard nothing — a program that
      # touches the runtime at all must resolve every symbol it references.
      # tools/win-undef.sh answers that by grep; this answers it with a linker.
      #
      # page_chain_depth is the payload on purpose: it hammers the page
      # allocator, which is exactly what the scaly_aligned_alloc/free pair
      # feeds, and it is the first thing here that RUNS the fiber context
      # switch's neighbourhood rather than just assembling it.
      - name: Archive the runtime and RUN a program on it (rung 3)
        shell: bash
        run: |
          set -e
          clang --target=x86_64-pc-windows-msvc -O2 -Wall -Wextra -Werror \
                -c packages/scaly/0.1.0/scaly/time/ctime.c -o ctime.o
          # The panic catch-point shim (tools/panic.sh on the other targets):
          # the stdlib's containers call scaly_panic_* and Region.run_guarded
          # calls scaly_catch_run, so an archive without it cannot link at all.
          clang --target=x86_64-pc-windows-msvc -O2 -Wall -Wextra -Werror \
                -c packages/scaly/0.1.0/scaly/memory/panic.c -o panic.o
          # eio_win.o, pc.o and fcontext_win.o come from the rungs above.
          llvm-ar rcs libscaly.lib libscaly_win.o eio_win.o ctime.o panic.o pc.o fcontext_win.o
          echo "--- archive members ---"
          llvm-ar t libscaly.lib | sed 's/^/  /'
          # No -lm: the math the tensor kernels need is in the MSVC CRT, so the
          # rule that -lm must come LAST on ELF has no counterpart here.
          clang --target=x86_64-pc-windows-msvc \
                page_chain_depth.o libscaly.lib -lws2_32 -o pcd.exe
          ./pcd.exe | tr -d '\r' > got.txt
          sed -n 's/^; Expected: //p' tests/aot/page_chain_depth.scaly > want.txt
          echo "--- want ---"; cat want.txt
          echo "--- got  ---"; cat got.txt
          diff -u want.txt got.txt

      # Rung 4 — brocken 1, RUN at last. Everything before this only assembled
      # and linked fcontext_x86_64_windows.S; nothing called it. pingpong is the
      # milestone-1.1 demonstrator and drives scaly_make_context /
      # scaly_jump_context directly, six switches deep, so it is the first
      # thing that exercises the Win64 half of the ABI the file had to get
      # right blind: RCX/RDX/R8 arguments, the 32-byte shadow space the
      # trampoline reserves before entering the fiber, XMM6-15 across the
      # switch, and the TIB stack bounds swapped on every jump.
      #
      # This is the rung the roadmap says CI cannot debug — a wrong offset here
      # is a bare crash, not a message. It can only tell us THAT it is wrong.
      - name: Run the fiber context switch (rung 4, brocken 1)
        shell: bash
        run: |
          set -e
          clang --target=x86_64-pc-windows-msvc \
                pingpong.o libscaly.lib -lws2_32 -o pingpong.exe
          # The exit code is reported explicitly, and the run is NOT piped:
          # the first red run here exited 0 with empty output, and a pipeline
          # hides which of the two facts is the surprising one. A Windows
          # exception surfaces as its code (0xC0000005 access violation,
          # 0xC000001D illegal instruction from the never-return trap), which
          # is the only diagnosis CI can offer for this rung.
          set +e
          ./pingpong.exe > got_raw.txt 2>&1
          rc=$?
          set -e
          echo "pingpong.exe exit code: $rc"
          tr -d '\r' < got_raw.txt > got.txt
          sed -n 's/^; Expected: //p' tests/fiber/pingpong.scaly > want.txt
          echo "--- want ---"; cat want.txt
          echo "--- got  ---"; cat got.txt
          diff -u want.txt got.txt

      # Rung 5 — BREADTH. Every rung above ran one program per mechanism; this
      # runs the whole AOT and fiber corpora — 90 programs, each linked against
      # the archive rung 3 built and checked against the ground truth in its own
      # source. It is where the fiber suite's threads, channels, guard page and
      # deadlock detectors meet Windows for the first time, and therefore the
      # first place the write-readiness caveat of a zero-byte WSASend could
      # surface. Every run is under a 60 s timeout: a hang would stall the job to
      # its six-hour limit and teach nothing. Two tests are skipped and counted —
      # they have no self-contained ground truth and are cross-checked against a
      # reference binary on POSIX, which cannot exist here.
      - name: Run the AOT + fiber corpora (rung 5)
        shell: bash
        run: tests/win32/corpus.sh run winobj libscaly.lib

      # Rung 5b — the overflow report across landing positions. Whether the
      # Windows handler runs at all depends on where the recursion first enters
      # the guard page: the dispatch spills its CONTEXT record (XSAVE area
      # included, so it grows with the runner's CPU) below that point, into the
      # band posixcompat_windows.c's mmap reserves. One program at one layout lands in
      # one place, which is why guard_overflow was a flake that a rerun on
      # another runner "fixed" (2026-09-26). The sweep moves the landing point
      # through k = 0..95 small frames; every one must report and exit 108.
      - name: Sweep the stack-overflow report (rung 5b)
        shell: bash
        run: |
          exe=winobj/fiber__guard_overflow_sweep.exe
          ok=0; bad=""
          for k in $(seq 0 95); do
            rc=0; timeout 20 "$exe" "$k" > sweep.out 2> sweep.err || rc=$?
            if [ "$rc" = 108 ] && grep -qF "fiber stack overflow" sweep.err && [ ! -s sweep.out ]; then
              ok=$((ok+1))
            else
              bad="$bad k=$k:rc=$rc"
            fi
          done
          echo "guard sweep: $ok of 96 reported${bad:+ — failed:$bad}"
          [ "$ok" = 96 ]

      # Rung 6 — the 10k demo, and the unknown it adds is LOAD. Rung 5 ran 90
      # programs, but each one drives the poller with a handful of fds; this is
      # 10,000 connections through one single-threaded scheduler, so it is the
      # first time IOCP is driven BY THE SCHEDULER at scale rather than by a
      # test that happens to do I/O. Two things can only show up here:
      #
      #   * the write-readiness caveat documented at scaly_eio_arm — a zero-byte
      #     WSASend is armed for writability and Winsock generally completes it
      #     at once, which degrades to a spin where kqueue/epoll would block.
      #     One connection cannot show that; 10,000 parked handlers can, and it
      #     would show up as TIME rather than as a wrong answer, which is why
      #     the elapsed seconds are printed even on success (POSIX: ~1 s).
      #   * AcceptEx's inverted accept path under repetition — the setup loop
      #     pairs connect+accept 10,000 times against ONE listener, where the
      #     completion table holds one slot per listener.
      #
      # NOT reusing tests/fiber/bench/run.sh: its whole preamble is POSIX
      # (raising RLIMIT_NOFILE to 20,500 and gating on kern.maxfilesperproc,
      # plus topping up /tmp/libscaly.a with `ar`). None of it has a counterpart
      # here — Windows sockets are handles, not CRT descriptors, so no soft
      # limit governs them, and the archive is the one rung 3 built. What is
      # left of that script once the POSIX half is removed is link, run,
      # compare — which is what this step is.
      #
      # ★If it fails, the demo's own exit codes are the diagnosis map, which is
      # why the code is printed and the run is NOT piped: 1 = listen/local_port,
      # 2 = accept, 3 = a handler's read, 4 = connect, 5 = write, 6 = the
      # read-back. Exit 4 has a Windows-specific first suspect — 10,000
      # CONCURRENT outbound loopback connections against a default dynamic port
      # range of 49152-65535, i.e. 16,384 ports shared with whatever TIME_WAIT
      # the earlier rungs left behind.
      - name: Run the 10k demo (rung 6)
        shell: bash
        run: |
          set -e
          clang --target=x86_64-pc-windows-msvc \
                http10k.o libscaly.lib -lws2_32 -o http10k.exe
          # A hang is the one outcome worse than a failure: without a guard it
          # would stall the job to its six-hour limit and teach nothing. 300 s
          # against a POSIX runtime of about one second is not a performance
          # bar, it is a liveness bar.
          set +e
          SECONDS=0
          timeout 300 ./http10k.exe > got_raw.txt 2> err.txt
          rc=$?
          elapsed=$SECONDS
          set -e
          echo "http10k.exe exit code: $rc after ${elapsed}s"
          if [ -s err.txt ]; then
            echo "--- stderr ---"; head -c 600 err.txt
          fi
          if [ "$rc" = 124 ]; then
            echo "TIMEOUT: the demo did not finish in 300 s"
            exit 1
          fi
          tr -d '\r' < got_raw.txt > got.txt
          sed -n 's/^; Expected: //p' tests/fiber/bench/http10k.scaly > want.txt
          echo "--- want ---"; cat want.txt
          echo "--- got  ---"; cat got.txt
          diff -u want.txt got.txt

      # Rung 7 — THE PRODUCT, and the half of the stage's exit criterion that
      # stood at zero: every rung above tests substrate (fibers, poller, page
      # allocator), and none of them parses a line of SGML. This links the
      # onsgmls drop-in and runs the SAME corpus harness, against the SAME
      # goldens, that the POSIX legs use — no second copy of the oracle, and
      # the harness's own discovery gate (tests/sgml/expected-models) still
      # applies, so a tier that silently stops being found fails here too.
      # Only the public tier exists on a runner: corpus-private/ is gitignored.
      #
      # It is also the hardest workload the substrate has carried — the parser
      # is the tree's biggest allocator, so this exercises regions, bump arenas
      # and the page allocator far past what 90 small AOT programs reach.
      #
      # ★The binary is entered through tests/win32/lf-wrapper.sh, and both
      # things that wrapper does are load-bearing (its header has the full
      # reasoning): Windows' CRT hands us a TEXT-mode stdout, so every `\n`
      # leaves as `\r\n` while the goldens are LF — the same normalisation
      # rungs 3, 4, 6 and the corpus driver already do — and argv[0] is forced
      # to a bare `onsgmls`, because the drop-in prefixes each diagnostic with
      # argv[0] and the harness strips that prefix with `sed 's/^[^:]*://'`
      # under the assumption that "program paths carry no colon" — true on
      # POSIX, false for `C:\…`.
      # ★Proven neutral before it was pushed: the same wrapper over the NATIVE
      # binary on macOS reports 483 of 483, identical to the unwrapped run, so
      # where there are no CRs it changes nothing.
      - name: Run the SGML corpus through the drop-in (rung 7)
        shell: bash
        run: |
          set -e
          clang --target=x86_64-pc-windows-msvc \
                onsgmls_win.o opensp_win.o libscaly.lib -lws2_32 -o onsgmls.exe
          ls -l onsgmls.exe
          # One parse before the corpus: if the drop-in cannot start at all,
          # 380 identical failures say that far less clearly than one does.
          # `|| true` because the interesting output is what it PRINTS here;
          # the corpus below is what judges it.
          root=$PWD
          ( cd tests/sgml/corpus/synth-after-docelement \
            && "$root/onsgmls.exe" doc.sgm ) || true
          export LFW_BIN="$root/onsgmls.exe"

          # ★THE DIAGNOSIS IS BUILT IN, not added after a red round. The harness
          # reports MISMATCH per entry and nothing about WHY, which on a first
          # port means 380 lines that all say the same nothing. So: one entry
          # WITHOUT diagnostics (pure ESIS) and one WITH, each dumped as BYTES
          # on both sides. Bytes rather than text because every candidate cause
          # here — a stray CR, a checkout that rewrote the golden, a path
          # separator — is invisible in a plain diff.
          # The probe reads the entry's own manifest, so it reproduces what the
          # harness ran rather than an approximation of it — including RAST=1,
          # which is the whole point below.
          probe() {
            local e=$1 d="tests/sgml/corpus/$1"
            local DOC="" SP_ENV="" EXTRA_ARGS="" RAST=0
            . "$d/manifest"
            echo "=== probe $e (RAST=$RAST) ==="
            local rf="$root/probe.rast"; rm -f "$rf"
            local ra=""; [ "$RAST" = "1" ] && ra="-t $rf"
            local prc=0
            ( cd "$d" && env $SP_ENV "$root/tests/win32/lf-wrapper.sh" \
                $ra $EXTRA_ARGS "$DOC" ) > /tmp/p.esis 2> /tmp/p.err || prc=$?
            echo "  exit: $prc  (want $(cat "$d/expected.exit" 2>/dev/null))"
            echo "--- got esis (od) ---";   od -c /tmp/p.esis | head -4
            echo "--- want esis (od) ---";  od -c "$d/expected.esis" | head -4
            echo "--- got stderr ---";      head -c 400 /tmp/p.err
            # ★NO PIPELINE OFF A COMMAND THAT IS ALLOWED TO FAIL. The step runs
            # under `bash -e -o pipefail` (GitHub's default for `shell: bash`),
            # so `ls missing | head` reports 2 and kills the whole step — which
            # is what happened here: exactly ONE probe printed and the
            # experiment below never ran at all.
            if [ "$RAST" = "1" ]; then
              if [ -f "$rf" ]; then echo "  rast: created, $(wc -c < "$rf") bytes"
              else echo "  rast: NOT created"; fi
            fi
          }
          rc=0
          tests/sgml/run.sh "$PWD/tests/win32/lf-wrapper.sh" > corpus.log 2>&1 || rc=$?
          cat corpus.log
          if [ "$rc" != 0 ]; then
            # Whichever entries actually failed — not two hardcoded guesses.
            for e in $(sed -n 's/^failed: *//p' corpus.log | tr ' ' '\n' \
                       | grep . | head -3); do
              # A probe must never be able to end the run it is diagnosing.
              probe "$e" || echo "  (probe $e itself failed: $?)"
            done
            # ★A NAMED HYPOTHESIS, answered in the same round rather than in the
            # next one: the harness hands `-t` a path from `mktemp`, which under
            # Git Bash is a POSIX path (/tmp/…). Our onsgmls.exe is a NATIVE
            # program — it never sees the msys mount table, so `/tmp/x` reaches
            # `creat` as a path relative to the current DRIVE. The two runs
            # below differ ONLY in how that one path is spelled; if the Windows
            # spelling works and the POSIX one does not, that is the answer and
            # no further round is needed to find it.
            # ★TWO HYPOTHESES, AND THE STDERR IS WHAT SEPARATES THEM. The probe
            # above says the -t runs die with exit 127 and print NOTHING — no
            # ESIS, no diagnostic, no file. That silence already argues against
            # the obvious explanation (a POSIX `/tmp/…` path a native .exe
            # resolves drive-relative), because a `creat` that merely FAILS
            # makes the drop-in print `cannot open output file` and exit 1 —
            # that path is right there in onsgmls.scaly. Silence instead points
            # at the process dying inside the call, which on this platform is
            # the CRT's invalid-parameter handler (the class CLAUDE.md records
            # for `close`). So: same document, same binary, only the SPELLING
            # of the -t path varies — and stderr is KEPT this time, because
            # throwing it away is what made the last round inconclusive.
            echo "=== -t path spelling experiment ==="
            try_t() {
              local label=$1 path=$2 trc=0
              rm -f "$path" 2>/dev/null || true
              ( cd tests/sgml/corpus/synth-rast-basic \
                && "$root/onsgmls.exe" -t "$path" doc.sgm ) \
                > /tmp/t.out 2> /tmp/t.err || trc=$?
              local made=no; [ -f "$path" ] && made=yes
              echo "  $label -> exit $trc  file:$made  '$path'"
              if [ -s /tmp/t.err ]; then echo "      stderr: $(head -c 200 /tmp/t.err)"
              else echo "      stderr: (empty)"; fi
            }
            # relative: no path translation can be involved at all, so if this
            # ALSO dies silently the spelling is not the cause.
            ( cd tests/sgml/corpus/synth-rast-basic \
              && "$root/onsgmls.exe" -t out.rast doc.sgm ) > /tmp/t.out 2> /tmp/t.err \
              && rel_rc=0 || rel_rc=$?
            echo "  relative(cwd) -> exit $rel_rc  file:$([ -f tests/sgml/corpus/synth-rast-basic/out.rast ] && echo yes || echo no)"
            if [ -s /tmp/t.err ]; then echo "      stderr: $(head -c 200 /tmp/t.err)"
            else echo "      stderr: (empty)"; fi
            rm -f tests/sgml/corpus/synth-rast-basic/out.rast
            td="$(mktemp -d)"
            try_t "posix-abs  " "$td/x.rast"
            if command -v cygpath > /dev/null 2>&1; then
              try_t "windows-abs" "$(cygpath -w "$td")\\y.rast"
            else
              echo "  (no cygpath on this runner)"
            fi
            # And the control that says the binary is fine without -t at all.
            ( cd tests/sgml/corpus/synth-rast-basic \
              && "$root/onsgmls.exe" doc.sgm ) > /tmp/t.out 2> /tmp/t.err \
              && not_rc=0 || not_rc=$?
            echo "  no -t at all -> exit $not_rc  stdout bytes: $(wc -c < /tmp/t.out)"
          fi
          exit $rc

      # Rung 8 — the DSSSL ENGINE, i.e. the other half of the product. Rung 7
      # proved the parser; this links dazzle_cli and runs ELEVEN of its suites
      # through the SAME drivers the POSIX legs use. That reuse is the point:
      # a suite reimplemented for one platform is a second oracle, and this tree
      # does not allow one. It is possible because tests/dazzle/build-cli.sh —
      # the single place that produces the CLI — accepts DAZZLE_PREBUILT and
      # then publishes tests/win32/lf-wrapper.sh at the path the suites invoke.
      #
      # ★THE ENGINE DRAGS libLLVM ONTO EVERY TARGET, and that is a finding, not
      # a build detail: the JIT lives IN the dazzle package (dazzle/Jit.scaly),
      # so the package object owes 61 LLVM-C symbols — measured — even though
      # `--jit` is opt-in and nothing here enables it. The archive is one object
      # with one .text section, so a COFF linker can discard none of it. Hence
      # the -lLLVM-C below, satisfied from the LLVM the runner image already
      # ships for clang. ★Caveat written down rather than discovered later: that
      # LLVM is version 20 while the reference build uses 18, so this binary's
      # JIT is linked but NOT validated — which is exactly why no step here
      # passes --jit.
      - name: Link the dazzle engine and run its suites (rung 8)
        shell: bash
        run: |
          set -e
          # Locate LLVM-C. Reported rather than assumed: if the runner image
          # ever stops shipping it, the message should name that, not leave a
          # linker error to be decoded.
          llvmlib=""
          for d in "/c/Program Files/LLVM/lib" "/c/Program Files (x86)/LLVM/lib"; do
            [ -f "$d/LLVM-C.lib" ] && { llvmlib="$d"; break; }
          done
          if [ -z "$llvmlib" ]; then
            echo "rung 8: no LLVM-C.lib found — the dazzle package needs it for"
            echo "        the 61 LLVM-C symbols its JIT references. Looked in:"
            echo "        /c/Program Files/LLVM/lib, /c/Program Files (x86)/LLVM/lib"
            ls "/c/Program Files/LLVM/lib" 2>&1 | head -20
            exit 1
          fi
          echo "rung 8: linking against $llvmlib/LLVM-C.lib"
          clang --target=x86_64-pc-windows-msvc \
                dazzle_cli_win.o dazzle_win.o opensp_win.o libscaly.lib \
                -lws2_32 -L"$llvmlib" -lLLVM-C -o dazzle.exe
          ls -l dazzle.exe

          # One transform before the suites: if the engine cannot start, eleven
          # suites failing say that far less clearly than one invocation does.
          ./dazzle.exe -v 2>&1 | head -3 || true

          root=$PWD
          export DAZZLE_PREBUILT="$root/dazzle.exe"
          fail=0
          for s in engine fot cli prims grove flowobj coding rtf html mif tex; do
            if tests/dazzle/$s/run.sh > "dz-$s.log" 2>&1; then
              echo "  $s: $(tail -1 "dz-$s.log")"
            else
              fail=1
              echo "  $s: FAIL"
              # ★60, not 20: a suite stops at its FIRST failure, so the useful
              # line is the one naming the case — and a byte-level diff pushed
              # it out of a 20-line tail, which cost a round.
              tail -60 "dz-$s.log" | sed 's/^/      /'
            fi
          done

          if [ "$fail" != 0 ]; then
            # ★A DECOMPOSITION, not a dump. prims/time1 came back with exit 0
            # and an EMPTY stdout — so the process neither crashed nor
            # complained, and the suite's own report cannot say more. The two
            # runs below differ only in TZ, which splits the two candidates:
            # the CRT's handling of the POSIX TZ string `EST5`, and the time
            # conversion itself (the expected output covers 1969 dates, i.e.
            # NEGATIVE time_t, which MSVC's gmtime/localtime refuse outright).
            echo "=== probe prims/time1 ==="
            for tz in EST5 ""; do
              prc=0
              ( cd tests/dazzle/prims \
                && TZ="$tz" SCALY_HOME="$root" "$root/dazzle.exe" \
                     -t sgml -d time1.dsl langdoc.sgml ) \
                > /tmp/pt.out 2> /tmp/pt.err || prc=$?
              echo "  TZ='$tz' -> exit $prc  stdout $(wc -c < /tmp/pt.out) bytes"
              if [ -s /tmp/pt.err ]; then echo "      stderr: $(head -c 300 /tmp/pt.err)"
              else echo "      stderr: (empty)"; fi
              if [ -s /tmp/pt.out ]; then echo "      stdout: $(head -c 200 /tmp/pt.out)"; fi
            done
          fi
          exit $fail

      # ★Rung 9 — the COMPILER on Windows. Every rung so far ran something
      # scalyc BUILT; this runs scalyc. It is the prerequisite for the stage's
      # formal exit criterion (`tools/seed.sh` reproducing byte-identically
      # here), and it adds one unknown: the compiler binary itself — its
      # libLLVM linkage, its file and path handling, and its emitter, on a
      # platform where none of the three has ever executed.
      #
      # ★TWO Windows-specific conditions, both known BEFORE the first run
      # rather than after it:
      #
      # (1) libLLVM must be the tree's major (**21**, tools/llvm-env.sh), and
      #     the runner's is another. Everywhere else in
      #     this workflow "any clang links" holds, because a linker does not
      #     care — but the compiler CALLS this library, and what it emits is a
      #     function of the version. Rung 8 links dazzle against the runner's
      #     LLVM-C precisely because it never switches the JIT on; here the
      #     version is load-bearing, so 21 is unpacked into its own directory
      #     and the runner's stays where it is. Mixing the two questions into
      #     one round is what the rung discipline exists to prevent.
      # (2) ★The default stack is **1 MB on Windows against 8 on POSIX**, and
      #     `Planner.check_nesting_stack` is bound in NESTING DEPTH — CLAUDE.md
      #     measures ~15 KB of planner stack per `else if` arm with an
      #     optimised compiler and ~110 KB with an unoptimised one, and this
      #     binary is the unoptimised kind (plain `-c` objects; `-c -O2` on a
      #     library object is what GlobalDCE empties). tools/seed.sh runs its
      #     emission under `ulimit -s 65520`; the COFF equivalent is a stack
      #     reserve on the link, which costs address space and no memory.
      #     ★Spelled `-stack:` and not `/STACK:` on purpose: an argument
      #     beginning with `/` is what the MSYS runtime rewrites into a path on
      #     its way to a native program, and both MSVC's link and lld-link
      #     accept either prefix. Same class as the `cmd //c` note below —
      #     under Git Bash a leading slash is never just a leading slash.
      - name: Link the compiler and RUN it (rung 9)
        shell: bash
        run: |
          set -e
          # --- LLVM 21: EXTRACTED, never installed --------------------------
          # ★Running the official NSIS installer silently WORKS and then breaks
          # the runner: it delivered both files in 85 s and the very next line
          # died with `clang: command not found`. Installing a second LLVM on
          # Windows is not additive — the installer either truncates the system
          # PATH (the old NSIS env-plugin 1024-char bug) or uninstalls the LLVM
          # already there, and the machine-wide damage lands on a step that has
          # nothing to do with it. Which of the two it was is a question this
          # rung does not have to answer: unpacking asks neither.
          # What we actually need is TWO FILES out of a 2.5 GB payload, and 7z
          # reads NSIS archives directly. Measured locally: 9 s, and the import
          # library exports all 224 LLVM-C symbols the compiler references
          # (checked name by name against the cross-emitted object — 0 missing),
          # so the link below has no LLVM-shaped unknown left in it.
          command -v 7z > /dev/null || { echo "rung 9: no 7z on this runner"; exit 1; }
          url=https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/LLVM-21.1.8-win64.exe
          # -f, not just -sSL: without it curl answers 0 on an HTTP error and
          # writes the error PAGE into llvm21.exe, so a moved asset would look
          # like a broken archive. ~357 MB is the expected size.
          curl -fsSL -o llvm21.exe "$url"
          ls -l llvm21.exe
          # ★Two spellings that are load-bearing under Git Bash. The extraction
          # target is RELATIVE: an argument like `-o/c/llvm21` does not begin
          # with `/`, so MSYS leaves it alone and 7z then reads the POSIX path
          # as `C:\c\llvm21`. And the two members are named with `-r` plus a
          # bare filename rather than `bin/LLVM-C.dll`, which keeps any
          # separator question out of it while still preserving their paths.
          7z x -bso0 -bsp0 llvm21.exe -ollvm21 -r "LLVM-C.dll" "LLVM-C.lib"
          lib21="llvm21/lib"; bin21="llvm21/bin"
          if [ ! -f "$lib21/LLVM-C.lib" ] || [ ! -f "$bin21/LLVM-C.dll" ]; then
            echo "rung 9: the archive did not yield the C library."
            echo "        want $lib21/LLVM-C.lib and $bin21/LLVM-C.dll"
            find llvm21 -type f | head -20
            head -c 2 llvm21.exe | od -c | head -1
            exit 1
          fi
          ls -l "$lib21/LLVM-C.lib" "$bin21/LLVM-C.dll"
          echo "rung 9: LLVM-C 21 at $lib21"

          # --- link ---------------------------------------------------------
          # libscaly.lib is the archive rung 3 built in this same job. The DLL
          # is COPIED beside the binary rather than put on PATH: prepending
          # llvm21/bin would shadow the runner's clang with LLVM 21's for the
          # rest of this step, which is a second change nobody asked for — and
          # the paragraph above is what that class of side effect costs.
          cp "$bin21/LLVM-C.dll" .
          clang --target=x86_64-pc-windows-msvc \
                scalyc_main_win.o scalyc_win.o libscaly.lib \
                -lws2_32 -L"$lib21" -lLLVM-C \
                -Xlinker -stack:67108864,1048576 \
                -o scalyc.exe
          ls -l scalyc.exe

          # --- it RUNS, and it emits ---------------------------------------
          # No --target: the natural invocation, and the one tools/seed.sh will
          # make. The compiler reads its host triple at runtime, so this also
          # asks whether that answer is the same string the Linux leg was given.
          export SCALY_HOME="$PWD"
          rc=0
          ./scalyc.exe -c -o hello_native.o tests/aot/hello.scaly || rc=$?
          if [ "$rc" != 0 ]; then
            echo "rung 9: the compiler exited $rc emitting hello.scaly"
            exit 1
          fi
          ls -l hello_native.o

          # --- the checksum, and it is stronger than "it ran" ---------------
          # hello.o was cross-emitted on the Linux leg for this exact triple by
          # a compiler built from the same sources. The build stamp is hashed
          # over the IR with ModuleID, source_filename and datalayout SKIPPED,
          # so it does not depend on the checkout path or on --target — which
          # is what makes a byte comparison meaningful rather than optimistic.
          if cmp -s hello_native.o hello.o; then
            echo "rung 9: emitted object BYTE-IDENTICAL to the cross-emitted one"
          else
            # ★A decomposition, not a dump: the explicit --target run separates
            # "the host triple resolves to a different string" from "the
            # emission differs", and only the first is a one-line fix.
            echo "rung 9: objects DIFFER"
            echo "  native $(wc -c < hello_native.o) bytes, cross-emitted $(wc -c < hello.o)"
            cmp -l hello_native.o hello.o | head -5 || true
            ./scalyc.exe -c --target x86_64-pc-windows-msvc \
                         -o hello_triple.o tests/aot/hello.scaly || true
            if cmp -s hello_triple.o hello.o; then
              echo "  ...but WITH an explicit --target it is identical:"
              echo "     the host triple string is what differs, not the emitter."
            else
              echo "  ...and with an explicit --target too: the emitter differs."
            fi
            exit 1
          fi

          # --- and the object is a real one --------------------------------
          # Same shape as rung 1, deliberately: the expected line is read from
          # the test SOURCE so the two cannot drift apart, and LC_ALL=C guards
          # the CR strip — `tr` is not a byte filter in a UTF-8 locale (rung 7
          # paid a round for that one).
          clang --target=x86_64-pc-windows-msvc hello_native.o -o hello_native.exe
          rc=0
          ./hello_native.exe > got_raw.txt || rc=$?
          echo "rung 9: hello exited $rc"
          LC_ALL=C tr -d '\r' < got_raw.txt > got9.txt
          sed -n 's/^; Expected: //p' tests/aot/hello.scaly > want9.txt
          diff -u want9.txt got9.txt
          [ "$rc" = 0 ] || exit 1
          echo "rung 9: OK — scalyc runs on Windows and reproduces the object"

      # ★Rung 10 — the compiler DRIVES A LINK. Rung 9 stopped at `-c`, which is
      # the half of the compiler that needs no platform knowledge; this is the
      # other half, and it is the one place in the whole product where the
      # compiler has to know what OS it is standing on. Three POSIX assumptions
      # lived in `cli.run` and are now asked of the resolved TRIPLE — the same
      # question, and the same single answering site, as the comdat gate:
      #   * the scratch object went to `/tmp/scalyc_out.o`, which a native
      #     binary resolves against the current DRIVE root (C:\tmp\…);
      #   * the runtime archive was `/tmp/libscaly.a`, here `libscaly.lib`;
      #   * the command ended in `-lm`, which is not a no-op on MSVC but a hard
      #     `cannot open file 'm.lib'` — and what it does need is `-lws2_32`,
      #     for exactly the reason it needs libm on Linux: the archive is ONE
      #     object, so every program drags in the IOCP backend.
      # POSIX takes none of those branches, which is why `tools/cycle.sh` came
      # back IDENTICAL and only `seed/scalyc.ll` moved.
      #
      # ★SCALY_HOME does double duty and that is deliberate: it is where the
      # compiler looks for `packages/` AND for `lib/libscaly.<ext>`. Pointing it
      # at the checkout and dropping the archive into `lib/` exercises the
      # INSTALLED layout — the one a Windows user gets — rather than a temp
      # path only CI would ever use.
      - name: Let the compiler link a program (rung 10)
        shell: bash
        run: |
          set -e
          mkdir -p lib
          cp libscaly.lib lib/libscaly.lib
          export SCALY_HOME="$PWD"
          rc=0
          ./scalyc.exe -o pcd_native.exe tests/aot/page_chain_depth.scaly || rc=$?
          if [ "$rc" != 0 ]; then
            echo "rung 10: the compiler exited $rc linking page_chain_depth"
            exit 1
          fi
          ls -l pcd_native.exe
          # The scratch object must be GONE: `cli.run` unlinks it, and a
          # leftover would mean the temp path it chose is not the one it
          # deleted — a difference no output would ever show.
          if [ -n "${TMP:-}" ] && [ -f "$TMP/scalyc_out.o" ]; then
            echo "rung 10: scratch object left behind in $TMP"; exit 1
          fi
          rc=0
          ./pcd_native.exe > got10_raw.txt || rc=$?
          echo "rung 10: program exited $rc"
          LC_ALL=C tr -d '\r' < got10_raw.txt > got10.txt
          sed -n 's/^; Expected: //p' tests/aot/page_chain_depth.scaly > want10.txt
          diff -u want10.txt got10.txt
          [ "$rc" = 0 ] || exit 1
          echo "rung 10: OK — scalyc links and the program runs"

      # ★Rung 11 — the compiler emits ITS OWN SEED here, and it matches the
      # Linux leg's cross-emission byte for byte. Rung 9 made that comparison
      # over a 1.4 KB hello object; this makes it over the ~20 MB of IR that
      # IS the compiler, with the same three roots and the same flags
      # `tools/seed.sh` uses.
      #
      # ★What it is and what it is NOT, said plainly. It is two independently
      # built binaries of the same sources — one hosted on Linux, one on
      # Windows — agreeing on the whole compiler image. It is NOT the stage's
      # exit criterion: that one builds a compiler FROM this seed HERE and has
      # it re-emit. ★The note that stood here — "and it needs `llc`/`opt`/
      # `llvm-link` at 18, none of which the official Windows installer ships"
      # — was half right and wholly misleading, and rung 12 below says which
      # half: the three tools are indeed absent, and they are also not needed.
      #
      # ★It also settles by MEASUREMENT something that was only settled by
      # reading: our File API opens every output `"wb"`, so `-S` writes LF
      # here too. A CRLF file could not match a byte comparison — rung 7's CRs
      # came from the CRT's TEXT-mode stdout, never from us.
      - name: Re-emit the compiler seed and compare (rung 11)
        shell: bash
        run: |
          set -e
          export SCALY_HOME="$PWD"
          mkdir -p reseed
          for f in main scalyc; do
            ./scalyc.exe -S --no-tests -o "reseed/$f.ll" \
                         "packages/scalyc/0.1.0/$f.scaly"
          done
          ./scalyc.exe -S --no-tests -o reseed/scaly.ll \
                       packages/scaly/0.1.0/scaly.scaly
          ls -l reseed/*.ll
          bad=0
          for f in main scalyc scaly; do
            if cmp -s "reseed/$f.ll" "winseed/$f.ll"; then
              echo "  $f.ll: identical"
            else
              bad=1
              echo "  $f.ll: DIFFERS — $(wc -c < "reseed/$f.ll") vs $(wc -c < "winseed/$f.ll") bytes"
              # ★The first differing line, not the first differing BYTE: a
              # datalayout or a stray CR shows up as a readable line, and a
              # real emission difference names a function. Three lines of
              # context is what tells those two apart at a glance.
              diff "winseed/$f.ll" "reseed/$f.ll" | head -6 | sed 's/^/      /'
            fi
          done
          [ "$bad" = 0 ] || exit 1
          echo "rung 11: OK — the compiler reproduces its own seed on Windows"

      # ★Rung 12 — the stage's EXIT: a compiler built FROM THE COMMITTED SEED
      # on this machine, re-emitting that seed byte for byte. Every rung up to
      # and including 11 ran a binary whose object code was made on Linux; this
      # one makes it here, out of the committed text, so the last thing the
      # Windows leg takes from the Linux leg is the file it compares against.
      #
      # ★It installs no toolchain, and that rests on two measurements taken on
      # the dev box before a line of this was written.
      #   * The VERSION requirement is obsolete for today's seed. The rule
      #     ("llc must be LLVM 18 — it accepts the seed's mul/ptrtoint-GEP
      #     constexprs") predates the removals it fears: of the three constant
      #     expressions LLVM 19 actually removed — icmp, fcmp, shl — the seed
      #     contains ZERO, and its four `mul` ones were never removed. Checked
      #     against LLVM 20.1.8, which is the version this runner has
      #     preinstalled: a compiler built from the committed seed with 20's
      #     llc/opt/llvm-link re-emits all three roots byte-identically
      #     (~19.5 MB) and passes regress 164/164 and the AOT corpus 54/54.
      #     ★A tool version and a LIBRARY version are separate questions —
      #     `llc` only translates the seed text, while the compiler's own
      #     emission comes out of LLVM-C, which stays at 18 here. Rung 11
      #     already proved that split harmless across a PATCH level (apt's
      #     18.1.3 against this leg's 18.1.8); the measurement above extends it
      #     across a GENERATION, `opt -O2` of another LLVM over our IR included
      #     — which is the one place the datalayout-UB class would show.
      #   * The three tools are not needed at all. `clang -flto=full` writes
      #     bitcode objects and `lld-link` does the merge, the optimisation and
      #     the codegen in one step — that IS llvm-link + opt + llc, under two
      #     names the installer does ship. (Counted in the LLVM 20 NSIS archive
      #     the runner installs from: 64 binaries, with clang, lld-link,
      #     llvm-ar, llvm-nm, llvm-lib present and llc, opt, llvm-link absent.)
      #
      # ★And LTO is not a convenience here, it is the only route: the committed
      # seed carries no COMDATs and cannot — one text serves every target and
      # Mach-O refuses them — so on COFF every `linkonce_odr` lowers to a bare
      # `.weak` plus a default symbol named after that object's anchor, which
      # differs per object. Measured over the real cross-emitted objects: 257
      # symbols defined in BOTH scalyc.obj and scaly.obj, and lld-link stops at
      # its error limit on duplicates. With -flto there is one module at link
      # time and the question never arises. Cost, measured: 23 s of LTO for the
      # whole 20 MB image on the dev box, single-threaded.
      - name: Build the compiler FROM THE SEED and re-emit (rung 12)
        shell: bash
        run: |
          set -e
          # The seed's own gate first: it is the INPUT of this rung, and a
          # checkout that differs from what was committed would make everything
          # below a statement about the wrong bytes.
          ( cd seed && sha256sum -c SHA256SUMS ) | tail -1

          # --- seed text -> bitcode objects --------------------------------
          # ★NO -O2 here, and the reason is the trap CLAUDE.md already names
          # ("never -c -O2 a library: no main anchor + linkonce_odr = GlobalDCE
          # deletes every body"). It cost this rung its first round, so here is
          # the sharper form of it: a DCE that runs per MODULE cannot know about
          # a reference from another module. `cli::main` is linkonce_odr in
          # scalyc.ll and reachable from main.ll — but nothing inside its own
          # module refers to it, so -O2 discarded it and the link failed with
          # `undefined symbol: cli::main(int, char**)`. Measured both ways on
          # the dev box for this exact triple: scalyc.obj is 1864 bytes with
          # -O2 and 4409480 without, and llvm-nm finds cli::main in exactly one
          # of them. The optimisation is not lost, it MOVES to the link, where
          # the whole program is visible — which is what -flto means and what
          # makes this the analogue of build-from-seed.sh's `opt -O2` over the
          # llvm-link'ed module rather than a weaker build.
          # ★So the weak_odr promotion that pipeline does is deliberately NOT
          # copied: it exists to keep stdlib bodies visible to the in-process
          # ORC JIT, and the JIT does not work on Windows anyway (GetProcAddress
          # searches an export table, and an .exe exports nothing). Discarding
          # what an executable cannot reach is correct here.
          # ★And one thing `opt` did for the POSIX pipeline has to be done by
          # hand here, because it is the SECOND round this rung cost. A
          # `declare` nothing calls leaves no trace in a real object file — but
          # a BITCODE module's symbol table keeps it, so under LTO every dead
          # declaration becomes an undefined symbol and the link dies on names
          # that no code refers to (`Option<int>::unwrap()`, `scaly_atomic_*`:
          # each occurs exactly ONCE in the seed, on its own declare line).
          # `opt -O2` drops them before llc, which is why the POSIX seed links
          # with zero undefined symbols and why this was invisible until now.
          # Dropping a declaration whose name occurs once in its own module is
          # safe by construction — nothing in that module can refer to it, and
          # a declaration is inert in every other one. Measured: 58 of 406 go
          # (main 4→2, scalyc 323→279, scaly 79→67), and the link's undefined
          # count falls 360 → 304 with every remaining one real (LLVM-C, the
          # CRT, our shims).
          for f in main scalyc scaly; do
            grep -o '@[A-Za-z0-9_.$]*' "seed/$f.ll" | sort | uniq -c \
              | awk '$1==1{print $2}' > "dead_$f.txt"
            awk 'NR==FNR{dead[$0]=1;next}
                 /^declare/ { if (match($0,/@[A-Za-z0-9_.$]+/) \
                              && (substr($0,RSTART,RLENGTH) in dead)) next }
                 {print}' "dead_$f.txt" "seed/$f.ll" > "live_$f.ll"
            echo "  $f.ll: $(grep -c '^declare' "seed/$f.ll") declares ->" \
                 "$(grep -c '^declare' "live_$f.ll") live"
            clang --target=x86_64-pc-windows-msvc -flto=full \
                  -c "live_$f.ll" -o "seed_$f.obj"
          done
          ls -l seed_*.obj

          # --- link ---------------------------------------------------------
          # ★-fuse-ld=lld is load-bearing, not a preference: link.exe cannot
          # read LLVM bitcode, so the default MSVC linker would report every
          # symbol in the image as undefined.
          # ★The C shims go in as OBJECTS, not through libscaly.lib: that
          # archive also holds the Linux-cross-emitted Scaly runtime, which is
          # the very thing this rung builds from the seed instead — pulling it
          # in would resolve the runtime twice and quietly measure nothing.
          # LLVM-C.dll/.lib are the ones rung 9 unpacked in this same job.
          # ★-errorlimit:0 because lld-link stops at 20 and that truncation
          # reads like a clean, short answer: this rung's diagnosis cost an
          # extra step to the same trap locally, where "20 errors, all memcpy"
          # hid 340 more — among them the ones that named the actual defect.
          # ★-O2 sits HERE, on the link, because with -flto that is what sets
          # the LTO pipeline's level — the driver would otherwise hand the
          # backend O0 and the compiler would come out unoptimised, which is a
          # difference no byte comparison in this rung could see.
          clang --target=x86_64-pc-windows-msvc -O2 -fuse-ld=lld -flto=full \
                seed_main.obj seed_scalyc.obj seed_scaly.obj \
                pc.o eio_win.o ctime.o panic.o fcontext_win.o \
                -lws2_32 -Lllvm21/lib -lLLVM-C \
                -Xlinker -stack:67108864,1048576 \
                -Xlinker -errorlimit:0 \
                -o scalyc_seed.exe
          ls -l scalyc_seed.exe

          # --- the fixed point ---------------------------------------------
          # Compared against winseed/, NOT against seed/: a COFF-hosted
          # emission carries the Windows datalayout and 2756 comdat lines that
          # the committed text cannot have (measured on the dev box — the two
          # differ by 5972 lines, all of them that). winseed/ is the same
          # emission from the Linux leg, so this asks the one question that is
          # actually open: do a seed-BUILT compiler and a cross-built one agree?
          export SCALY_HOME="$PWD"
          mkdir -p seedemit
          for f in main scalyc; do
            ./scalyc_seed.exe -S --no-tests -o "seedemit/$f.ll" \
                              "packages/scalyc/0.1.0/$f.scaly"
          done
          ./scalyc_seed.exe -S --no-tests -o seedemit/scaly.ll \
                            packages/scaly/0.1.0/scaly.scaly
          ls -l seedemit/*.ll
          bad=0
          for f in main scalyc scaly; do
            if cmp -s "seedemit/$f.ll" "winseed/$f.ll"; then
              echo "  $f.ll: identical"
            else
              bad=1
              echo "  $f.ll: DIFFERS — $(wc -c < "seedemit/$f.ll") vs $(wc -c < "winseed/$f.ll") bytes"
              diff "winseed/$f.ll" "seedemit/$f.ll" | head -6 | sed 's/^/      /'
            fi
          done
          [ "$bad" = 0 ] || exit 1

          # --- and it is a COMPILER, not only an emitter --------------------
          # One end-to-end program through the seed-built binary: it drives the
          # link (rung 10's path) and the result runs. Cheap, and it separates
          # "emits the same bytes" from "works".
          rc=0
          ./scalyc_seed.exe -o hello_seed.exe tests/aot/hello.scaly || rc=$?
          [ "$rc" = 0 ] || { echo "rung 12: the seed-built compiler exited $rc"; exit 1; }
          ./hello_seed.exe > got12_raw.txt || rc=$?
          echo "rung 12: hello exited $rc"
          LC_ALL=C tr -d '\r' < got12_raw.txt > got12.txt
          sed -n 's/^; Expected: //p' tests/aot/hello.scaly > want12.txt
          diff -u want12.txt got12.txt
          [ "$rc" = 0 ] || exit 1
          echo "rung 12: OK — the committed seed builds a compiler here that reproduces it"
