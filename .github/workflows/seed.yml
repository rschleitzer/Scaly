name: seed

# Mint + fixed-point-verify the seed on x86_64-linux-gnu, then link + run a
# cross-emitted object on Windows.
#
# ONE BUILDING runner on purpose (2026-08-04). The committed seed .ll is
# target-neutral (no triple; the datalayout is stamped per invocation, LP64
# sizes baked in), so one seed serves all four "fabulous four" LP64 targets —
# but the toolchain is host-only for LINKING + RUNNING, so a target is only
# natively verified by a runner of that target. This repo is private, where
# GitHub bills macOS minutes at 10x the Linux rate and every push ran three
# legs; that bill, not a technical limit, is why the matrix is gone.
# x86_64-linux is the cheapest leg and the one whose codegen most needs a
# native check (the dev box is arm64-apple-darwin, so Linux/x86_64 is what
# nobody exercises locally).
#
# ★ "ONE runner" is no longer literally true (2026-08-09): a second, tiny
# `windows` job was added for stage 7. It does not BUILD anything — it links
# one object this leg emitted and runs it — and Windows bills at 2x, not
# macOS's 10x, so the cost argument above is intact rather than overridden.
# The details are in the job's own comment.
#
# What the other three LP64 targets still get: OBJECT emission for all of them
# is checked by tests/target/run.sh (--target cross-emit) in this leg — which
# since 2026-08-09 also covers the two Windows targets — and arm64-apple-darwin
# is covered by the full local bar on the dev box before every push. To verify
# another target natively, run `tools/seed.sh` on a host of that target, or add
# a leg back here.
#
# tools/seed.sh auto-bootstraps stage-2 from the committed seed (no C++, no
# cmake, no openjade — LLVM 18 + clang only), emits the seed, links it clean,
# runs hello + the AOT corpus, checks byte-identical self-reproduction, and
# builds + smoke-tests the scalyls language server.

# editors/** is the VS Code extension (TypeScript + npm deps): nothing the seed
# pipeline compiles, links or runs. Skipping it keeps Dependabot's npm bumps —
# the bulk of this repo's PR traffic — from spending minutes on a full bootstrap.
on:
  push:
    branches: [master]
    paths-ignore: ['editors/**']
  pull_request:
    branches: [master]
    paths-ignore: ['editors/**']
  workflow_dispatch:

jobs:
  seed:
    name: x86_64-linux-gnu
    runs-on: ubuntu-latest
    steps:
      # v5 runs on Node 24; v4 was being force-migrated off the deprecated
      # Node 20 and warned on every run. v6/v7 exist — step up when something
      # needs them, not on principle.
      - uses: actions/checkout@v5

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev clang-18 lld-18 python3
          # seed.sh links with $CLANG; Ubuntu ships clang-18, not a bare `clang`.
          echo "CLANG=clang-18" >> "$GITHUB_ENV"
          # libLLVM-18.so lives under the versioned prefix; put it on the loader
          # path so the freshly-linked scalyc_seed can start.
          echo "LD_LIBRARY_PATH=$(llvm-config-18 --libdir)" >> "$GITHUB_ENV"
          # Make lld the default linker: stock GNU BFD ld fails to link
          # libLLVM-18 ("failed to set dynamic section sizes"), and the
          # compiler's own -o bootstrap link (cli.run) invokes plain `clang`
          # (default ld) — so `ld` itself must be lld, not just seed.sh's links.
          sudo update-alternatives --install /usr/bin/ld ld \
            "$(command -v ld.lld-18 || command -v ld.lld)" 100

      - name: Build + verify seed (bootstrap, link, hello, AOT, fixed point)
        run: tools/seed.sh

      - name: Cross-emit sanity (--target all six object formats)
        run: tests/target/run.sh dist/seed/scalyc_seed

      # Stage 7 (Windows port), first rung. The suite above proves we EMIT a
      # COFF object for Win64; this hands one to a real Windows runner to prove
      # it LINKS and RUNS. hello.scaly is the one AOT test that pulls nothing
      # from libscaly.a — its only undefined symbol is `puts` (MSVC CRT) — so
      # this rung needs NONE of the four substrate brocken (fcontext-Win64,
      # IOCP, Win32 externs, COFF toolchain). Emitting here rather than on the
      # Windows runner is deliberate: only `llc` must be LLVM-18, and that is
      # already installed in this leg, so the Windows job needs no LLVM at all.
      - name: Cross-emit the Windows objects
        run: |
          S=dist/seed/scalyc_seed
          # rung 1: pulls nothing from the runtime (only `puts`).
          $S -c --target x86_64-pc-windows-msvc -o hello.o tests/aot/hello.scaly
          # rung 3: the runtime itself, and a program that leans on it. Plain
          # -c, never -c -O2: with no main to anchor them, GlobalDCE deletes
          # every linkonce_odr body and the object comes out empty (CLAUDE.md).
          $S -c --target x86_64-pc-windows-msvc --no-prelude --no-tests \
             -o libscaly_win.o packages/scaly/0.1.0/scaly.scaly
          $S -c --target x86_64-pc-windows-msvc \
             -o page_chain_depth.o tests/aot/page_chain_depth.scaly
          # rung 4: the fiber context switch, which no earlier rung RUNS.
          $S -c --target x86_64-pc-windows-msvc \
             -o pingpong.o tests/fiber/pingpong.scaly
          # rung 6: the 10k demo. It lives in tests/fiber/bench/, OUTSIDE the
          # corpus glob, so rung 5 never emitted it — one long program under
          # load rather than a corpus entry, and it is the only thing in the
          # tree that drives IOCP from the SCHEDULER at scale.
          $S -c --target x86_64-pc-windows-msvc \
             -o http10k.o tests/fiber/bench/http10k.scaly
          ls -l hello.o libscaly_win.o page_chain_depth.o pingpong.o http10k.o
          # rung 5: breadth. One object per test that carries its own ground
          # truth; the two that need a reference binary are skipped and counted.
          tests/win32/corpus.sh emit "$S" winobj

      - name: Upload the Windows objects
        uses: actions/upload-artifact@v7
        with:
          name: win-objects
          path: |
            hello.o
            libscaly_win.o
            page_chain_depth.o
            pingpong.o
            http10k.o
            winobj/*.o
          if-no-files-found: error

      # OpenSP port REALPASS gate (dazzle epic, Part I). AOT-compiles the opensp
      # package into an archive and links + runs its unit harness so
      # opensp.test() genuinely executes (the old --jit route false-passed).
      # Builds /tmp/libscaly.a itself if absent.
      - name: OpenSP unit suite (dazzle port REALPASS)
        run: tests/opensp/run.sh dist/seed/scalyc_seed

      - name: Fiber suite (context-switch ping-pong, milestone 1.1)
        run: tests/fiber/run.sh dist/seed/scalyc_seed

      - name: The 10k demo (fiber-per-connection HTTP, milestone 1.6)
        run: tests/fiber/bench/run.sh dist/seed/scalyc_seed

      # tools/seed.sh above links scalyls from FRESHLY emitted IR; this is the
      # only place the COMMITTED seed/scalyls*.ll get linked and served — and
      # it keeps verify-seed.sh itself from silently going stale (its scalyls
      # link recipe once drifted for months because nothing executed it).
      - name: Verify committed seed (hello, AOT, regress, scalyls link+smoke)
        run: tools/verify-seed.sh dist/seed/scalyc_seed

      - name: Upload native compiler
        # v7, not v5: upload-artifact@v5 still declares `using: node20` and kept
        # warning about the Node-20 deprecation (checkout@v5 is already node24).
        # node24 arrives here only with v6; v7 is the current major.
        uses: actions/upload-artifact@v7
        with:
          name: scalyc-x86_64-linux-gnu
          path: dist/seed/scalyc_seed
          if-no-files-found: error

  # Stage 7, rung 1: link + run the cross-emitted object on real Windows.
  #
  # A SECOND leg is back, and the cost note above is why it is this one and not
  # a macOS leg: for private repos GitHub bills Windows at 2x the Linux rate and
  # macOS at 10x. This job downloads one object, links it and runs it — a couple
  # of minutes, so ~4 billed minutes, against the ~30 a macOS bootstrap would
  # cost. It installs NOTHING: the object is already emitted, and CLAUDE.md's
  # rule is that only `llc` must be LLVM-18 while any clang links.
  #
  # What rung 1 deliberately does NOT prove: nothing of the runtime substrate
  # (no fibers, no evented I/O, no Win32 externs, no libscaly.a) and nothing
  # about the seed reproducing on Windows. Those are the later rungs; keeping
  # them separate is the same sequencing rule the roadmap applies to the port
  # itself — never debug two unknowns at once.
  #
  # Rung 2a (below, same job): COMPILE the Win64 POSIX-compat shim. It is the
  # cheapest possible feedback on brocken 3 — the whole shim is written on a
  # host that cannot compile a line of it, so "does it build against the real
  # Windows SDK" is the first thing worth knowing and costs seconds. It does
  # not link or run it yet; that needs the rest of the substrate.
  windows:
    name: x86_64-pc-windows-msvc (link + run)
    needs: seed
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download the Windows objects
        uses: actions/download-artifact@v7
        with:
          name: win-objects

      - name: Toolchain
        shell: bash
        run: clang --version

      - name: Link against the MSVC CRT and run
        shell: bash
        run: |
          set -e
          # clang's MSVC toolchain detection locates Visual Studio and the
          # Windows SDK itself, which is why this is a clang driver call rather
          # than a bare lld-link: the CRT search paths come for free.
          clang --target=x86_64-pc-windows-msvc hello.o -o hello.exe
          # `puts` writes CRLF on Windows; strip the CR or the compare fails on
          # an invisible byte. The expected line is read from the test source so
          # the two cannot drift apart.
          ./hello.exe | tr -d '\r' > got.txt
          sed -n 's/^; Expected: //p' tests/aot/hello.scaly > want.txt
          echo "--- want ---"; cat want.txt
          echo "--- got  ---"; cat got.txt
          diff -u want.txt got.txt

      # Rung 2a — brocken 3. -Wall -Wextra -Werror on purpose: this shim is
      # written blind on a POSIX host, so a warning here is the only signal
      # that a Win32 contract was misread (a wrong VirtualFree argument, a
      # WSAPOLLFD width, an implicit declaration from a missing header). It
      # must never be downgraded to a plain build "because it is only a shim" —
      # a shim nobody can run locally is exactly the code that needs the
      # strictest compile it can get.
      #
      # ★It compiles ALL THREE Windows C files, not just brocken 3's, and
      # keeps going past the first failure (2026-08-10). "Does it compile" is
      # not a per-rung fact: the later rungs compile eio_win.c and ctime.c, so
      # with `set -e` and one file per step a job reports ONE compile error per
      # CI round — and a round is 12-16 minutes. Since none of these files can
      # be compiled on the host that writes them, the round IS the compiler,
      # and it should answer every question it can in one pass.
      - name: Compile the Win64 C shims (brocken 3, and every other shim)
        shell: bash
        run: |
          set -u
          rc=0
          for f in packages/scaly/0.1.0/scaly/win32/posixcompat.c \
                   packages/scaly/0.1.0/scaly/fiber/eio_win.c \
                   packages/scaly/0.1.0/scaly/time/ctime.c; do
            o=$(basename "$f" .c).o
            echo "--- $f ---"
            clang --target=x86_64-pc-windows-msvc -O2 -Wall -Wextra -Werror \
                  -c "$f" -o "$o" || rc=1
          done
          [ "$rc" = 0 ] || { echo "one or more shims failed to compile"; exit 1; }
          echo "--- symbols provided by posixcompat ---"
          # Informative only: a missing llvm-nm must not fail the rung, whose
          # claim is "it compiles", not "we can list it".
          llvm-nm --defined-only posixcompat.o | sed 's/^/  /' \
            || echo "  (llvm-nm unavailable — compile still succeeded)"

      # Rung 2b — brocken 1. Assembling proves the ABI-mechanical half: the
      # register names exist, the SEH pseudo-ops are well-formed, the segment
      # overrides assemble, and every offset is in range. It proves NOTHING
      # about whether the switch is correct — a wrong TIB offset or a
      # misaligned XMM save assembles perfectly and crashes at run time. That
      # is the item CI cannot debug (see the roadmap), so it is worth being
      # explicit about what this rung does and does not buy.
      - name: Assemble the Win64 fiber context switch (brocken 1)
        shell: bash
        run: |
          set -e
          clang --target=x86_64-pc-windows-msvc \
                -c packages/scaly/0.1.0/scaly/fiber/fcontext_x86_64_win.S \
                -o fcontext_win.o
          echo "--- symbols provided ---"
          llvm-nm --defined-only fcontext_win.o | sed 's/^/  /' \
            || echo "  (llvm-nm unavailable — assemble still succeeded)"

      # Rung 2c — brocken 2, and this one RUNS. The IOCP backend is the only
      # part of the port that had to manufacture semantics instead of
      # translating them (kqueue/epoll report readiness, IOCP reports
      # completion), so "it compiles" would be worth very little. The harness
      # links two objects and no Scaly runtime, which is what lets it run now
      # rather than after the whole substrate is done — the riskiest piece
      # tested first instead of last.
      - name: Build and RUN the IOCP smoke test (brocken 2)
        shell: bash
        run: |
          set -e
          clang --target=x86_64-pc-windows-msvc -O2 -Wall -Wextra -Werror \
                -c packages/scaly/0.1.0/scaly/fiber/eio_win.c -o eio_win.o
          clang --target=x86_64-pc-windows-msvc -O2 -Wall -Wextra -Werror \
                -c packages/scaly/0.1.0/scaly/win32/posixcompat.c -o pc.o
          clang --target=x86_64-pc-windows-msvc -O2 \
                tests/win32/eio_smoke.c eio_win.o pc.o \
                -o eio_smoke.exe -lws2_32
          ./eio_smoke.exe

      # Rung 4a — brocken 1, the half rung 4 cannot see. pingpong proves the
      # switch WORKS; it holds no live float or vector state across a jump, so a
      # switch that had forgotten XMM6-15 entirely would still print the right
      # thing. Those ten registers plus RSI and RDI are exactly what Win64 adds
      # to the SysV callee-saved set: the likeliest place for a mistake, and the
      # one whose failure is a wrong NUMBER rather than a crash.
      #
      # Both halves of the harness are assembly on purpose — a C driver cannot
      # guarantee the compiler keeps anything in a callee-saved register, and
      # the fiber has to DESTROY them or a missing save and a missing restore
      # cancel into a green test. The reasoning is written out in xmm_check.S.
      - name: Check callee-saved preservation across the switch (rung 4a)
        shell: bash
        run: |
          set -e
          clang --target=x86_64-pc-windows-msvc \
                -c tests/win32/xmm_check.S -o xmm_check.o
          clang --target=x86_64-pc-windows-msvc -O2 \
                tests/win32/fcontext_smoke.c xmm_check.o fcontext_win.o \
                eio_win.o pc.o -o fcontext_smoke.exe -lws2_32
          ./fcontext_smoke.exe

      # Rung 3 — brocken 4, and the one that finally links the RUNTIME. Every
      # rung so far tested a piece in isolation; this one puts all five brocken
      # in one binary, because the archive is a single object with a single
      # .text section and a COFF linker can discard nothing — a program that
      # touches the runtime at all must resolve every symbol it references.
      # tools/win-undef.sh answers that by grep; this answers it with a linker.
      #
      # page_chain_depth is the payload on purpose: it hammers the page
      # allocator, which is exactly what the scaly_aligned_alloc/free pair
      # feeds, and it is the first thing here that RUNS the fiber context
      # switch's neighbourhood rather than just assembling it.
      - name: Archive the runtime and RUN a program on it (rung 3)
        shell: bash
        run: |
          set -e
          clang --target=x86_64-pc-windows-msvc -O2 -Wall -Wextra -Werror \
                -c packages/scaly/0.1.0/scaly/time/ctime.c -o ctime.o
          # eio_win.o, pc.o and fcontext_win.o come from the rungs above.
          llvm-ar rcs libscaly.lib libscaly_win.o eio_win.o ctime.o pc.o fcontext_win.o
          echo "--- archive members ---"
          llvm-ar t libscaly.lib | sed 's/^/  /'
          # No -lm: the math the tensor kernels need is in the MSVC CRT, so the
          # rule that -lm must come LAST on ELF has no counterpart here.
          clang --target=x86_64-pc-windows-msvc \
                page_chain_depth.o libscaly.lib -lws2_32 -o pcd.exe
          ./pcd.exe | tr -d '\r' > got.txt
          sed -n 's/^; Expected: //p' tests/aot/page_chain_depth.scaly > want.txt
          echo "--- want ---"; cat want.txt
          echo "--- got  ---"; cat got.txt
          diff -u want.txt got.txt

      # Rung 4 — brocken 1, RUN at last. Everything before this only assembled
      # and linked fcontext_x86_64_win.S; nothing called it. pingpong is the
      # milestone-1.1 demonstrator and drives scaly_make_context /
      # scaly_jump_context directly, six switches deep, so it is the first
      # thing that exercises the Win64 half of the ABI the file had to get
      # right blind: RCX/RDX/R8 arguments, the 32-byte shadow space the
      # trampoline reserves before entering the fiber, XMM6-15 across the
      # switch, and the TIB stack bounds swapped on every jump.
      #
      # This is the rung the roadmap says CI cannot debug — a wrong offset here
      # is a bare crash, not a message. It can only tell us THAT it is wrong.
      - name: Run the fiber context switch (rung 4, brocken 1)
        shell: bash
        run: |
          set -e
          clang --target=x86_64-pc-windows-msvc \
                pingpong.o libscaly.lib -lws2_32 -o pingpong.exe
          # The exit code is reported explicitly, and the run is NOT piped:
          # the first red run here exited 0 with empty output, and a pipeline
          # hides which of the two facts is the surprising one. A Windows
          # exception surfaces as its code (0xC0000005 access violation,
          # 0xC000001D illegal instruction from the never-return trap), which
          # is the only diagnosis CI can offer for this rung.
          set +e
          ./pingpong.exe > got_raw.txt 2>&1
          rc=$?
          set -e
          echo "pingpong.exe exit code: $rc"
          tr -d '\r' < got_raw.txt > got.txt
          sed -n 's/^; Expected: //p' tests/fiber/pingpong.scaly > want.txt
          echo "--- want ---"; cat want.txt
          echo "--- got  ---"; cat got.txt
          diff -u want.txt got.txt

      # Rung 5 — BREADTH. Every rung above ran one program per mechanism; this
      # runs the whole AOT and fiber corpora — 90 programs, each linked against
      # the archive rung 3 built and checked against the ground truth in its own
      # source. It is where the fiber suite's threads, channels, guard page and
      # deadlock detectors meet Windows for the first time, and therefore the
      # first place the write-readiness caveat of a zero-byte WSASend could
      # surface. Every run is under a 60 s timeout: a hang would stall the job to
      # its six-hour limit and teach nothing. Two tests are skipped and counted —
      # they have no self-contained ground truth and are cross-checked against a
      # reference binary on POSIX, which cannot exist here.
      - name: Run the AOT + fiber corpora (rung 5)
        shell: bash
        run: tests/win32/corpus.sh run winobj libscaly.lib

      # Rung 6 — the 10k demo, and the unknown it adds is LOAD. Rung 5 ran 90
      # programs, but each one drives the poller with a handful of fds; this is
      # 10,000 connections through one single-threaded scheduler, so it is the
      # first time IOCP is driven BY THE SCHEDULER at scale rather than by a
      # test that happens to do I/O. Two things can only show up here:
      #
      #   * the write-readiness caveat documented at scaly_eio_arm — a zero-byte
      #     WSASend is armed for writability and Winsock generally completes it
      #     at once, which degrades to a spin where kqueue/epoll would block.
      #     One connection cannot show that; 10,000 parked handlers can, and it
      #     would show up as TIME rather than as a wrong answer, which is why
      #     the elapsed seconds are printed even on success (POSIX: ~1 s).
      #   * AcceptEx's inverted accept path under repetition — the setup loop
      #     pairs connect+accept 10,000 times against ONE listener, where the
      #     completion table holds one slot per listener.
      #
      # NOT reusing tests/fiber/bench/run.sh: its whole preamble is POSIX
      # (raising RLIMIT_NOFILE to 20,500 and gating on kern.maxfilesperproc,
      # plus topping up /tmp/libscaly.a with `ar`). None of it has a counterpart
      # here — Windows sockets are handles, not CRT descriptors, so no soft
      # limit governs them, and the archive is the one rung 3 built. What is
      # left of that script once the POSIX half is removed is link, run,
      # compare — which is what this step is.
      #
      # ★If it fails, the demo's own exit codes are the diagnosis map, which is
      # why the code is printed and the run is NOT piped: 1 = listen/local_port,
      # 2 = accept, 3 = a handler's read, 4 = connect, 5 = write, 6 = the
      # read-back. Exit 4 has a Windows-specific first suspect — 10,000
      # CONCURRENT outbound loopback connections against a default dynamic port
      # range of 49152-65535, i.e. 16,384 ports shared with whatever TIME_WAIT
      # the earlier rungs left behind.
      - name: Run the 10k demo (rung 6)
        shell: bash
        run: |
          set -e
          clang --target=x86_64-pc-windows-msvc \
                http10k.o libscaly.lib -lws2_32 -o http10k.exe
          # A hang is the one outcome worse than a failure: without a guard it
          # would stall the job to its six-hour limit and teach nothing. 300 s
          # against a POSIX runtime of about one second is not a performance
          # bar, it is a liveness bar.
          set +e
          SECONDS=0
          timeout 300 ./http10k.exe > got_raw.txt 2> err.txt
          rc=$?
          elapsed=$SECONDS
          set -e
          echo "http10k.exe exit code: $rc after ${elapsed}s"
          if [ -s err.txt ]; then
            echo "--- stderr ---"; head -c 600 err.txt
          fi
          if [ "$rc" = 124 ]; then
            echo "TIMEOUT: the demo did not finish in 300 s"
            exit 1
          fi
          tr -d '\r' < got_raw.txt > got.txt
          sed -n 's/^; Expected: //p' tests/fiber/bench/http10k.scaly > want.txt
          echo "--- want ---"; cat want.txt
          echo "--- got  ---"; cat got.txt
          diff -u want.txt got.txt
