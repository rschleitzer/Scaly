name: LLVM 21 toolchain
description: >
  Install and configure the LLVM 21 toolchain the seed pipeline needs, and
  export the environment the scripts read. Extracted 2026-08-10 when the Linux
  leg was split into an emit job and a verify job: both need this block, and a
  second copy is a second thing to get wrong — the reasoning below was paid for
  once (see CLAUDE.md on -lm and on lld) and should not be duplicated.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y llvm-21 llvm-21-dev clang-21 lld-21 libclang-rt-21-dev python3
        # seed.sh links with $CLANG; Ubuntu ships clang-21, not a bare `clang`.
        echo "CLANG=clang-21" >> "$GITHUB_ENV"
        # libLLVM-21.so lives under the versioned prefix; put it on the loader
        # path so the freshly-linked scalyc_seed can start.
        echo "LD_LIBRARY_PATH=$(llvm-config-21 --libdir)" >> "$GITHUB_ENV"
        # Make lld the default linker: stock GNU BFD ld fails to link
        # libLLVM-21 ("failed to set dynamic section sizes"), and the
        # compiler's own -o bootstrap link (cli.run) invokes plain `clang`
        # (default ld) — so `ld` itself must be lld, not just seed.sh's links.
        sudo update-alternatives --install /usr/bin/ld ld \
          "$(command -v ld.lld-21 || command -v ld.lld)" 100
